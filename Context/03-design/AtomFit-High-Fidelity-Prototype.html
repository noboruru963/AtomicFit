<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AtomFit Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#2563eb;--pd:#1d4ed8;--pl:#dbeafe;--bg:#f4f7fe;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--out:#cfdbf5;--dg:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#3b82f6;--pd:#2563eb;--pl:#1e3a8a;--bg:#0b1220;--card:#131c2e;--tx:#e8eefc;--mu:#94a3b8;--ln:#24304a;--out:#05080f}}
:root[data-theme="dark"]{--p:#3b82f6;--pd:#2563eb;--pl:#1e3a8a;--bg:#0b1220;--card:#131c2e;--tx:#e8eefc;--mu:#94a3b8;--ln:#24304a;--out:#05080f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--out);color:var(--tx)}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:520px){#app{height:min(880px,calc(100% - 32px));margin:16px auto;border-radius:34px;box-shadow:0 20px 60px #0005}}
#v{flex:1;display:flex;flex-direction:column;min-height:0}
main{flex:1;overflow:auto;padding:18px}
.top{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:19px;flex:1;font-weight:800}
.top button{background:#ffffff30;border:0;color:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.top .ib{padding:0;width:36px;height:36px;justify-content:center}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--p);color:#fff;font-family:inherit;font-weight:600;font-size:15px;margin-top:12px;cursor:pointer}
.btn.o{background:var(--card);color:var(--p);border:1.5px solid var(--p)}
.btn.r{background:var(--card);color:var(--dg);border:1.5px solid var(--dg)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
input{width:100%;padding:13px;border:1.5px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--p);border-color:transparent}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 5px}
.c{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:12px}
.lg{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--p),#60a5fa);display:grid;place-items:center;margin:0 auto 6px;box-shadow:0 10px 30px #2563eb55}
.ctr{text-align:center}.mu{color:var(--mu);font-size:13px}
a{color:var(--p);font-weight:600;cursor:pointer;text-decoration:none}
#nav{display:none;background:var(--card);border-top:1px solid var(--ln);padding:8px 0 10px}
#nav button{flex:1;background:0;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#nav .on{color:var(--p)}
.tw{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--ln)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--pl);color:var(--pd);text-align:left;padding:9px}
[data-theme="dark"] th,:root:not([data-theme="light"]) th{color:#bfdbfe}
td{padding:6px 9px;border-top:1px solid var(--ln)}
td input{padding:6px;width:54px;text-align:center}
.en{font-weight:600;border-right:1px solid var(--ln)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1.5px solid var(--ln);border-radius:14px;margin-bottom:10px;cursor:pointer;font-weight:600}
.opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ln)}
.opt.s{border-color:var(--p);background:var(--pl)}.opt.s i{border:6px solid var(--p)}
.bar{height:6px;background:var(--ln);border-radius:9px;margin:10px 0 18px}.bar b{display:block;height:100%;background:var(--p);border-radius:9px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;text-align:center;font-size:12px}
.cg span{padding:7px 0;border-radius:9px}.cg .d{background:var(--p);color:#fff}.cg .t{outline:2px solid var(--p);font-weight:800}.cg small{color:var(--mu)}
.li{display:flex;align-items:center;gap:12px}.li>div{flex:1}
.ex{display:flex;gap:12px;align-items:center}.ex .im{width:54px;height:54px;border-radius:14px;background:var(--pl);color:var(--p);display:grid;place-items:center;flex:none}
.pl{width:38px;height:38px;border-radius:50%;border:0;background:var(--p);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.big{font-size:64px;font-weight:800;letter-spacing:2px;text-align:center;font-variant-numeric:tabular-nums;margin:20px 0}
.ov{position:absolute;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:5}
.sh{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
</style></head><body>
<div id="app"><div id="v"></div><nav id="nav"></nav><div id="toast"></div></div>
<script>
const $=s=>document.querySelector(s);
const I={home:'<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',dumb:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const panda=s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="20" cy="26" r="13" fill="#111"/><circle cx="80" cy="26" r="13" fill="#111"/><circle cx="50" cy="56" r="38" fill="#fff"/><ellipse cx="34" cy="50" rx="10" ry="13" fill="#111" transform="rotate(20 34 50)"/><ellipse cx="66" cy="50" rx="10" ry="13" fill="#111" transform="rotate(-20 66 50)"/><circle cx="35" cy="49" r="3.5" fill="#fff"/><circle cx="65" cy="49" r="3.5" fill="#fff"/><ellipse cx="50" cy="64" rx="6" ry="4" fill="#111"/><path d="M42 72q8 7 16 0" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const mk=(n,kg=10)=>({n,s:[0,1,2].map(()=>({kg,r:'',rt:120}))});
const PPL=kg=>['Dumbbell curl','Chest press','Tricep raise','Lateral pushdown'].map(n=>mk(n,kg));
let R='login',user='Joe123',pw='',Q=0,ans=[],W=null,T0=0,tm=120,run=false,iv=null,pick=null,modal=0,from='empty',sel='Push pull leg',theme='';
let hist=[{d:'2026 - 11 - 1 - 19:35',n:'Empty program(1)',ex:[{n:'Dumbell curl',s:[{kg:20,r:20,rt:90},{kg:10,r:15,rt:90},{kg:10,r:10,rt:90}]},{n:'Chest press',s:[{kg:60,r:20,rt:120},{kg:80,r:10,rt:240},{kg:100,r:5,rt:240}]}]},{d:'2026 - 10 - 29 - 20:11',n:'Empty program',ex:[mk('Chest press',50)]},{d:'2026 - 10 - 15 - 13:34',n:'Push pull leg',ex:PPL(10)}];
let hi=0;
const QS=[['What is your current fitness target?',['Muscle gain','Staying healthy','Look fit','No target']],['How many days a week can you train?',['2 days','3 days','4 days','5+ days']],['How is your energy today?',['High, ready to go','Normal','Low, take it easy']],['Do you still want to push?',['Yes, progress the weight','No, same program as last','No, reduced intensity']]];
const NAV=['home','quiz','program','start','all','ppl','current','empty','explore','history','hdetail'];
const top=(t,b)=>`<div class=top><h1>${t}</h1>${b?`<button onclick="go('${b}')">${ic('back',16)}Back</button>`:''}</div>`;
const top2=(bell)=>`<div class=top><h1>12:30</h1>${bell?`<button class=ib>${ic('bell')}</button>`:''}<button class=ib onclick="go('settings')">${ic('gear')}</button><button class=ib onclick="go('profile')">${ic('user')}</button></div>`;
const tbl=(ex,ed)=>`<div class=tw><table><tr><th>Exercise<th>Set<th>Reps<th>Rest</tr>`+ex.map((e,i)=>e.s.map((s,j)=>`<tr>${j?'':`<td rowspan=${e.s.length} class=en>${e.n==='-'?`<a onclick="from='empty';go('explore')">Pick…</a>`:e.n}</td>`}<td>${j+1} ${ed?`<input type=number value="${s.kg}" onchange="W[${i}].s[${j}].kg=this.value" style="width:46px"> kg`:`<small>(${s.kg} kg)</small>`}</td><td>${ed?`<input type=number inputmode=numeric placeholder="-" value="${s.r}" onchange="W[${i}].s[${j}].r=this.value">`:(s.r||'-')}</td><td>${ed?`<a onclick="rest(${i},${j})">${fmt(s.rt)}</a>`:fmt(s.rt)}</td></tr>`).join('')).join('')+`</table></div>`;
const addBar=()=>`<div class=c style="margin-top:12px"><div class=li onclick="addSet()" style="cursor:pointer"><div>Add more set?</div><span class=pl style="width:30px;height:30px">${ic('plus',16)}</span></div></div><div class=ctr><div class=mu>Add another exercise?</div><button class=pl style="margin:8px auto;width:52px;height:52px" onclick="from='empty';go('explore')">${ic('plus',26)}</button></div><button class=btn onclick="finish()">Finish</button>`;
const S={
login:()=>`<main style="display:flex;flex-direction:column;justify-content:center"><div class=lg>${panda(86)}</div><h2 class=ctr style="margin:6px 0 0;font-size:28px">AtomFit</h2><p class="ctr mu" style="margin:0 0 18px">Every rep counts.</p><label>Email</label><input id=em type=email placeholder="you@email.com" value="Gymrat123@gmail.com"><label>Password</label><input type=password placeholder="••••••••"><p style="margin:10px 0"><a onclick="toast('Reset link sent')">Forgot password?</a></p><button class=btn onclick="go('home')">Login</button><p class="ctr mu">Don’t have an account? <a onclick="go('register')">Register here</a></p></main>`,
register:()=>`${top('Register account','login')}<main><p class=mu style="margin-top:0">Please fill in your personal data</p><label>Username</label><input id=ru placeholder="Joe123"><label>Email</label><input type=email placeholder="you@email.com"><label>Password</label><input id=p1 type=password><label>Confirm Password</label><input id=p2 type=password><label>Date of birth</label><div class=row><input placeholder="DD" maxlength=2 inputmode=numeric><input placeholder="MM" maxlength=2 inputmode=numeric><input placeholder="YYYY" maxlength=4 inputmode=numeric></div><label style="display:flex;gap:10px;align-items:center;margin-top:16px;font-size:13px"><input id=tc type=checkbox style="width:20px;height:20px">Please read our <a>terms and conditions</a></label><button class=btn onclick="reg()">Register</button></main>`,
home:()=>{let c='';for(let i=0;i<3;i++)c+='<span></span>';for(let d=1;d<=31;d++)c+=`<span class="${d==12?'t d':[1,3,5,8,10].includes(d)?'d':''}">${d==12?'✓':d}</span>`;return `${top2()}<main><div class=ctr><div class=mu>Welcome back!</div><h2 style="margin:0 0 14px;font-size:26px">${user}</h2></div><div class=c><b>October 2026</b><div class=cg>${'MTWTFSS'.split('').map(x=>`<small>${x}</small>`).join('')}${c}</div><p class=mu style="margin:12px 0 0">🔥 5 workouts this month</p></div><button class=btn onclick="W=W||PPL(10);T0=Date.now();go('current')">Continue last workout?</button><button class="btn o" onclick="Q=0;ans=[];go('quiz')">Diagnostic quiz</button></main>`},
profile:()=>`${top('Profile','home')}<main><div class=ctr><div class=lg style="width:96px;height:96px">${panda(70)}</div><a onclick="toast('Photo picker')">Change profile picture</a></div><label>Username</label><input value="${user}" id=pu><label>Email</label><input value="Gymrat123@gmail.com"><label>Date of birth</label><div class=row><input placeholder="DD"><input placeholder="MM"><input placeholder="YYYY"></div><div class=row><div><label>Weight (kg)</label><input type=number placeholder="70"></div><div><label>Height (cm)</label><input type=number placeholder="175"></div></div><div class=row><button class=btn onclick="user=$('#pu').value||user;toast('Profile updated')">Update Profile</button><button class="btn r" onclick="go('login')">Log Out Account</button></div></main>`,
settings:()=>`${top('Settings','home')}<main>${[['Display','Change the visual of the app',"theme=(document.documentElement.dataset.theme=='dark')?'light':'dark';document.documentElement.dataset.theme=theme;toast('Theme: '+theme)"],['Personalization','Adjust the app according to your needs',"toast('Coming soon')"],['About app','Information about the app and developers',"toast('AtomFit v1.0 prototype')"]].map(x=>`<div class=c onclick="${x[2]}" style="cursor:pointer"><b>${x[0]}</b><div class=mu>${x[1]}</div></div>`).join('')}</main>`,
quiz:()=>{const q=QS[Q],last=Q==QS.length-1;return `${top2(1)}<main><div class=mu>Diagnostic Quiz · ${Q+1} of ${QS.length}</div><div class=bar><b style="width:${(Q+1)/QS.length*100}%"></b></div><h2 style="margin:0 0 16px;font-size:20px">${q[0]}</h2>${q[1].map((o,k)=>`<div class="opt ${ans[Q]===k?'s':''}" onclick="ans[Q]=${k};render()"><i></i>${o}</div>`).join('')}<button class=btn ${ans[Q]==null?'disabled':''} onclick="${last?"go('program')":'Q++;render()'}">${last?'See my program':'Next question'}</button>${Q?`<button class="btn o" onclick="Q--;render()">Back</button>`:''}</main>`},
program:()=>{const a=ans[3],kg=a==0?12.5:a==2?7.5:10;return `${top('Diagnostic Quiz','quiz')}<main><p style="margin-top:0"><b>This is your adjusted current program!</b></p>${tbl(PPL(kg),0)}<button class=btn onclick="W=PPL(${kg});toast('Program accepted');go('current')">Accept?</button></main>`},
start:()=>`${top('Start workout')}<main><button class="btn o" style="margin:0 0 18px" onclick="W=[mk('-','')];W[0].s=[{kg:'',r:'',rt:120}];T0=Date.now();go('empty')">Start empty program?</button><div class=mu style="margin-bottom:8px">Programs</div><div class=c onclick="W=W||PPL(10);T0=Date.now();go('current')" style="cursor:pointer"><b>Current program</b><div class=mu>Push pull leg · 4 exercises</div></div><div class=c onclick="go('all')" style="cursor:pointer"><b>All program</b><div class=mu>Browse and edit your programs</div></div><div class=c onclick="go('program')" style="cursor:pointer"><b>Adjusted program</b><div class=mu>From your diagnostic quiz</div></div><button class="btn o" onclick="from='';go('explore')" style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:30px">${ic('search',18)}Explore exercise</button></main>`,
all:()=>`${top('All programs','start')}<main>${[['Upper Lower','Alternates upper and lower body days for balanced strength.'],['Push Pull Leg','Splits training by pushing, pulling and legs.'],['Gorilla Training','Full-body, high-volume sessions for muscle gain.']].map(x=>`<div class=c onclick="sel='${x[0]}';go('ppl')" style="cursor:pointer"><div class=li><div><b>${x[0]}</b><div class=mu>${x[1]}</div></div><span>⋮</span></div></div>`).join('')}</main>`,
ppl:()=>`${top(sel,'all')}<main>${tbl(PPL(10),0)}<button class=btn onclick="modal=1;render()">Edit program</button>${modal?`<div class=ov><div class=sh><b>Confirm edit?</b><p class=mu>Changes will update ${sel}.</p><div class=row><button class="btn o" onclick="modal=0;render()">Cancel</button><button class=btn onclick="modal=0;W=PPL(10);go('current')">Yes</button></div></div></div>`:''}</main>`,
current:()=>`${top('Current program','start')}<main>${tbl(W,1)}<button class=btn onclick="finish()">Finish</button></main>`,
empty:()=>`${top('Empty program','start')}<main>${tbl(W,1)}${addBar()}</main>`,
explore:()=>{const L=[['Barbell shoulder press','High-intensity that requires setup using a barbell. Not recommended for beginners.'],['Dumbell shoulder press','Alternative front delt exercise using 2 dumbbells. Easy setup, but dangerous with heavy weights.'],['Inverted plank','Safer alternative to plank, for people with lower energy.']];return `${top('Explore exercise',from?'empty':'start')}<main>${L.map(x=>`<div class=c><div class=ex><div class=im>${ic('dumb',28)}</div><div style="flex:1"><b>${x[0]}</b><div class=mu style="font-size:12px">${x[1]}</div></div><button class=pl onclick="addEx('${x[0]}')">${ic('plus',20)}</button></div></div>`).join('')}${pick?`<div class=ov onclick="pick=null;render()"><div class=sh onclick="event.stopPropagation()"><b>Add to which program?</b><p class=mu style="margin:2px 0 10px">${pick}</p>${['Upper lower','Push pull leg','Gorilla training'].map(p=>`<div class=c><div class=li onclick="pick=null;render();toast('Added to ${p}')" style="cursor:pointer"><div>${p}</div><span class=pl style="width:30px;height:30px">${ic('plus',16)}</span></div></div>`).join('')}</div></div>`:''}</main>`},
timer:()=>`${top('Rest Timer')}<main class=ctr><div style="color:var(--p);margin-top:30px"><svg width=110 height=110 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx=12 cy=12 r=9 /><path d="M12 7v5l3 2"/></svg></div><div class=big id=td>${fmt(tm)}</div>${run?`<button class=btn onclick="pauseT()" id=pb>Pause</button><button class="btn o" onclick="endT()">Skip</button>`:`<div class=row><button class="btn o" onclick="tm=Math.max(15,tm-15);render()">−15s</button><button class="btn o" onclick="tm+=15;render()">+15s</button></div><button class=btn onclick="startT()">Set timer</button><button class="btn o" onclick="go(from2)">Cancel</button>`}</main>`,
done:()=>{const n=W.reduce((a,e)=>a+e.s.filter(s=>s.r).length,0)||W.reduce((a,e)=>a+e.s.length,0),t=Math.max(1,Math.round((Date.now()-T0)/1000));return `<main class=ctr style="display:flex;flex-direction:column;justify-content:center"><h1 style="margin:0;font-size:34px">Workout</h1><div class=mu style="font-size:18px">Completed!</div><div class=lg style="width:190px;height:190px;margin:22px auto;animation:pop .6s">${panda(150)}</div><div class=c style="text-align:left"><div class=mu>Total Time</div><b style="font-size:26px">${fmt(t)}</b><div class=mu style="margin-top:8px">Total Set</div><b style="font-size:26px">${n}</b></div><button class=btn onclick="go('home')">Go to home page</button></main><style>@keyframes pop{from{transform:scale(.3)}60%{transform:scale(1.1)}}</style>`},
history:()=>`${top('History')}<main><div style="position:relative;margin-bottom:14px"><input placeholder="Search workouts" oninput="hq=this.value;lst()" style="padding-left:40px"><span style="position:absolute;left:12px;top:12px;color:var(--mu)">${ic('search',20)}</span></div><div id=hl></div></main>`,
hdetail:()=>`${top(hist[hi].n,'history')}<main><div class=mu style="margin:0 0 10px">${hist[hi].d}</div>${tbl(hist[hi].ex,0)}</main>`
};
let hq='',from2='current';
function lst(){const e=$('#hl');if(!e)return;e.innerHTML=hist.map((h,i)=>h.n.toLowerCase().includes(hq.toLowerCase())?`<div class=mu style="margin:12px 0 5px">${h.d}</div><div class=li><div class=c style="margin:0;padding:14px;cursor:pointer" onclick="hi=${i};go('hdetail')"><b>${h.n}</b></div><button class=pl style="background:var(--card);color:var(--dg);border:1px solid var(--ln);border-radius:12px;width:48px;height:48px" onclick="hist.splice(${i},1);lst();toast('Deleted')">${ic('trash',20)}</button></div>`:'').join('')||'<p class="ctr mu">No workouts found</p>'}
function render(){$('#v').innerHTML=S[R]();const n=NAV.includes(R);$('#nav').style.display=n?'flex':'none';const tab=R=='home'||R=='quiz'||R=='program'?'home':R=='history'||R=='hdetail'?'history':'start';$('#nav').innerHTML=[['history','book','History'],['home','home','Home'],['start','dumb','Start workout']].map(x=>`<button class="${x[0]==tab?'on':''}" onclick="go('${x[0]}')">${ic(x[1],24)}${x[2]}</button>`).join('');lst()}
function go(r){R=r;modal=0;pick=null;render()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function reg(){if($('#p1').value!==$('#p2').value)return toast('Passwords do not match');if(!$('#tc').checked)return toast('Please accept the terms');user=$('#ru').value||user;toast('Account created');go('login')}
function addSet(){const e=W[W.length-1],l=e.s[e.s.length-1];e.s.push({kg:l.kg,r:'',rt:l.rt});render()}
function addEx(n){if(from){W.length==1&&W[0].n=='-'?W[0].n=n:W.push(mk(n,10));toast('Added to workout');go('empty')}else{pick=n;render()}}
function rest(i,j){tm=W[i].s[j].rt;from2=R;go('timer')}
function tick(){const e=$('#td');if(!e)return;if(tm<=0){navigator.vibrate&&navigator.vibrate(300);return endT()}tm--;e.textContent=fmt(tm)}
function startT(){run=true;render();iv=setInterval(tick,1000)}
function pauseT(){const b=$('#pb');if(iv){clearInterval(iv);iv=null;b.textContent='Resume'}else{iv=setInterval(tick,1000);b.textContent='Pause'}}
function endT(){clearInterval(iv);iv=null;run=false;go(from2)}
function finish(){const d=new Date(),p=x=>String(x).padStart(2,'0');hist.unshift({d:`${d.getFullYear()} - ${d.getMonth()+1} - ${d.getDate()} - ${p(d.getHours())}:${p(d.getMinutes())}`,n:R=='empty'?'Empty program':'Current program',ex:JSON.parse(JSON.stringify(W))});go('done')}
render();
</script></body></html>
