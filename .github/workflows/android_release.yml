name: Build AtomFit Android Release (.aab & .apk)

on:
  workflow_dispatch: # Allows 1-click manual run in GitHub Actions tab
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout AtomicFit Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17 (on GitHub Cloud Server)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter SDK (on GitHub Cloud Server)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Configure Release Signing Keystore
        working-directory: apps/mobile_flutter/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using saved KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
            cat <<EOP > key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOP
          else
            echo "No KEYSTORE_BASE64 secret found yet — generating a fresh upload-keystore.jks in the cloud..."
            keytool -genkey -v -keystore app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass atomfit2026 -keypass atomfit2026 \
              -dname "CN=AtomFit, OU=Mobile, O=AtomFit, L=Jakarta, S=DKI, C=ID"
            base64 -w 0 app/upload-keystore.jks > app/upload-keystore-base64.txt
            cat <<EOP > key.properties
          storePassword=atomfit2026
          keyPassword=atomfit2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOP
          fi

      - name: 5. Install Flutter Packages & Build Signed .aab and .apk
        working-directory: apps/mobile_flutter
        run: |
          flutter pub get
          flutter build appbundle --release
          flutter build apk --release

      - name: 6. Upload Google Play Bundle (.aab) & Phone Installer (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: AtomFit-GooglePlay-Release-Bundle
          path: |
            apps/mobile_flutter/build/app/outputs/bundle/release/app-release.aab
            apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile_flutter/android/app/upload-keystore.jks
            apps/mobile_flutter/android/app/upload-keystore-base64.txt
