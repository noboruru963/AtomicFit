name: Build Android Release Bundle & APK

on:
  workflow_dispatch: # Allows clicking "Run workflow" manually anytime from the GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Auto-detect Flutter app directory
        id: find_dir
        run: |
          echo "Scanning repository for pubspec.yaml..."
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: Could not find pubspec.yaml in repository!"
            exit 1
          fi
          APP_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Detected Flutter project in: $APP_DIR"
          echo "app_dir=$APP_DIR" >> $GITHUB_OUTPUT

      - name: 5. Install dependencies and build Android APK & AAB
        working-directory: ${{ steps.find_dir.outputs.app_dir }}
        run: |
          echo "Running flutter pub get..."
          flutter pub get

          echo "Building APK..."
          # Build APK (fat APK or split per ABI)
          flutter build apk --release || flutter build apk --debug

          echo "Building App Bundle (.aab) for Google Play..."
          flutter build appbundle --release || echo "AAB build skipped or unconfigured signing"

      - name: 6. Upload Built Artifacts (.apk & .aab)
        uses: actions/upload-artifact@v4
        with:
          name: atomicfit-android-builds
          path: |
            ${{ steps.find_dir.outputs.app_dir }}/build/app/outputs/flutter-apk/*.apk
            ${{ steps.find_dir.outputs.app_dir }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
