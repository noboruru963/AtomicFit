name: atomfit
description: "AtomFit — Adaptive Workout Tracker. Log it. Keep going."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Local persistence — mirrors the web prototype's single `atomfit_app_v23` blob.
  # Swap point for a future Firebase implementation (see lib/data/README.md).
  shared_preferences: ^2.2.3
  # Date formatting ("Oct 18, 17:30").
  intl: ^0.18.1
  # Rest-timer completion bell (assets/bell.mp3).
  audioplayers: ^6.1.0
  # Background rest-timer notification (Android).
  flutter_local_notifications: ^17.2.3
  # Debug-only "HTML reference" screen (loads index.html in a WebView).
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bell.mp3
    - assets/images/logo.jpg
    - index.html
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
