                '</select>' +
              '</div>' +
              '<button type="button" onclick="navigateApp(\'discover\')" class="af-btn-tint !py-2 !px-3 text-xs mt-5 shrink-0">+ Add exercise</button>' +
            '</div>' +

            '<div class="grid grid-cols-2 gap-3">' +
              '<div class="space-y-1">' +
                '<label class="text-xs font-semibold af-text-muted" for="active-weight-input">Weight (kg)</label>' +
                '<input id="active-weight-input" type="number" step="0.5" oninput="updateWeightInput(this.value)" class="af-input text-center font-extrabold text-lg" value="' + escapeHtml(aw.weightInput) + '" />' +
              '</div>' +
              '<div class="space-y-1">' +
                '<label class="text-xs font-semibold af-text-muted" for="active-reps-input">Rep counter</label>' +
                '<input id="active-reps-input" type="number" oninput="updateRepsInput(this.value)" class="af-input text-center font-extrabold text-lg" value="' + aw.repsInput + '" />' +
              '</div>' +
            '</div>' +

            '<!-- Quick Counter Buttons (+1 rep, +1 set) -->' +
            '<div class="grid grid-cols-3 gap-2 pt-1">' +
              '<button type="button" onclick="incrementRepCounter(1)" class="af-btn-secondary !py-2 text-xs">+1 rep</button>' +
              '<button type="button" onclick="incrementRepCounter(-1)" class="af-btn-secondary !py-2 text-xs">-1 rep</button>' +
              '<button type="button" onclick="logCurrentSet()" class="af-btn-primary !py-2 text-xs">+1 set (Add set)</button>' +
            '</div>' +
          '</div>' +

          '<!-- Rest Timer Card -->' +
          '<div class="af-card p-4 space-y-3">' +
            '<div class="flex items-center justify-between">' +
              '<div class="flex items-center gap-2">' +
                '<span class="text-xs font-bold uppercase tracking-wider af-text-muted">Rest timer</span>' +
                '<span class="af-badge ' + (aw.restRunning ? 'af-badge-green' : 'af-badge-blue') + ' text-[10px]">' + (aw.restRunning ? 'Running' : 'Ready') + '</span>' +
              '</div>' +
              '<div class="flex items-center gap-1">' +
                '<button type="button" onclick="setRestPreset(60)" class="px-2 py-0.5 rounded text-[11px] font-semibold af-subtle hover:opacity-80">60s</button>' +
                '<button type="button" onclick="setRestPreset(90)" class="px-2 py-0.5 rounded text-[11px] font-semibold af-subtle hover:opacity-80">90s</button>' +
                '<button type="button" onclick="setRestPreset(120)" class="px-2 py-0.5 rounded text-[11px] font-semibold af-subtle hover:opacity-80">120s</button>' +
              '</div>' +
            '</div>' +

            '<div class="flex items-center justify-between gap-3">' +
              '<div id="rest-timer-display" class="text-2xl font-extrabold tracking-tight" style="color: var(--accent);">' + formatMMSS(aw.restSeconds) + '</div>' +
              '<div class="flex items-center gap-1.5">' +
                '<button type="button" onclick="toggleRestTimer()" class="af-btn-primary !py-1.5 !px-3.5 text-xs">' + (aw.restRunning ? 'Pause' : (aw.restSeconds < aw.restTotalSeconds ? 'Resume' : 'Set timer')) + '</button>' +
                '<button type="button" onclick="skipRestTimer()" class="af-btn-secondary !py-1.5 !px-3 text-xs">Skip</button>' +
                '<button type="button" onclick="cancelRestTimer()" class="af-btn-secondary !py-1.5 !px-3 text-xs">Cancel</button>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<!-- Logged Sets List -->' +
          '<div class="af-card p-4 space-y-2.5">' +
            '<div class="flex items-center justify-between">' +
              '<h2 class="text-sm font-bold">Logged Sets (' + aw.sets.length + ')</h2>' +
              '<span class="text-xs af-text-muted">Total Vol: <strong>' + computeActiveVolume() + ' kg</strong></span>' +
            '</div>' +
            '<div class="space-y-1.5">' +
              (setsRowsHtml || '<p class="text-xs af-text-muted py-2 text-center">No sets logged yet. Tap "+1 set (Add set)" above.</p>') +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function computeActiveVolume() {
      var total = 0;
      appState.activeWorkout.sets.forEach(function(s) {
        total += (Number(s.weightKg) || 0) * (Number(s.reps) || 0);
      });
      return Math.round(total * 10) / 10;
    }

    function switchInputMethod(method) {
      stopSensorSimulation();
      appState.activeWorkout.inputMethod = method;
      renderCurrentScreen();
    }

    function changeActiveExercise(exName) {
      appState.activeWorkout.currentExercise = exName;
      for (var i = 0; i < appState.catalogue.length; i++) {
        if (appState.catalogue[i].name === exName) {
          appState.activeWorkout.weightInput = String(appState.catalogue[i].defaultKg);
          appState.activeWorkout.repsInput = appState.catalogue[i].defaultReps;
          break;
        }
      }
      renderCurrentScreen();
    }

    function updateWeightInput(val) {
      appState.activeWorkout.weightInput = val;
    }

    function updateRepsInput(val) {
      appState.activeWorkout.repsInput = Math.max(0, parseInt(val || '0', 10));
    }

    function incrementRepCounter(delta) {
      appState.activeWorkout.repsInput = Math.max(0, (Number(appState.activeWorkout.repsInput) || 0) + delta);
      var input = document.getElementById('active-reps-input');
      if (input) input.value = appState.activeWorkout.repsInput;
    }

    function toggleSessionType() {
      appState.activeWorkout.sessionType = (appState.activeWorkout.sessionType === 'full') ? 'micro' : 'full';
      renderCurrentScreen();
      showToast('Session mode switched to ' + appState.activeWorkout.sessionType.toUpperCase(), 'info');
    }

    function logCurrentSet() {
      var aw = appState.activeWorkout;
      var w = parseFloat(aw.weightInput) || 0;
      var r = parseInt(aw.repsInput, 10) || 1;
      var newSet = {
        id: 'ws_' + Date.now() + '_' + Math.floor(Math.random() * 100),
        exerciseName: aw.currentExercise,
        setNo: aw.sets.length + 1,
        weightKg: w,
        reps: r,
        restS: aw.restTotalSeconds,
        inputMethod: aw.inputMethod
      };
      aw.sets.push(newSet);
      startRestTimerCountdown();
      renderCurrentScreen();
      showToast('Saved Set #' + newSet.setNo + ': ' + newSet.exerciseName + ' (' + w + ' kg × ' + r + ')');
    }

    function removeLoggedSet(setId) {
      appState.activeWorkout.sets = appState.activeWorkout.sets.filter(function(s) {
        return s.id !== setId;
      });
      renderCurrentScreen();
    }

    function toggleSensorSimulation() {
      var aw = appState.activeWorkout;
      if (aw.sensorSimActive) {
        stopSensorSimulation();
        renderCurrentScreen();
        showToast('Accelerometer auto-count stopped.', 'info');
      } else {
        aw.sensorSimActive = true;
        renderCurrentScreen();
        sensorIntervalId = setInterval(function() {
          aw.repsInput = (Number(aw.repsInput) || 0) + 1;
          var repEl = document.getElementById('active-reps-input');
          if (repEl) repEl.value = aw.repsInput;
        }, 1100);
      }
    }

    function stopSensorSimulation() {
      if (sensorIntervalId) {
        clearInterval(sensorIntervalId);
        sensorIntervalId = null;
      }
      if (appState && appState.activeWorkout) {
        appState.activeWorkout.sensorSimActive = false;
      }
    }

    function parseVoiceSet() {
      var inputEl = document.getElementById('voice-command-input');
      var raw = inputEl ? inputEl.value.trim() : appState.activeWorkout.voiceSimText;
      appState.activeWorkout.voiceSimText = raw;
      var numbers = raw.match(/\d+(\.\d+)?/g);
      if (numbers && numbers.length >= 2) {
        appState.activeWorkout.weightInput = String(numbers[0]);
        appState.activeWorkout.repsInput = parseInt(numbers[1], 10);
      }
      logCurrentSet();
    }

    function setRestPreset(seconds) {
      appState.activeWorkout.restTotalSeconds = seconds;
      appState.activeWorkout.restSeconds = seconds;
      renderCurrentScreen();
    }

    function startRestTimerCountdown() {
      if (restIntervalId) clearInterval(restIntervalId);
      appState.activeWorkout.restRunning = true;
      restIntervalId = setInterval(function() {
        if (appState.activeWorkout.restSeconds > 0) {
          appState.activeWorkout.restSeconds--;
          var disp = document.getElementById('rest-timer-display');
          if (disp) disp.textContent = formatMMSS(appState.activeWorkout.restSeconds);
        } else {
          clearInterval(restIntervalId);
          restIntervalId = null;
          appState.activeWorkout.restRunning = false;
          appState.activeWorkout.restSeconds = appState.activeWorkout.restTotalSeconds;
          showToast('Rest timer complete! Ready for next set.');
          if (appState.currentScreen === 'active-workout') renderCurrentScreen();
        }
      }, 1000);
    }

    function toggleRestTimer() {
      if (appState.activeWorkout.restRunning) {
        if (restIntervalId) clearInterval(restIntervalId);
        restIntervalId = null;
        appState.activeWorkout.restRunning = false;
        renderCurrentScreen();
      } else {
        startRestTimerCountdown();
        renderCurrentScreen();
      }
    }

    function skipRestTimer() {
      if (restIntervalId) clearInterval(restIntervalId);
      restIntervalId = null;
      appState.activeWorkout.restRunning = false;
      appState.activeWorkout.restSeconds = 0;
      renderCurrentScreen();
      showToast('Rest skipped.');
    }

    function cancelRestTimer() {
      if (restIntervalId) clearInterval(restIntervalId);
      restIntervalId = null;
      appState.activeWorkout.restRunning = false;
      appState.activeWorkout.restSeconds = appState.activeWorkout.restTotalSeconds;
      renderCurrentScreen();
    }

    function finishActiveWorkout() {
      stopSensorSimulation();
      if (restIntervalId) {
        clearInterval(restIntervalId);
        restIntervalId = null;
      }
      appState.activeWorkout.restRunning = false;

      var aw = appState.activeWorkout;
      var totalSets = aw.sets.length;
      var totalReps = 0;
      var totalVol = 0;
      var methodsMap = {};

      aw.sets.forEach(function(s) {
        totalReps += Number(s.reps) || 0;
        totalVol += (Number(s.weightKg) || 0) * (Number(s.reps) || 0);
        methodsMap[s.inputMethod] = true;
      });

      if (totalSets === 0) {
        totalSets = 3;
        totalReps = 30;
        totalVol = 450;
        methodsMap['manual'] = true;
      }

      var methodsArr = Object.keys(methodsMap);
      var durMin = aw.sessionType === 'micro' ? 6 : 32;

      appState.lastCompletedWorkout = {
        name: aw.sessionName,
        type: aw.sessionType,
        durationMin: durMin,
        totalSets: totalSets,
        totalReps: totalReps,
        totalVolume: Math.round(totalVol * 10) / 10,
        methods: methodsArr
      };

      appState.history.unshift({
        id: 's_' + Date.now(),
        name: aw.sessionName,
        type: aw.sessionType,
        date: 'Oct 19, 13:00',
        dayOfMonth: 19,
        durationMin: durMin,
        reps: totalReps,
        volume: Math.round(totalVol * 10) / 10,
        setsCount: totalSets,
        methods: methodsArr,
        setsDetail: aw.sets.slice()
      });

      aw.sets = [];
      saveStateToStorage();
      navigateApp('workout-complete');
      showToast('Workout completed and saved to History!');
    }

    // -------------------------------------------------------------------------
    // 10. WORKOUT COMPLETE SCREEN (/workout/complete)
    // -------------------------------------------------------------------------
    function renderWorkoutCompleteScreen() {
      var lw = appState.lastCompletedWorkout;
      return '' +
        '<div class="py-6 space-y-5">' +
          '<div class="af-card p-6 text-center space-y-4">' +
            '<div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl shadow-sm" style="background-color: var(--success-tint); color: var(--success);">✓</div>' +
            '<div class="space-y-1">' +
              '<span class="af-badge af-badge-green uppercase">' + escapeHtml(lw.type) + ' session saved</span>' +
              '<h1 class="text-2xl font-extrabold tracking-tight pt-1">Workout completed</h1>' +
              '<p class="text-xs af-text-muted">Log it. Keep going. • ' + escapeHtml(lw.name) + '</p>' +
            '</div>' +

            '<div class="grid grid-cols-2 gap-3 pt-2">' +
              '<div class="af-subtle p-3.5 text-center">' +
                '<div class="text-xs af-text-muted">Total time</div>' +
                '<div class="text-lg font-extrabold mt-0.5">' + lw.durationMin + ' min</div>' +
              '</div>' +
              '<div class="af-subtle p-3.5 text-center">' +
                '<div class="text-xs af-text-muted">Total sets</div>' +
                '<div class="text-lg font-extrabold mt-0.5">' + lw.totalSets + '</div>' +
              '</div>' +
              '<div class="af-subtle p-3.5 text-center">' +
                '<div class="text-xs af-text-muted">Total Volume</div>' +
                '<div class="text-lg font-extrabold mt-0.5" style="color: var(--accent);">' + lw.totalVolume + ' kg</div>' +
              '</div>' +
              '<div class="af-subtle p-3.5 text-center">' +
                '<div class="text-xs af-text-muted">Total Reps</div>' +
                '<div class="text-lg font-extrabold mt-0.5">' + lw.totalReps + '</div>' +
              '</div>' +
            '</div>' +

            '<div class="af-subtle p-3 text-xs flex items-center justify-between">' +
              '<span class="af-text-muted">Input channels used:</span>' +
              '<span class="font-bold uppercase">' + escapeHtml(lw.methods.join(', ')) + '</span>' +
            '</div>' +

            '<div class="pt-2 space-y-2">' +
              '<button type="button" onclick="navigateApp(\'home\')" class="af-btn-primary w-full text-sm">Go to home page</button>' +
              '<button type="button" onclick="navigateApp(\'history\')" class="af-btn-secondary w-full text-xs">View in Workout History</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    // -------------------------------------------------------------------------
    // 11. HISTORY SCREEN (/history) — Including Workout Stitching Service
    // -------------------------------------------------------------------------
    function renderHistoryScreen() {
      var filters = ['All', 'Full', 'Micro', 'Stitched'];
      var filterButtons = filters.map(function(f) {
        var active = (appState.historyFilter.toLowerCase() === f.toLowerCase());
        return '<button type="button" onclick="setHistoryFilter(\'' + f + '\')" class="' + (active ? 'af-btn-primary !py-1.5 !px-3.5 text-xs' : 'af-btn-secondary !py-1.5 !px-3.5 text-xs') + '">' + f + '</button>';
      }).join('');

      var microSessions = appState.history.filter(function(h) { return h.type === 'micro'; });
      var stitchBannerHtml = '';
      if (microSessions.length >= 2) {
        stitchBannerHtml = '' +
          '<div class="af-card p-3.5 flex items-center justify-between gap-3 border-l-4" style="border-left-color: var(--accent);">' +
            '<div>' +
              '<div class="text-xs font-bold">Workout Stitching Available (' + microSessions.length + ' Micro Sessions)</div>' +
              '<div class="text-[11px] af-text-muted">Combine fragmented micro-workouts into one unified Stitched session.</div>' +
            '</div>' +
            '<button type="button" onclick="stitchMicroSessions()" class="af-btn-tint !py-1.5 !px-3 text-xs shrink-0">Stitch Micros</button>' +
          '</div>';
      }

      var query = appState.historySearch.trim().toLowerCase();
      var list = appState.history.filter(function(h) {
        var matchFilter = (appState.historyFilter === 'All') || (h.type.toLowerCase() === appState.historyFilter.toLowerCase());
        var matchSearch = !query || h.name.toLowerCase().indexOf(query) !== -1;
        return matchFilter && matchSearch;
      });

      var cardsHtml = list.map(function(h) {
        var badgeClass = h.type === 'stitched' ? 'af-badge-amber' : (h.type === 'micro' ? 'af-badge-green' : 'af-badge-blue');
        var badgeLabel = h.type === 'stitched' ? 'Stitched' : (h.type === 'micro' ? 'Micro' : 'Full');

        var childrenHtml = '';
        if (h.type === 'stitched' && h.children && h.children.length) {
          childrenHtml = '' +
            '<div class="af-subtle p-2.5 space-y-1 text-[11px]">' +
              '<div class="font-bold af-text-muted">Stitched from ' + h.children.length + ' micro-sessions:</div>' +
              h.children.map(function(c) {
                return '<div class="flex items-center justify-between"><span>• ' + escapeHtml(c.name) + '</span><span>' + c.volume + ' kg (' + c.reps + ' reps)</span></div>';
              }).join('') +
            '</div>';
        }

        return '' +
          '<div class="af-card p-4 space-y-3">' +
            '<div class="flex items-start justify-between gap-2">' +
              '<div>' +
                '<div class="flex items-center gap-2">' +
                  '<h3 class="text-sm font-bold">' + escapeHtml(h.name) + '</h3>' +
                  '<span class="af-badge ' + badgeClass + ' text-[10px]">' + badgeLabel + '</span>' +
                '</div>' +
                '<p class="text-xs af-text-muted mt-0.5">' + escapeHtml(h.date) + '</p>' +
              '</div>' +
              '<div class="text-right">' +
                '<div class="text-sm font-extrabold" style="color: var(--accent);">' + h.volume + ' kg</div>' +
                '<div class="text-[11px] af-text-muted">' + h.reps + ' reps</div>' +
              '</div>' +
            '</div>' +

            childrenHtml +

            '<div class="flex items-center justify-end gap-2 pt-1 border-t af-border">' +
              (h.type === 'stitched' ? '<button type="button" onclick="unstitchSession(\'' + h.id + '\')" class="af-btn-tint !py-1 !px-3 text-xs">Unstitch</button>' : '') +
              '<button type="button" onclick="openHistoryDetailModal(\'' + h.id + '\')" class="af-btn-secondary !py-1 !px-3 text-xs">Detail</button>' +
              '<button type="button" onclick="confirmDeleteSession(\'' + h.id + '\')" class="af-btn-danger !py-1 !px-3 text-xs">Delete</button>' +
            '</div>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="space-y-4">' +
          '<div>' +
            '<h1 class="text-xl font-extrabold tracking-tight">History</h1>' +
            '<p class="text-xs af-text-muted">Completed sessions, micro-workouts, and stitched logs</p>' +
          '</div>' +

          '<div class="space-y-2.5">' +
            '<input id="history-search-input" type="text" oninput="updateHistorySearch(this.value)" value="' + escapeHtml(appState.historySearch) + '" class="af-input text-xs" placeholder="Search by program name" />' +
            '<div class="flex flex-wrap gap-1.5">' +
              filterButtons +
            '</div>' +
          '</div>' +

          stitchBannerHtml +

          '<div class="space-y-3">' +
            (cardsHtml || '<div class="af-card p-6 text-center text-xs af-text-muted">No workouts found</div>') +
          '</div>' +
        '</div>';
    }

    function setHistoryFilter(f) {
      appState.historyFilter = f;
      renderCurrentScreen();
    }

    function updateHistorySearch(val) {
      appState.historySearch = val;
      renderCurrentScreen();
      var el = document.getElementById('history-search-input');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }

    function unstitchSession(sessionId) {
      var targetIdx = -1;
      for (var i = 0; i < appState.history.length; i++) {
        if (appState.history[i].id === sessionId) {
          targetIdx = i;
          break;
        }
      }
      if (targetIdx === -1) return;
      var item = appState.history[targetIdx];
      var children = (item.children && item.children.length) ? item.children : [
        { id: item.id + '_1', name: item.name + ' (Part 1)', type: 'micro', date: item.date, dayOfMonth: item.dayOfMonth, durationMin: 12, reps: Math.floor(item.reps / 2), volume: Math.round(item.volume / 2), setsCount: 2, methods: ['manual'] },
        { id: item.id + '_2', name: item.name + ' (Part 2)', type: 'micro', date: item.date, dayOfMonth: item.dayOfMonth, durationMin: 14, reps: item.reps - Math.floor(item.reps / 2), volume: item.volume - Math.round(item.volume / 2), setsCount: 2, methods: ['voice'] }
      ];
      appState.history.splice(targetIdx, 1, children[0], children[1]);
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Unstitched into ' + children.length + ' individual Micro sessions!');
    }

    function stitchMicroSessions() {
      var micros = [];
      var others = [];
      appState.history.forEach(function(h) {
        if (h.type === 'micro' && micros.length < 2) micros.push(h);
        else others.push(h);
      });
      if (micros.length < 2) return;
      var combinedReps = micros[0].reps + micros[1].reps;
      var combinedVol = micros[0].volume + micros[1].volume;
      var stitched = {
        id: 's_stitched_' + Date.now(),
        name: micros[0].name + ' + ' + micros[1].name,
        type: 'stitched',
        date: micros[0].date,
        dayOfMonth: micros[0].dayOfMonth || 18,
        durationMin: (micros[0].durationMin || 8) + (micros[1].durationMin || 8),
        reps: combinedReps,
        volume: combinedVol,
        setsCount: (micros[0].setsCount || 2) + (micros[1].setsCount || 2),
        methods: ['manual', 'lockscreen'],
        children: micros
      };
      others.unshift(stitched);
      appState.history = others;
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Stitched 2 micro-sessions into a unified workout!');
    }

    function openHistoryDetailModal(sessionId) {
      var item = null;
      for (var i = 0; i < appState.history.length; i++) {
        if (appState.history[i].id === sessionId) {
          item = appState.history[i];
          break;
        }
      }
      if (!item) return;

      var setsList = (item.setsDetail && item.setsDetail.length)
        ? item.setsDetail.map(function(s, idx) {
            return '<div class="flex items-center justify-between text-xs py-1.5 border-b last:border-b-0 af-border">' +
              '<span><strong>#' + (idx + 1) + ' ' + escapeHtml(s.exerciseName) + '</strong></span>' +
              '<span>' + s.weightKg + ' kg × ' + s.reps + ' (' + escapeHtml(s.inputMethod) + ')</span>' +
            '</div>';
          }).join('')
        : '<div class="text-xs af-text-muted">Total ' + item.reps + ' reps across ' + (item.setsCount || 3) + ' logged sets.</div>';

      openModal(
        item.name + ' • Detail',
        '<div class="space-y-3">' +
          '<div class="flex items-center justify-between text-xs">' +
            '<span class="af-text-muted">' + escapeHtml(item.date) + '</span>' +
            '<span class="af-badge af-badge-blue uppercase">' + escapeHtml(item.type) + '</span>' +
          '</div>' +
          '<div class="grid grid-cols-2 gap-2 text-center">' +
            '<div class="af-subtle p-2.5"><div class="text-[11px] af-text-muted">Total Volume</div><div class="font-bold text-sm">' + item.volume + ' kg</div></div>' +
            '<div class="af-subtle p-2.5"><div class="text-[11px] af-text-muted">Total Reps</div><div class="font-bold text-sm">' + item.reps + ' reps</div></div>' +
          '</div>' +
          '<div class="af-subtle p-3 space-y-1">' + setsList + '</div>' +
        '</div>',
        '<button type="button" onclick="closeModal()" class="af-btn-primary text-xs">Done</button>'
      );
    }

    function confirmDeleteSession(sessionId) {
      openModal(
        'Delete this session?',
        '<p class="text-xs af-text-muted">This will remove the workout log from your local AtomFit history.</p>',
        '<button type="button" onclick="closeModal()" class="af-btn-secondary text-xs">Cancel</button>' +
        '<button type="button" onclick="executeDeleteSession(\'' + sessionId + '\')" class="af-btn-danger text-xs">Delete</button>'
      );
    }

    function executeDeleteSession(sessionId) {
      appState.history = appState.history.filter(function(h) { return h.id !== sessionId; });
      saveStateToStorage();
      closeModal();
      renderCurrentScreen();
      showToast('Session deleted', 'danger');
    }

    // -------------------------------------------------------------------------
    // 12. DISCOVER SCREEN (/discover)
    // -------------------------------------------------------------------------
    function renderDiscoverScreen() {
      var cats = ['All', 'Shoulders', 'Chest', 'Arms', 'Back & Core'];
      var catPills = cats.map(function(c) {
        var active = (appState.catalogueFilter === c);
        return '<button type="button" onclick="setCatalogueFilter(\'' + c + '\')" class="' + (active ? 'af-btn-primary !py-1.5 !px-3 text-xs' : 'af-btn-secondary !py-1.5 !px-3 text-xs') + '">' + c + '</button>';
      }).join('');

      var q = appState.catalogueSearch.trim().toLowerCase();
      var items = appState.catalogue.filter(function(ex) {
        var matchCat = (appState.catalogueFilter === 'All') || (ex.category === appState.catalogueFilter);
        var matchQ = !q || ex.name.toLowerCase().indexOf(q) !== -1 || ex.description.toLowerCase().indexOf(q) !== -1;
        return matchCat && matchQ;
      });

      var listHtml = items.map(function(ex) {
        return '' +
          '<div class="af-card p-4 flex items-center justify-between gap-3">' +
            '<div class="space-y-1">' +
              '<div class="flex items-center gap-2">' +
                '<h3 class="text-sm font-bold">' + escapeHtml(ex.name) + '</h3>' +
                '<span class="af-badge af-badge-blue text-[10px]">' + escapeHtml(ex.category) + '</span>' +
              '</div>' +
              '<p class="text-xs af-text-muted">' + escapeHtml(ex.description) + '</p>' +
              '<p class="text-[11px] font-semibold" style="color: var(--accent);">Suggested: ' + ex.defaultKg + ' kg × ' + ex.defaultReps + ' reps</p>' +
            '</div>' +
            '<button type="button" onclick="addExerciseFromDiscover(\'' + escapeHtml(ex.name) + '\')" class="af-btn-tint !py-1.5 !px-3.5 text-xs shrink-0">Add</button>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="space-y-4">' +
          '<div>' +
            '<h1 class="text-xl font-extrabold tracking-tight">Discover</h1>' +
            '<p class="text-xs af-text-muted">Exercise catalogue · Tap Add to load into your active workout</p>' +
          '</div>' +

          '<div class="space-y-2.5">' +
            '<input id="discover-search-input" type="text" oninput="updateCatalogueSearch(this.value)" value="' + escapeHtml(appState.catalogueSearch) + '" class="af-input text-xs" placeholder="Explore exercise..." />' +
            '<div class="flex flex-wrap gap-1.5">' +
              catPills +
            '</div>' +
          '</div>' +

          '<div class="space-y-2.5">' +
            (listHtml || '<div class="af-card p-6 text-center text-xs af-text-muted">No matching exercises in catalogue.</div>') +
          '</div>' +
        '</div>';
    }

    function setCatalogueFilter(cat) {
      appState.catalogueFilter = cat;
      renderCurrentScreen();
    }

    function updateCatalogueSearch(val) {
      appState.catalogueSearch = val;
      renderCurrentScreen();
      var el = document.getElementById('discover-search-input');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }

    function addExerciseFromDiscover(exName) {
      appState.activeWorkout.currentExercise = exName;
      for (var i = 0; i < appState.catalogue.length; i++) {
        if (appState.catalogue[i].name === exName) {
          appState.activeWorkout.weightInput = String(appState.catalogue[i].defaultKg);
          appState.activeWorkout.repsInput = appState.catalogue[i].defaultReps;
          break;
        }
      }
      showToast('Added "' + exName + '" to Active Workout!');
      navigateApp('active-workout');
    }

    function saveProfileChanges() {
      appState.user.username = document.getElementById('prof-username').value.trim() || 'Alex';
      appState.user.email = document.getElementById('prof-email').value.trim() || 'alex@example.com';
      appState.user.gender = document.getElementById('prof-gender').value;
      appState.user.dobMonth = document.getElementById('prof-month').value;
      appState.user.weightKg = document.getElementById('prof-weight').value;
      appState.user.heightCm = document.getElementById('prof-height').value;
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Profile updated!');
    }

    function renderSettingsScreen() {
      var s = appState.settings;
      return '' +
        '<div class="space-y-4">' +
          '<div class="flex items-center justify-between">' +
            '<div>' +
              '<h1 class="text-xl font-extrabold tracking-tight">Settings</h1>' +
              '<p class="text-xs af-text-muted">Appearance, hardware adapters, and local storage</p>' +
            '</div>' +
            '<button type="button" onclick="navigateApp(\'profile\')" class="af-btn-secondary !py-1.5 !px-3 text-xs">← Profile</button>' +
          '</div>' +

          '<!-- Appearance Section -->' +
          '<div class="af-card p-4 space-y-3">' +
            '<h2 class="text-sm font-bold">Appearance (app_theme.dart)</h2>' +
            '<div class="grid grid-cols-2 gap-2.5">' +
              '<button type="button" onclick="setThemeExplicit(false)" class="' + (!appState.isDarkMode ? 'af-btn-primary text-xs' : 'af-btn-secondary text-xs') + '">' +
                '☀️ Light (#F4F7FE)' +
              '</button>' +
              '<button type="button" onclick="setThemeExplicit(true)" class="' + (appState.isDarkMode ? 'af-btn-primary text-xs' : 'af-btn-secondary text-xs') + '">' +
                '🌙 Dark (#0B1220)' +
              '</button>' +
            '</div>' +
          '</div>' +

          '<!-- Device & Input Channel Toggles -->' +
          '<div class="af-card p-4 space-y-3">' +
            '<h2 class="text-sm font-bold">Hardware & Input Channels (packages/device)</h2>' +
            renderSettingToggleRow('sensorAutoDetect', 'Sensor Auto-Detect (Accelerometer)', 'Automatically count reps during active sets', s.sensorAutoDetect) +
            renderSettingToggleRow('voiceLogging', 'Voice Logging (Speech-to-Set)', 'Log weight and reps hands-free via voice commands', s.voiceLogging) +
            renderSettingToggleRow('lockscreenWidget', 'Lock Screen Quick-Log Widget', 'Enable 1-tap micro-workout set logging from lock screen', s.lockscreenWidget) +
            renderSettingToggleRow('hapticFeedback', 'Haptic Rest Timer Alerts', 'Vibrate when rest timer reaches 00:00', s.hapticFeedback) +
          '</div>' +

          '<!-- Adaptive Quiz & Demo Reset -->' +
          '<div class="af-card p-4 space-y-2.5">' +
            '<h2 class="text-sm font-bold">Adaptive Engine & State</h2>' +
            '<div class="flex flex-wrap gap-2">' +
              '<button type="button" onclick="retriggerQuizBanner()" class="af-btn-tint text-xs flex-1">Trigger Inactivity Quiz</button>' +
              '<button type="button" onclick="resetDemoState()" class="af-btn-secondary text-xs flex-1">Reset Seeded Data</button>' +
            '</div>' +
          '</div>' +

          '<button type="button" onclick="handleLogout()" class="af-btn-danger w-full text-xs">Log out</button>' +
        '</div>';
    }

    function renderSettingToggleRow(key, title, desc, checked) {
      return '' +
        '<div class="flex items-center justify-between gap-3 py-1.5 border-b last:border-b-0 af-border">' +
          '<div>' +
            '<div class="text-xs font-bold">' + escapeHtml(title) + '</div>' +
            '<div class="text-[11px] af-text-muted">' + escapeHtml(desc) + '</div>' +
          '</div>' +
          '<button type="button" onclick="toggleDeviceSetting(\'' + key + '\')" class="w-11 h-6 rounded-full p-0.5 transition-colors flex items-center ' + (checked ? 'justify-end' : 'justify-start') + '" style="background-color: ' + (checked ? 'var(--accent)' : 'var(--border-line)') + ';">' +
            '<span class="w-5 h-5 rounded-full bg-white shadow"></span>' +
          '</button>' +
        '</div>';
    }

    function toggleDeviceSetting(key) {
      appState.settings[key] = !appState.settings[key];
      renderCurrentScreen();
      showToast('Updated ' + key + ' preference');
    }

    function retriggerQuizBanner() {
      appState.showQuizBannerOnHome = true;
      navigateApp('quiz-prompt');
      showToast('Inactivity Quiz Prompt triggered!', 'info');
    }

    function resetDemoState() {
      appState.programs = JSON.parse(JSON.stringify(DEFAULT_PROGRAMS));
      appState.history = JSON.parse(JSON.stringify(DEFAULT_HISTORY));
      appState.isProgramAdjusted = false;
      appState.showQuizBannerOnHome = true;
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Demo data restored to original GitHub defaults.');
    }

    function handleLogout() {
      appState.isLoggedIn = false;
      navigateApp('login');
      showToast('Logged out of AtomFit.', 'info');
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Initialize app on load
    window.onload = function() {
      loadSavedState();
      applyThemeClass();
      renderCurrentScreen();
    };
  </script>
</body>
