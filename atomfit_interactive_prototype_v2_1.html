<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtomFit — Interactive Prototype (v2.1)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #F4F7FE;
      --bg-card: #FFFFFF;
      --bg-subtle: #EDF2FC;
      --text-primary: #0F172A;
      --text-muted: #64748B;
      --border-line: #E2E8F0;
      --accent: #2563EB;
      --accent-dark: #1D4ED8;
      --accent-tint: #DBEAFE;
      --accent-tint-text: #1E40AF;
      --danger: #DC2626;
      --danger-tint: #FEE2E2;
      --success: #16A34A;
      --success-tint: #DCFCE7;
      --warning: #D97706;
      --warning-tint: #FEF3C7;
      --radius-card: 18px;
      --radius-input: 12px;
      --radius-pill: 999px;
      --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
    }

    html.dark-theme {
      --bg-page: #0B1220;
      --bg-card: #131C2E;
      --bg-subtle: #1A263D;
      --text-primary: #E8EEFC;
      --text-muted: #94A3B8;
      --border-line: #24304A;
      --accent: #2563EB;
      --accent-dark: #3B82F6;
      --accent-tint: #1E3A8A;
      --accent-tint-text: #BFDBFE;
      --danger: #EF4444;
      --danger-tint: #451A1A;
      --success: #22C55E;
      --success-tint: #143523;
      --warning: #F59E0B;
      --warning-tint: #3D2810;
      --shadow-card: 0 8px 24px -4px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      transition: background-color 0.2s ease, color 0.2s ease;
      overflow-x: hidden;
    }

    .af-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .af-subtle {
      background-color: var(--bg-subtle);
      border-radius: var(--radius-input);
    }

    .af-input {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1.5px solid var(--border-line);
      border-radius: var(--radius-input);
      padding: 0.65rem 0.9rem;
      width: 100%;
      font-size: 0.925rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .af-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    .af-btn-primary {
      background-color: var(--accent);
      color: #FFFFFF;
      border-radius: var(--radius-pill);
      font-weight: 600;
      padding: 0.72rem 1.35rem;
      transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      border: none;
    }

    .af-btn-primary:hover {
      background-color: var(--accent-dark);
    }

    .af-btn-primary:active {
      transform: scale(0.985);
    }

    .af-btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1.5px solid var(--border-line);
      border-radius: var(--radius-pill);
      font-weight: 600;
      padding: 0.68rem 1.25rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      cursor: pointer;
    }

    .af-btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .af-btn-tint {
      background-color: var(--accent-tint);
      color: var(--accent-tint-text);
      border-radius: var(--radius-pill);
      font-weight: 600;
      padding: 0.55rem 1.05rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s ease;
    }

    .af-btn-tint:hover {
      opacity: 0.9;
    }

    .af-btn-danger {
      background-color: var(--danger-tint);
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: var(--radius-pill);
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      cursor: pointer;
    }

    .af-badge {
      border-radius: var(--radius-pill);
      padding: 0.22rem 0.68rem;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .af-badge-blue {
      background-color: var(--accent-tint);
      color: var(--accent-tint-text);
    }

    .af-badge-green {
      background-color: var(--success-tint);
      color: var(--success);
    }

    .af-badge-amber {
      background-color: var(--warning-tint);
      color: var(--warning);
    }

    .af-text-muted {
      color: var(--text-muted);
    }

    .af-border {
      border-color: var(--border-line);
    }

    /* Device Frame Mode vs Adaptive Expanded Mode */
    .phone-frame-wrapper {
      max-width: 440px;
      margin: 0 auto;
      border-radius: 34px;
      border: 6px solid var(--border-line);
      background-color: var(--bg-page);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
      overflow: hidden;
      min-height: 760px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .expanded-frame-wrapper {
      max-width: 1080px;
      margin: 0 auto;
      background-color: var(--bg-page);
      min-height: 720px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 0.35; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .sensor-pulse {
      animation: pulseRing 1.4s infinite ease-in-out;
    }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 999px;
    }
  </style>
</head>
<body class="min-h-screen pb-10">

  <!-- TOP PROTOTYPE INSPECTOR BAR -->
  <header class="sticky top-0 z-40 border-b af-border backdrop-blur-md bg-opacity-90" style="background-color: var(--bg-card);">
    <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <!-- Brand + Prototype Tag -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white font-extrabold text-sm shadow-sm" style="background-color: var(--accent);">
          AF
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm tracking-tight">AtomFit Prototype</span>
            <span class="af-badge af-badge-blue text-[11px]">v2.1 • 14 Figma Screens</span>
          </div>
          <p class="text-[11px] af-text-muted hidden sm:block">Log it. Keep going. • Local-First Adaptive Workout Tracker</p>
        </div>
      </div>

      <!-- Screen Jump Selector & Frame / Theme Controls -->
      <div class="flex flex-wrap items-center gap-2">
        <label for="screen-jump-select" class="text-xs font-medium af-text-muted hidden md:inline">Figma Screen:</label>
        <select id="screen-jump-select" onchange="jumpToScreen(this.value)" class="af-input !w-auto !py-1.5 !px-2.5 text-xs font-medium cursor-pointer">
          <optgroup label="1. Authentication Flow">
            <option value="login">01 • Login Screen (/login)</option>
            <option value="register">02 • Register Screen (/register)</option>
          </optgroup>
          <optgroup label="2. Main Bottom-Nav Tabs">
            <option value="home" selected>03 • Home Dashboard (/home)</option>
            <option value="programs">08 • My Programs (/programs)</option>
            <option value="history">11 • Workout History & Stitching (/history)</option>
            <option value="discover">12 • Discover Catalogue (/discover)</option>
            <option value="profile">13 • User Profile (/profile)</option>
          </optgroup>
          <optgroup label="3. Adaptive Quiz Flow">
            <option value="quiz-prompt">04 • Quiz Prompt (/quiz/prompt)</option>
            <option value="quiz-question">05 • Quiz Questions 1–10 (/quiz/question)</option>
            <option value="quiz-explainer">06 • Quiz Explainer (/quiz/explainer)</option>
            <option value="quiz-adjusted">07 • Adjusted Program (/quiz/adjusted-program)</option>
          </optgroup>
          <optgroup label="4. Active Session & Settings">
            <option value="active-workout">09 • Active Workout Logger (/workout/active)</option>
            <option value="workout-complete">10 • Workout Complete (/workout/complete)</option>
            <option value="settings">14 • Settings & Theme (/settings)</option>
          </optgroup>
        </select>

        <!-- View Mode Toggle (Phone Frame vs Expanded) -->
        <button type="button" onclick="toggleViewportFrame()" id="btn-frame-toggle" class="af-btn-secondary !py-1.5 !px-3 text-xs" title="Switch between Mobile Frame and Full Canvas View">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          <span id="frame-toggle-label">Mobile Frame</span>
        </button>

        <!-- Theme Toggle (#F4F7FE Light vs #0B1220 Dark) -->
        <button type="button" onclick="toggleThemeMode()" id="btn-theme-toggle" class="af-btn-secondary !py-1.5 !px-3 text-xs" title="Toggle Light (#F4F7FE) / Dark (#0B1220) theme">
          <span id="theme-toggle-icon">🌙</span>
          <span id="theme-toggle-label">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN PROTOTYPE STAGE -->
  <main class="px-2 sm:px-4 pt-4">
    <div id="prototype-frame" class="phone-frame-wrapper">

      <!-- Simulated Mobile Status Bar (shown in Mobile Frame mode) -->
      <div id="mobile-status-bar" class="px-5 pt-2.5 pb-1.5 flex items-center justify-between text-[11px] font-semibold select-none border-b af-border" style="background-color: var(--bg-card);">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full" style="background-color: var(--success);"></span>
          <span class="af-text-muted text-[10px]">Local-First DB</span>

        </div>

    // Safe localStorage persistence
    function loadSavedState() {
      try {
        var raw = localStorage.getItem('atomfit_prototype_v21');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.user) {
            appState.isDarkMode = !!parsed.isDarkMode;
            appState.user = parsed.user;
            if (parsed.history && parsed.history.length) appState.history = parsed.history;
            if (parsed.programs && parsed.programs.length) appState.programs = parsed.programs;
            if (parsed.isProgramAdjusted !== undefined) appState.isProgramAdjusted = parsed.isProgramAdjusted;
          }
        }
      } catch (err) {
        // Ignore storage errors in sandboxed iframe
      }
    }

    function saveStateToStorage() {
      try {
        localStorage.setItem('atomfit_prototype_v21', JSON.stringify({
          isDarkMode: appState.isDarkMode,
          user: appState.user,
          history: appState.history,
          programs: appState.programs,
          isProgramAdjusted: appState.isProgramAdjusted
        }));

      }

    var toastTimer = null;
    function showToast(message, type) {
      var toast = document.getElementById('app-toast');
      var textEl = document.getElementById('app-toast-text');
      var iconEl = document.getElementById('app-toast-icon');
      if (!toast || !textEl) return;
      textEl.textContent = message;
      iconEl.style.backgroundColor = type === 'danger' ? '#EF4444' : (type === 'info' ? '#3B82F6' : '#22C55E');
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2800);
    }

    function openModal(title, bodyHtml, actionsHtml) {
      var backdrop = document.getElementById('app-modal-backdrop');
      document.getElementById('app-modal-title').textContent = title;
      document.getElementById('app-modal-body').innerHTML = bodyHtml;
      document.getElementById('app-modal-actions').innerHTML = actionsHtml || '<button type="button" onclick="closeModal()" class="af-btn-primary text-xs">Close</button>';
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      var backdrop = document.getElementById('app-modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function applyThemeClass() {
      var root = document.documentElement;
      var iconEl = document.getElementById('theme-toggle-icon');
      var labelEl = document.getElementById('theme-toggle-label');
      if (appState.isDarkMode) {
        root.classList.add('dark-theme');
        if (iconEl) iconEl.textContent = '☀️';
        if (labelEl) labelEl.textContent = 'Light';
      } else {
        root.classList.remove('dark-theme');
        if (iconEl) iconEl.textContent = '🌙';
        if (labelEl) labelEl.textContent = 'Dark';
      }
    }

    function toggleThemeMode() {
      appState.isDarkMode = !appState.isDarkMode;
      applyThemeClass();
      saveStateToStorage();
      renderCurrentScreen();
      showToast(appState.isDarkMode ? 'Switched to Dark Theme (#0B1220)' : 'Switched to Light Theme (#F4F7FE)', 'info');
    }

    function setThemeExplicit(isDark) {
      appState.isDarkMode = isDark;
      applyThemeClass();
      saveStateToStorage();
      renderCurrentScreen();
      showToast(isDark ? 'Dark mode enabled' : 'Light mode enabled', 'info');
    }

    function toggleViewportFrame() {
      appState.isPhoneFrame = !appState.isPhoneFrame;
      var frame = document.getElementById('prototype-frame');
      var status = document.getElementById('mobile-status-bar');
      var label = document.getElementById('frame-toggle-label');
      if (appState.isPhoneFrame) {
        frame.className = 'phone-frame-wrapper';
        status.classList.remove('hidden');
        label.textContent = 'Mobile Frame';
      } else {
        frame.className = 'expanded-frame-wrapper';
        status.classList.add('hidden');
        label.textContent = 'Full Canvas';
      }
      renderCurrentScreen();
    }

    function jumpToScreen(screenId) {
      navigateApp(screenId);
    }

    function navigateApp(screenId) {
      stopSensorSimulation();
      appState.currentScreen = screenId;
      var select = document.getElementById('screen-jump-select');
      if (select && select.value !== screenId) {
        select.value = screenId;
      }
      renderCurrentScreen();
      var viewport = document.getElementById('screen-viewport');
      if (viewport) viewport.scrollTop = 0;
    }

    function updateChromeBars() {
      var topBar = document.getElementById('app-top-bar');
      var bottomNav = document.getElementById('app-bottom-nav');
      var draftCountEl = document.getElementById('header-draft-sets-count');
      var adjPill = document.getElementById('adjusted-active-pill');

      if (draftCountEl) {
        draftCountEl.textContent = appState.activeWorkout.sets.length + ' sets logged';
      }
      if (adjPill) {
        if (appState.isProgramAdjusted) adjPill.classList.remove('hidden');
        else adjPill.classList.add('hidden');
      }

      var isAuthScreen = (appState.currentScreen === 'login' || appState.currentScreen === 'register');
      if (topBar) {
        topBar.style.display = isAuthScreen ? 'none' : 'flex';
      }
      if (bottomNav) {
        bottomNav.style.display = isAuthScreen ? 'none' : 'flex';
      }

      var navButtons = document.querySelectorAll('.nav-tab-btn');
      navButtons.forEach(function(btn) {
        var target = btn.getAttribute('data-nav');
        if (target === appState.currentScreen) {
          btn.style.color = 'var(--accent)';
          btn.style.backgroundColor = 'var(--accent-tint)';
        } else {
          btn.style.color = 'var(--text-muted)';
          btn.style.backgroundColor = 'transparent';
        }
      });
    }

    function getActiveProgram() {
      for (var i = 0; i < appState.programs.length; i++) {
        if (appState.programs[i].active) return appState.programs[i];

      return appState.programs[0];

          container.innerHTML = renderProfileScreen();
          break;
        case 'settings':
          container.innerHTML = renderSettingsScreen();
          break;
        default:
          container.innerHTML = renderHomeScreen();
      }
    }

    // -------------------------------------------------------------------------
    // 1. LOGIN SCREEN (/login)
    // -------------------------------------------------------------------------
    function renderLoginScreen() {
      return '' +
        '<div class="py-6 px-2 space-y-6">' +
          '<div class="text-center space-y-2">' +
            '<div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-white font-extrabold text-2xl shadow-md" style="background-color: var(--accent);">AF</div>' +
            '<p class="text-xs font-bold uppercase tracking-widest" style="color: var(--accent);">Welcome back</p>' +
            '<h1 class="text-2xl font-extrabold tracking-tight">Log in to AtomFit</h1>' +
            '<p class="text-xs af-text-muted">Log it. Keep going.</p>' +
          '</div>' +

          '<div class="af-card p-5 space-y-4">' +
            '<div id="login-error-banner" class="hidden p-3 rounded-xl text-xs font-semibold" style="background-color: var(--danger-tint); color: var(--danger);"></div>' +
            '<div class="space-y-1.5">' +
              '<label class="text-xs font-semibold" for="login-email">Email</label>' +
              '<input id="login-email" type="email" class="af-input" value="' + escapeHtml(appState.user.email) + '" placeholder="alex@example.com" />' +
            '</div>' +
            '<div class="space-y-1.5">' +
              '<div class="flex items-center justify-between">' +
                '<label class="text-xs font-semibold" for="login-password">Password</label>' +
                '<button type="button" onclick="handleForgotPassword()" class="text-xs font-semibold hover:underline" style="color: var(--accent);">Forgot password?</button>' +
              '</div>' +
              '<input id="login-password" type="password" class="af-input" value="atomfit2026" placeholder="••••••••" />' +
            '</div>' +
            '<button type="button" onclick="handleLoginSubmit()" class="af-btn-primary w-full mt-2">Log in</button>' +
          '</div>' +

          '<div class="text-center text-xs af-text-muted">' +
            '<span>Don\'t have an account? </span>' +
            '<button type="button" onclick="navigateApp(\'register\')" class="font-bold hover:underline" style="color: var(--accent);">Create account</button>' +
          '</div>' +
        '</div>';
    }

    function handleLoginSubmit() {
      var emailEl = document.getElementById('login-email');
      var passEl = document.getElementById('login-password');
      var errEl = document.getElementById('login-error-banner');
      var email = emailEl ? emailEl.value.trim() : '';
      var pass = passEl ? passEl.value.trim() : '';

      if (!email || !pass) {
        if (errEl) {
          errEl.textContent = 'Incorrect email or password';
          errEl.classList.remove('hidden');
        }
        return;
      }
      appState.user.email = email;
      appState.isLoggedIn = true;
      saveStateToStorage();
      showToast('Welcome back, ' + appState.user.username + '!');
      navigateApp('home');
    }

    function handleForgotPassword() {
      openModal(
        'Forgot password?',
        '<p class="af-text-muted">Enter your AtomFit account email and we\'ll generate a local recovery token.</p>' +
        '<input id="reset-email-input" type="email" class="af-input mt-2" value="' + escapeHtml(appState.user.email) + '" />',
        '<button type="button" onclick="closeModal()" class="af-btn-secondary text-xs">Cancel</button>' +
        '<button type="button" onclick="closeModal(); showToast(\'Password reset instructions sent!\')" class="af-btn-primary text-xs">Send Reset Link</button>'
      );
    }

              '</div>' +
              '<div class="space-y-1">' +
                '<label class="text-xs font-semibold" for="reg-pass-confirm">Confirm password</label>' +
                '<input id="reg-pass-confirm" type="password" class="af-input" value="atomfit2026" />' +
              '</div>' +
            '</div>' +
            '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">' +
              '<div class="space-y-1">' +
                '<label class="text-xs font-semibold" for="reg-dob">Date of birth</label>' +
                '<input id="reg-dob" type="date" class="af-input" value="1998-05-14" />' +
              '</div>' +
              '<div class="space-y-1">' +

                  '<option value="">Select an option</option>' +
                  '<option value="Male">Male</option>' +

                '</select>' +
              '</div>' +

              '<input id="reg-terms" type="checkbox" checked class="w-4 h-4 rounded accent-blue-600" />' +
              '<span class="text-xs font-medium">I accept the terms</span>' +
            '</label>' +
            '<button type="button" onclick="handleRegisterSubmit()" class="af-btn-primary w-full mt-2">Create account</button>' +
          '</div>' +

          '<div class="text-center text-xs af-text-muted">' +
            '<span>Already have an account? </span>' +

          '</div>' +
        '</div>';
    }

    function handleRegisterSubmit() {
      var username = document.getElementById('reg-username').value.trim() || 'Alex';
      var email = document.getElementById('reg-email').value.trim() || 'alex@example.com';
      var pass = document.getElementById('reg-pass').value;
      var passConfirm = document.getElementById('reg-pass-confirm').value;
      var gender = document.getElementById('reg-gender').value || 'Prefer not to say';
      var terms = document.getElementById('reg-terms').checked;
      var errEl = document.getElementById('register-error-banner');

      if (pass !== passConfirm) {
        errEl.textContent = 'Passwords do not match';
        errEl.classList.remove('hidden');
        return;
      }
      if (!terms) {
        errEl.textContent = 'Please accept the terms';
        errEl.classList.remove('hidden');
        return;
      }

      appState.user.username = username;
      appState.user.email = email;
      appState.user.gender = gender;
      appState.isLoggedIn = true;
      saveStateToStorage();
      showToast('Account created for ' + username + '!');
      navigateApp('home');
    }

    // -------------------------------------------------------------------------
    // 3. HOME SCREEN (/home)
    // -------------------------------------------------------------------------
    function renderHomeScreen() {
      var activeProg = getActiveProgram();
      var workoutDays = {};
      appState.history.forEach(function(h) {
        if (h.dayOfMonth) workoutDays[h.dayOfMonth] = h.type;
      });

      var calendarCells = '';
      // October 2026 starts on Thursday (offset 3 for Mon-Sun or 4 for Sun-Sat; let's use Mon-Sun with 3 leading blanks)
      for (var b = 0; b < 3; b++) {
        calendarCells += '<div class="h-8 rounded-lg"></div>';
      }
      for (var d = 1; d <= 31; d++) {
        var sessionType = workoutDays[d];
        var isToday = (d === 19);
        var cellStyle = 'background-color: var(--bg-subtle); color: var(--text-muted);';
        var dotHtml = '';
        if (sessionType) {

          dotHtml = '<span class="block w-1 h-1 rounded-full bg-white mx-auto mt-0.5"></span>';
        } else if (isToday) {
          cellStyle = 'border: 1.5px solid var(--accent); color: var(--accent); font-weight: 700;';
        }
        calendarCells += '' +
          '<button type="button" onclick="inspectCalendarDay(' + d + ')" class="h-8 rounded-lg text-[11px] flex flex-col items-center justify-center transition-transform hover:scale-105" style="' + cellStyle + '" title="October ' + d + ', 2026">' +
            '<span>' + d + '</span>' + dotHtml +

    function dismissQuizBanner() {
      appState.showQuizBannerOnHome = false;
      renderCurrentScreen();
      showToast('Quiz reminder snoozed. You can launch it anytime from Settings or the top bar.', 'info');
    }

    function inspectCalendarDay(day) {
      var matches = appState.history.filter(function(h) { return h.dayOfMonth === day; });
      if (matches.length > 0) {
        var s = matches[0];
        openModal(
          'October ' + day + ' • ' + s.name,
          '<div class="space-y-2">' +
            '<div class="flex items-center gap-2">' +
              '<span class="af-badge af-badge-blue uppercase">' + escapeHtml(s.type) + '</span>' +
              '<span class="text-xs af-text-muted">' + escapeHtml(s.date) + '</span>' +
            '</div>' +
            '<p class="text-xs">Total Reps: <strong>' + s.reps + '</strong> · Total Volume: <strong>' + s.volume + ' kg</strong></p>' +
          '</div>',
          '<button type="button" onclick="closeModal()" class="af-btn-secondary text-xs">Close</button>' +
          '<button type="button" onclick="closeModal(); navigateApp(\'history\')" class="af-btn-primary text-xs">Open in History</button>'
        );
      } else {
        showToast('October ' + day + ': Rest day (No logged session)', 'info');
      }
    }

    // 4. QUIZ PROMPT SCREEN (/quiz/prompt)

    function renderQuizPromptScreen() {
      return '' +
        '<div class="py-6 space-y-5">' +
          '<div class="af-card p-6 text-center space-y-4">' +
            '<div class="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-2xl" style="background-color: var(--accent-tint); color: var(--accent);">⚡</div>' +
            '<span class="af-badge af-badge-blue">Non-diagnostic quiz · used only to adjust your workouts</span>' +
            '<h1 class="text-xl font-extrabold tracking-tight">Let\'s restart at your pace</h1>' +
            '<p class="text-xs af-text-muted leading-relaxed">It\'s been a while since your last workout. Take a short quiz so we can adjust your program to your current level.</p>' +

            '<div class="af-subtle p-3.5 text-left space-y-2 text-xs">' +
              '<div class="font-bold">What the Adaptive Engine tunes:</div>' +
              '<div class="flex items-center justify-between"><span class="af-text-muted">• Set volume & target weight</span><span class="font-semibold">-10% to -15%</span></div>' +
              '<div class="flex items-center justify-between"><span class="af-text-muted">• Session duration target</span><span class="font-semibold">25 min (-10 min)</span></div>' +
              '<div class="flex items-center justify-between"><span class="af-text-muted">• Rest timer intervals</span><span class="font-semibold">Auto-adjusted</span></div>' +

            '<div class="pt-2 space-y-2.5">' +
              '<button type="button" onclick="startQuizFlow(false)" class="af-btn-primary w-full text-sm">Start quiz (Full 10 Questions)</button>' +
              '<button type="button" onclick="startQuizFlow(true)" class="af-btn-tint w-full text-xs">Quick 2-Question Figma Preview</button>' +

            '</div>' +
          '</div>' +
        '</div>';

    function startQuizFlow(shortMode) {
      appState.quizShortMode = !!shortMode;
      appState.quizStepIndex = 0;
      navigateApp('quiz-question');
    }

    // -------------------------------------------------------------------------
    // 5. QUIZ QUESTION SCREEN (/quiz/question)
    // -------------------------------------------------------------------------
    function getActiveQuizQuestions() {
      if (appState.quizShortMode) {
        return [QUIZ_QUESTIONS_FULL[0], QUIZ_QUESTIONS_FULL[1], QUIZ_QUESTIONS_FULL[9]];
      }
      return QUIZ_QUESTIONS_FULL;
    }

    function renderQuizQuestionScreen() {
      var list = getActiveQuizQuestions();
      if (appState.quizStepIndex >= list.length) appState.quizStepIndex = 0;
      var q = list[appState.quizStepIndex];
      var currentVal = appState.quizAnswers[q.id] || q.options[0];
      var progressPct = Math.round(((appState.quizStepIndex + 1) / list.length) * 100);
      var isLast = (appState.quizStepIndex === list.length - 1);

      var optionsHtml = q.options.map(function(opt) {
        var selected = (currentVal === opt);
        var cardStyle = selected
          ? 'background-color: var(--accent-tint); border: 2px solid var(--accent); color: var(--accent-tint-text); font-weight: 700;'
          : 'background-color: var(--bg-card); border: 1.5px solid var(--border-line);';
        return '' +
          '<button type="button" onclick="selectQuizOption(\'' + q.id + '\', \'' + escapeHtml(opt) + '\')" class="w-full p-3.5 rounded-2xl text-left text-sm flex items-center justify-between transition-all" style="' + cardStyle + '">' +
            '<span>' + escapeHtml(opt) + '</span>' +
            '<span class="w-5 h-5 rounded-full flex items-center justify-center text-xs" style="' + (selected ? 'background-color: var(--accent); color: #fff;' : 'border: 1.5px solid var(--border-line);') + '">' +
              (selected ? '✓' : '') +
            '</span>' +
          '</button>';
      }).join('');

      return '' +
        '<div class="space-y-4 py-2">' +
          '<div class="flex items-center justify-between">' +
            '<span class="text-xs font-bold uppercase tracking-wider" style="color: var(--accent);">Quiz · ' + (appState.quizStepIndex + 1) + ' / ' + list.length + '</span>' +
            '<button type="button" onclick="toggleQuizLengthMode()" class="af-badge af-badge-blue cursor-pointer">' +
              (appState.quizShortMode ? 'Mode: 3-Step Fast' : 'Mode: Full 10-Step') +
            '</button>' +
          '</div>' +

          '<div class="w-full h-2 rounded-full overflow-hidden af-subtle">' +
            '<div class="h-full transition-all duration-300" style="width: ' + progressPct + '%; background-color: var(--accent);"></div>' +
          '</div>' +

          '<p class="text-[11px] af-text-muted">Non-diagnostic quiz · used only to adjust your workouts</p>' +

          '<div class="af-card p-5 space-y-4">' +
            '<h2 class="text-lg font-extrabold leading-snug">' + escapeHtml(q.text) + '</h2>' +
            '<div class="space-y-2.5">' +
              optionsHtml +
            '</div>' +
          '</div>' +

          '<div class="flex items-center justify-between gap-3 pt-2">' +
            '<button type="button" onclick="prevQuizStep()" class="af-btn-secondary text-xs flex-1">' +
              '← Back' +
            '</button>' +
            '<button type="button" onclick="nextQuizStep()" class="af-btn-primary text-xs flex-1">' +
              (isLast ? 'See what changed →' : 'Next question →') +
            '</button>' +
          '</div>' +
        '</div>';
    }

    function selectQuizOption(qId, value) {
      appState.quizAnswers[qId] = value;
      renderCurrentScreen();
    }

    function toggleQuizLengthMode() {
      appState.quizShortMode = !appState.quizShortMode;
      appState.quizStepIndex = 0;
      renderCurrentScreen();
    }

    function prevQuizStep() {
      if (appState.quizStepIndex > 0) {
        appState.quizStepIndex--;
        renderCurrentScreen();
      } else {
        navigateApp('quiz-prompt');
      }
    }

    function nextQuizStep() {
      var list = getActiveQuizQuestions();
      if (appState.quizStepIndex < list.length - 1) {
        appState.quizStepIndex++;
        renderCurrentScreen();
      } else {
        navigateApp('quiz-explainer');
      }
    }

    // -------------------------------------------------------------------------
    // 6. QUIZ EXPLAINER SCREEN (/quiz/explainer)
    // -------------------------------------------------------------------------
    function getComputedQuizAdjustment() {
      var energy = appState.quizAnswers.q2 || 'Low';
      var pushPref = appState.quizAnswers.q10 || 'No, reduced intensity';
      if (pushPref === 'Yes, progress the weight') {
        return { pctText: '+5%', factor: 1.05, intensityLabel: 'Progressive Overload (+5%)', sessionLength: '40 min (+5 min)', freq: (appState.quizAnswers.q4 || '3-4') + ' days/week' };
      }
      if (energy === 'Low' || pushPref === 'No, reduced intensity') {
        return { pctText: '-15%', factor: 0.85, intensityLabel: 'Reduced (-15% volume & load)', sessionLength: '25 min (-10 min)', freq: '3 days/week' };
      }
      return { pctText: '-10%', factor: 0.90, intensityLabel: 'Moderate Deload (-10% weight)', sessionLength: '25 min (-10 min)', freq: (appState.quizAnswers.q4 || '3-4') + ' days/week' };
    }

    function renderQuizExplainerScreen() {
      var adj = getComputedQuizAdjustment();
      return '' +
        '<div class="py-3 space-y-4">' +
          '<div class="af-card p-5 space-y-4">' +
            '<div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl" style="background-color: var(--accent-tint); color: var(--accent);">📊</div>' +
            '<h1 class="text-xl font-extrabold tracking-tight">Why we changed your program</h1>' +
            '<p class="text-xs af-text-muted leading-relaxed">Based on your answers, we\'re suggesting an adjusted program that fits your current energy, motivation, and time.</p>' +

            '<div class="space-y-2.5 pt-1">' +
              '<div class="af-subtle p-3.5 flex items-center justify-between">' +
                '<span class="text-xs font-semibold af-text-muted">Session length</span>' +
                '<span class="text-xs font-bold" style="color: var(--accent);">' + escapeHtml(adj.sessionLength) + '</span>' +
              '</div>' +
              '<div class="af-subtle p-3.5 flex items-center justify-between">' +
                '<span class="text-xs font-semibold af-text-muted">Intensity</span>' +
                '<span class="text-xs font-bold" style="color: var(--accent);">' + escapeHtml(adj.intensityLabel) + '</span>' +
              '</div>' +
              '<div class="af-subtle p-3.5 flex items-center justify-between">' +
                '<span class="text-xs font-semibold af-text-muted">Frequency</span>' +
                '<span class="text-xs font-bold">' + escapeHtml(adj.freq) + '</span>' +
              '</div>' +
              '<div class="af-subtle p-3.5 flex items-center justify-between">' +
                '<span class="text-xs font-semibold af-text-muted">Weight reduction</span>' +
                '<span class="af-badge af-badge-green">' + escapeHtml(adj.pctText) + ' across exercises</span>' +
              '</div>' +
            '</div>' +

            '<div class="pt-3 flex flex-col gap-2.5">' +
              '<button type="button" onclick="navigateApp(\'quiz-adjusted\')" class="af-btn-primary w-full text-sm">See Adjusted Plan →</button>' +
              '<button type="button" onclick="navigateApp(\'quiz-question\')" class="af-btn-secondary w-full text-xs">← Back to Quiz</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    // -------------------------------------------------------------------------
    // 7. QUIZ ADJUSTED PROGRAM SCREEN (/quiz/adjusted-program)
    // -------------------------------------------------------------------------
    function renderQuizAdjustedScreen() {
      var adj = getComputedQuizAdjustment();
      var activeProg = getActiveProgram();

      var exerciseRows = activeProg.exercises.map(function(ex) {
        var newWeight = Math.round(ex.weightKg * adj.factor * 2) / 2;
        return '' +
          '<div class="af-subtle p-3.5 flex items-center justify-between gap-2">' +
            '<div>' +
              '<div class="text-sm font-bold">' + escapeHtml(ex.name) + '</div>' +
              '<div class="text-xs af-text-muted">' + ex.sets + ' Sets × ' + ex.reps + ' Reps</div>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="text-xs line-through af-text-muted">' + ex.weightKg + ' kg</div>' +
              '<div class="text-sm font-extrabold" style="color: var(--success);">' + newWeight + ' kg (' + adj.pctText + ')</div>' +
            '</div>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="py-3 space-y-4">' +
          '<div class="af-card p-5 space-y-4">' +
            '<div class="flex items-center justify-between">' +
              '<span class="af-badge af-badge-green">Adaptive Plan Ready</span>' +
              '<span class="text-xs af-text-muted">' + escapeHtml(activeProg.name) + '</span>' +
            '</div>' +
            '<h1 class="text-xl font-extrabold tracking-tight">Adjusted program</h1>' +
            '<p class="text-xs af-text-muted">Review your modified sets and working weights before starting your session.</p>' +

            '<div class="space-y-2.5">' +
              exerciseRows +
            '</div>' +

            '<div class="pt-3 space-y-2.5">' +
              '<button type="button" onclick="acceptAdjustedProgram()" class="af-btn-primary w-full text-sm">Accept program & Start Workout</button>' +
              '<button type="button" onclick="keepOldProgram()" class="af-btn-secondary w-full text-xs">Keep my old program</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function acceptAdjustedProgram() {
      var adj = getComputedQuizAdjustment();
      var activeProg = getActiveProgram();
      activeProg.exercises.forEach(function(ex) {
        ex.weightKg = Math.round(ex.weightKg * adj.factor * 2) / 2;
      });
      appState.isProgramAdjusted = true;
      appState.adjustmentFactor = adj.factor;
      appState.showQuizBannerOnHome = false;
      saveStateToStorage();
      showToast('Adjusted program accepted (' + adj.pctText + ' load applied)!');
      startProgramWorkout(activeProg.id, 'full');
    }

    function keepOldProgram() {
      appState.isProgramAdjusted = false;
      appState.showQuizBannerOnHome = false;
      showToast('Kept original program weights.', 'info');
      navigateApp('home');
    }

    // -------------------------------------------------------------------------
    // 8. PROGRAMS SCREEN (/programs)
    // -------------------------------------------------------------------------
    function renderProgramsScreen() {
      var filters = ['All', 'Built-in', 'Micro', 'Custom'];
      var filterTabsHtml = filters.map(function(f) {
        var active = (appState.programsFilter === f);
        return '<button type="button" onclick="setProgramsFilter(\'' + f + '\')" class="' + (active ? 'af-btn-primary !py-1.5 !px-3.5 text-xs' : 'af-btn-secondary !py-1.5 !px-3.5 text-xs') + '">' + f + '</button>';
      }).join('');

      var filtered = appState.programs.filter(function(p) {
        if (appState.programsFilter === 'All') return true;
        return p.type.toLowerCase() === appState.programsFilter.toLowerCase();
      });

      var cardsHtml = filtered.map(function(p) {
        var exListHtml = p.exercises.map(function(e) {
          return '<div class="flex items-center justify-between text-xs py-1 border-b last:border-b-0 af-border">' +
            '<span class="font-medium">' + escapeHtml(e.name) + '</span>' +
            '<span class="af-text-muted">' + e.sets + '×' + e.reps + ' · ' + e.weightKg + ' kg</span>' +
          '</div>';
        }).join('');

        return '' +
          '<div class="af-card p-4 space-y-3">' +
            '<div class="flex items-start justify-between gap-2">' +
              '<div>' +
                '<div class="flex items-center gap-2">' +
                  '<h3 class="text-base font-bold">' + escapeHtml(p.name) + '</h3>' +
                  '<span class="af-badge af-badge-blue text-[10px]">' + escapeHtml(p.type) + '</span>' +
                  (p.active ? '<span class="af-badge af-badge-green text-[10px]">Active Plan</span>' : '') +
                '</div>' +
                '<p class="text-xs af-text-muted mt-0.5">' + escapeHtml(p.duration || '30 min') + ' • ' + escapeHtml(p.frequency || '3 days/wk') + ' • ' + escapeHtml(p.difficulty || 'Intermediate') + '</p>' +
              '</div>' +
            '</div>' +

            '<div class="af-subtle p-3 space-y-1">' +
              exListHtml +
            '</div>' +

            '<div class="flex items-center gap-2 pt-1">' +
              '<button type="button" onclick="startProgramWorkout(\'' + p.id + '\', \'' + (p.type === 'Micro' ? 'micro' : 'full') + '\')" class="af-btn-primary !py-2 !px-4 text-xs flex-1">Start Workout</button>' +
              (!p.active ? '<button type="button" onclick="setActiveProgram(\'' + p.id + '\')" class="af-btn-secondary !py-2 !px-3.5 text-xs">Set Active</button>' : '') +
            '</div>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="space-y-4">' +
          '<div class="flex items-center justify-between">' +
            '<div>' +
              '<h1 class="text-xl font-extrabold tracking-tight">My programs</h1>' +
              '<p class="text-xs af-text-muted">Built-in routines, micro-sessions, and custom splits</p>' +
            '</div>' +
            '<button type="button" onclick="openNewProgramModal()" class="af-btn-tint text-xs">+ New Program</button>' +
          '</div>' +

          '<div class="flex flex-wrap items-center gap-2">' +
            filterTabsHtml +
          '</div>' +

          '<div class="space-y-3">' +
            (cardsHtml || '<div class="af-card p-6 text-center text-xs af-text-muted">No programs in this category yet. Click "+ New Program" to build one!</div>') +
          '</div>' +
        '</div>';
    }

    function setProgramsFilter(filter) {
      appState.programsFilter = filter;
      renderCurrentScreen();
    }

    function setActiveProgram(progId) {
      appState.programs.forEach(function(p) {
        p.active = (p.id === progId);
      });
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Updated active workout program!');
    }

    function startProgramWorkout(progId, mode) {
      var found = null;
      for (var i = 0; i < appState.programs.length; i++) {
        if (appState.programs[i].id === progId) {
          found = appState.programs[i];
          break;
        }
      }
      if (!found) found = getActiveProgram();
      appState.activeWorkout.sessionName = found.name;
      appState.activeWorkout.sessionType = mode || 'full';
      if (found.exercises.length > 0) {
        appState.activeWorkout.currentExercise = found.exercises[0].name;
        appState.activeWorkout.weightInput = String(found.exercises[0].weightKg);
        appState.activeWorkout.repsInput = found.exercises[0].reps;
      }
      navigateApp('active-workout');
      showToast('Started ' + found.name + ' (' + appState.activeWorkout.sessionType.toUpperCase() + ')');
    }

    function startMicroSession() {
      appState.activeWorkout.sessionName = 'Quick 5-Min Micro Session';
      appState.activeWorkout.sessionType = 'micro';
      appState.activeWorkout.currentExercise = 'Dumbbell curl';
      appState.activeWorkout.weightInput = '12';
      appState.activeWorkout.repsInput = 10;
      navigateApp('active-workout');
      showToast('Launched 5-Min Micro Session!', 'info');
    }

    function startEmptyWorkout() {
      appState.activeWorkout.sessionName = 'Empty program';
      appState.activeWorkout.sessionType = 'micro';
      appState.activeWorkout.sets = [];
      navigateApp('active-workout');
      showToast('Started clean Empty Workout session.');
    }

    function openNewProgramModal() {
      openModal(
        'Create Custom Program',
        '<div class="space-y-3">' +
          '<div>' +
            '<label class="text-xs font-semibold">Program Name</label>' +
            '<input id="new-prog-name" type="text" class="af-input mt-1" placeholder="e.g. Kettlebell Core Split" value="Hypertrophy Express" />' +
          '</div>' +
          '<div>' +
            '<label class="text-xs font-semibold">Type</label>' +
            '<select id="new-prog-type" class="af-input mt-1">' +
              '<option value="Custom">Custom</option>' +
              '<option value="Micro">Micro</option>' +
            '</select>' +
          '</div>' +
        '</div>',
        '<button type="button" onclick="closeModal()" class="af-btn-secondary text-xs">Cancel</button>' +
        '<button type="button" onclick="saveNewProgram()" class="af-btn-primary text-xs">Create Program</button>'
      );
    }

    function saveNewProgram() {
      var nameInput = document.getElementById('new-prog-name');
      var typeInput = document.getElementById('new-prog-type');
      var name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'Custom Split';
      var type = (typeInput && typeInput.value) ? typeInput.value : 'Custom';

      appState.programs.unshift({
        id: 'p_custom_' + Date.now(),
        name: name,
        type: type,
        duration: type === 'Micro' ? '8 min' : '35 min',
        frequency: '3 days/wk',
        difficulty: 'Custom',
        active: false,
        exercises: [
          { name: 'Barbell shoulder press', sets: 3, reps: 8, weightKg: 30 },
          { name: 'Dumbbell curl', sets: 3, reps: 10, weightKg: 15 }
        ]
      });
      saveStateToStorage();
      closeModal();
      renderCurrentScreen();
      showToast('Created program "' + name + '"!');
    }

    // -------------------------------------------------------------------------
    // 9. ACTIVE WORKOUT SCREEN (/workout/active)
    // -------------------------------------------------------------------------
    function formatMMSS(totalSec) {
      var m = Math.floor(totalSec / 60);
      var s = totalSec % 60;
      return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    function renderActiveWorkoutScreen() {
      var aw = appState.activeWorkout;
      var exerciseOptionsHtml = appState.catalogue.map(function(ex) {
        var sel = (ex.name === aw.currentExercise) ? 'selected' : '';
        return '<option value="' + escapeHtml(ex.name) + '" ' + sel + '>' + escapeHtml(ex.name) + '</option>';
      }).join('');

      var inputModes = [
        { id: 'manual', label: '⌨️ Manual' },
        { id: 'sensor', label: '⌚ Auto-count' },
        { id: 'voice', label: '🎙️ Voice logging' },
        { id: 'lockscreen', label: '🔒 Lockscreen' }
      ];
      var modeButtonsHtml = inputModes.map(function(m) {
        var active = (aw.inputMethod === m.id);
        return '<button type="button" onclick="switchInputMethod(\'' + m.id + '\')" class="' + (active ? 'af-btn-primary !py-1.5 !px-3 text-xs' : 'af-btn-secondary !py-1.5 !px-3 text-xs') + '">' + m.label + '</button>';
      }).join('');

      var specialInputPanel = '';

          '<div class="af-subtle p-3.5 flex items-center justify-between gap-3 border border-blue-500/30">' +
            '<div class="flex items-center gap-3">' +
              '<div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold ' + (aw.sensorSimActive ? 'sensor-pulse' : '') + '" style="background-color: var(--accent);">IMU</div>' +
              '<div>' +
                '<div class="text-xs font-bold">Accelerometer Rep Counter</div>' +
                '<div class="text-[11px] af-text-muted">' + (aw.sensorSimActive ? 'Detecting concentric/eccentric peaks...' : 'Tap Start Auto-Count to simulate IMU reps') + '</div>' +
              '</div>' +
            '</div>' +
            '<button type="button" onclick="toggleSensorSimulation()" class="' + (aw.sensorSimActive ? 'af-btn-danger !py-1.5 !px-3 text-xs' : 'af-btn-primary !py-1.5 !px-3 text-xs') + '">' +
              (aw.sensorSimActive ? 'Stop Sensor' : 'Start Auto-Count') +
            '</button>' +
          '</div>';
      } else if (aw.inputMethod === 'voice') {

          '<div class="af-subtle p-3.5 space-y-2 border border-blue-500/30">' +
            '<div class="flex items-center justify-between">' +
              '<span class="text-xs font-bold">🎙️ Speech-to-Set Parser</span>' +
              '<span class="af-badge af-badge-blue text-[10px]">packages/device</span>' +
            '</div>' +
            '<div class="flex items-center gap-2">' +
              '<input id="voice-command-input" type="text" class="af-input !py-1.5 text-xs" value="' + escapeHtml(aw.voiceSimText) + '" placeholder="e.g. 20 kg for 12 reps" />' +
              '<button type="button" onclick="parseVoiceSet()" class="af-btn-primary !py-1.5 !px-3 text-xs shrink-0">Parse & Log</button>' +
            '</div>' +
          '</div>';
      } else if (aw.inputMethod === 'lockscreen') {

          '<div class="p-3.5 rounded-2xl text-white space-y-2.5" style="background: linear-gradient(135deg, #0F172A, #1E3A8A);">' +
            '<div class="flex items-center justify-between text-[11px] text-blue-200">' +
              '<span>🔒 LOCK SCREEN WIDGET PREVIEW</span>' +

            '<div class="flex items-center justify-between">' +

                '<div class="text-sm font-extrabold">' + escapeHtml(aw.currentExercise) + '</div>' +

              '<div>' +

      return '' +
        '<div class="space-y-4">' +
          '<!-- Active Workout Header Bar -->' +
          '<div class="af-card p-3.5 flex items-center justify-between gap-2" style="background-color: #0B1220; color: #FFFFFF;">' +
            '<div>' +
              '<div class="flex items-center gap-2">' +
                '<span class="w-2 h-2 rounded-full bg-green-400 animate-ping"></span>' +
                '<span class="text-xs font-bold uppercase tracking-wider text-blue-400">' + escapeHtml(aw.sessionType) + ' workout</span>' +

              '<h1 class="text-base font-extrabold mt-0.5">' + escapeHtml(aw.sessionName) + '</h1>' +
            '</div>' +
            '<div class="flex items-center gap-2">' +
              '<button type="button" onclick="toggleSessionType()" class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-200 hover:bg-slate-700" title="Switch Full / Micro mode">' +
                (aw.sessionType === 'micro' ? '⚡ Micro' : '🏋️ Full') +
              '</button>' +
              '<button type="button" onclick="finishActiveWorkout()" class="px-4 py-1.5 rounded-full text-xs font-bold text-white" style="background-color: #16A34A;">Finish</button>' +

              '<span class="font-bold af-text-muted">Input Channel (Save-Set Service)</span>' +
              '<span class="text-[11px] font-semibold" style="color: var(--accent);">Active: ' + escapeHtml(aw.inputMethod) + '</span>' +

            '<div class="flex flex-wrap gap-1.5">' +

            '</div>' +
