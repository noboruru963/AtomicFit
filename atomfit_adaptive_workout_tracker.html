  <style>
    :root {
      --bg-page: #F4F7FE;
      --bg-card: #FFFFFF;
      --bg-subtle: #EDF2FC;
      --text-primary: #0F172A;
      --text-muted: #64748B;
      --border-line: #E2E8F0;
      --accent: #2563EB;
      --accent-dark: #1D4ED8;
      --accent-tint: #DBEAFE;
      --accent-tint-text: #1E40AF;
      --danger: #DC2626;
      --danger-tint: #FEE2E2;
      --success: #16A34A;
      --success-tint: #DCFCE7;
      --warning: #D97706;
      --warning-tint: #FEF3C7;
      --radius-card: 18px;
      --radius-input: 12px;
      --radius-pill: 999px;
      --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --workout-btn-bg: #2563EB;
      --workout-btn-bg-hover: #1D4ED8;
      --workout-btn-text: #FFFFFF;
      --workout-btn-border: #1D4ED8;
    }

    html.dark-theme {
      --bg-page: #0B1220;
      --bg-card: #131C2E;
      --bg-subtle: #1A263D;
      --text-primary: #E8EEFC;
      --text-muted: #94A3B8;
      --border-line: #24304A;
      --accent: #2563EB;
      --accent-dark: #3B82F6;
      --accent-tint: #1E3A8A;
      --accent-tint-text: #BFDBFE;
      --danger: #EF4444;
      --danger-tint: #451A1A;
      --success: #22C55E;
      --success-tint: #143523;
      --warning: #F59E0B;
      --warning-tint: #3D2810;
      --shadow-card: 0 8px 24px -4px rgba(0, 0, 0, 0.35);
      --workout-btn-bg: #2563EB;
      --workout-btn-bg-hover: #3B82F6;
      --workout-btn-text: #FFFFFF;
      --workout-btn-border: #3B82F6;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      transition: background-color 0.2s ease, color 0.2s ease;
      overflow-x: hidden;
    }

    .af-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .af-subtle {
      background-color: var(--bg-subtle);
      border-radius: var(--radius-input);
    }

    .af-input {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1.5px solid var(--border-line);
      border-radius: var(--radius-input);
      padding: 0.65rem 0.9rem;
      width: 100%;
      font-size: 0.925rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .af-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    input.no-spinner::-webkit-outer-spin-button,
    input.no-spinner::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input.no-spinner {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    #app-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: rgba(2, 6, 23, 0.6);
    }

    .program-editor-scroll {
      max-height: 65vh;
      overflow-y: auto;
    }

    #prog-picker-results {
      max-height: 11rem;
      overflow-y: auto;
    }

    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .w-full { width: 100%; }
    .grid { display: grid; }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .text-center { text-align: center; }
    .flex-col { flex-direction: column; }
    .block { display: block; }
    .max-w-xs { max-width: 20rem; }
    .max-w-sm { max-width: 24rem; }

    /* Complete offline utility classes so UI renders identically without CDN */
    .space-y-0\.5 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.125rem; }
    .space-y-1 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.25rem; }
    .space-y-1\.5 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.375rem; }
    .space-y-2 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem; }
    .space-y-2\.5 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.625rem; }
    .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.75rem; }
    .space-y-3\.5 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.875rem; }
    .space-y-4 > :not([hidden]) ~ :not([hidden]) { margin-top: 1rem; }
    .space-y-5 > :not([hidden]) ~ :not([hidden]) { margin-top: 1.25rem; }
    .space-y-6 > :not([hidden]) ~ :not([hidden]) { margin-top: 1.5rem; }
    .gap-0\.5 { gap: 0.125rem; }
    .gap-1 { gap: 0.25rem; }
    .gap-1\.5 { gap: 0.375rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-2\.5 { gap: 0.625rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-3\.5 { gap: 0.875rem; }
    .p-2 { padding: 0.5rem; }
    .p-2\.5 { padding: 0.625rem; }
    .p-3 { padding: 0.75rem; }
    .p-3\.5 { padding: 0.875rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .p-6 { padding: 1.5rem; }

    .af-btn-primary {

      color: #FFFFFF;

      transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      border: none;
    }

    .af-btn-primary:hover {
      background-color: var(--accent-dark);
    }

    .af-btn-primary:active {
      transform: scale(0.985);
    }

    .af-btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1.5px solid var(--border-line);
      border-radius: var(--radius-pill);
      font-weight: 600;
      padding: 0.68rem 1.25rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      cursor: pointer;
    }

    .af-btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .af-btn-tint {
      background-color: var(--accent-tint);
      color: var(--accent-tint-text);
      border-radius: var(--radius-pill);
      font-weight: 600;
      padding: 0.55rem 1.05rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s ease;

      50% { transform: scale(1.08); opacity: 0.35; }

    function sanitizeExerciseEntry(ex) {
      if (!ex || typeof ex !== 'object') return null;
      var name = String(ex.name || '').trim();
      if (!name) return null;
      var sets = parseInt(ex.sets, 10);
      if (isNaN(sets) || sets <= 0) sets = 3;
      var reps = parseInt(ex.reps, 10);
      if (isNaN(reps) || reps <= 0) reps = 10;
      var weightKg = parseFloat(ex.weightKg);
      if (isNaN(weightKg) || weightKg < 0) weightKg = 0;
      var cleanObj = {
        name: name,
        sets: sets,
        reps: reps,
        weightKg: weightKg
      };
      if (ex.exerciseId || ex.id) {
        cleanObj.exerciseId = String(ex.exerciseId || ex.id);
      }
      return cleanObj;
    }

    function sanitizeProgram(p, idx) {
      if (!p || typeof p !== 'object') return null;
      var id = String(p.id || ('p_sanitized_' + idx)).trim();
      var name = String(p.name || 'Workout Program').trim();
      if (!name) name = 'Workout Program';
      var rawEx = Array.isArray(p.exercises) ? p.exercises : [];
      var cleanEx = [];
      for (var i = 0; i < rawEx.length; i++) {
        var item = sanitizeExerciseEntry(rawEx[i]);
        if (item) cleanEx.push(item);
      }
      return {
        id: id,
        name: name,
        splitGroup: String(p.splitGroup || p.type || 'Custom'),
        type: String(p.type || 'Custom'),
        duration: String(p.duration || '30 min'),
        frequency: String(p.frequency || '3 days/wk'),
        difficulty: String(p.difficulty || 'Intermediate'),
        active: !!p.active,
        exercises: cleanEx
      };
    }

    function readPersistedStateRaw() {
      try {
        var fromLs = localStorage.getItem('atomfit_app_v24');
        if (fromLs) return fromLs;
      } catch (e) {}
      try {
        if (typeof window.name === 'string' && window.name.indexOf('ATOMFIT_STATE_V24:') === 0) {
          return window.name.slice('ATOMFIT_STATE_V24:'.length);
        }
      } catch (e2) {}
      return null;
    }

    function loadSavedState() {
      try {
        var raw = readPersistedStateRaw();
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            if (parsed.isDarkMode !== undefined) appState.isDarkMode = !!parsed.isDarkMode;
            if (Array.isArray(parsed.accounts) && parsed.accounts.length > 0) {
              appState.accounts = parsed.accounts;
            }
            if (parsed.user && typeof parsed.user === 'object') {
              appState.user = Object.assign({}, appState.user, parsed.user);
              if (parsed.user.personal_details_complete !== undefined) {
                appState.user.personalDetailsComplete = !!parsed.user.personal_details_complete;
              } else if (parsed.user.personalDetailsComplete !== undefined) {
                appState.user.personal_details_complete = !!parsed.user.personalDetailsComplete;
              }
            }
            if (parsed.settings && typeof parsed.settings === 'object') {
              appState.settings = Object.assign({}, appState.settings, parsed.settings);
            }
            if (Array.isArray(parsed.catalogue) && parsed.catalogue.length > 0) {
              var validCat = parsed.catalogue.filter(function(c) {
                return c && typeof c === 'object' && String(c.name || '').trim().length > 0;
              }).map(function(c) {
                if (c.category === 'Back & Core') {
                  var lowerName = String(c.name || '').toLowerCase();
                  var lowerDesc = String(c.description || '').toLowerCase();
                  if (lowerName.indexOf('plank') !== -1 || lowerName.indexOf('core') !== -1 || lowerName.indexOf('ab') !== -1 || lowerDesc.indexOf('core') !== -1) {
                    c.category = 'Core';
                  } else {
                    c.category = 'Back';
                  }
                }
                return c;
              });
              if (validCat.length > 0) appState.catalogue = validCat;
            }
            if (Array.isArray(parsed.programs)) {
              var cleanProgs = [];
              for (var i = 0; i < parsed.programs.length; i++) {
                var cp = sanitizeProgram(parsed.programs[i], i);
                if (cp) cleanProgs.push(cp);
              }
              if (cleanProgs.length > 0) {
                var hasActive = cleanProgs.some(function(p) { return p.active; });
                if (!hasActive) cleanProgs[0].active = true;
              }
              appState.programs = cleanProgs;
            }
            if (Array.isArray(parsed.history)) {
              appState.history = parsed.history.filter(function(h) {
                return h && typeof h === 'object' && h.id && h.name;
              });
            }
            if (parsed.isProgramAdjusted !== undefined) {
              appState.isProgramAdjusted = !!parsed.isProgramAdjusted;
            }
            if (parsed.activeWorkout && typeof parsed.activeWorkout === 'object') {
              var paw = parsed.activeWorkout;
              var activeProg = getActiveProgram();
              appState.activeWorkout.programId = paw.programId !== undefined ? paw.programId : activeProg.id;
              appState.activeWorkout.sessionName = String(paw.sessionName || activeProg.name);
              appState.activeWorkout.sessionType = (paw.sessionType === 'micro') ? 'micro' : 'full';
              if (Array.isArray(paw.exercises)) {
                var cleanAwEx = [];
                for (var j = 0; j < paw.exercises.length; j++) {
                  var ce = sanitizeExerciseEntry(paw.exercises[j]);
                  if (ce) cleanAwEx.push(ce);
                }
                appState.activeWorkout.exercises = cleanAwEx;
              } else {
                appState.activeWorkout.exercises = JSON.parse(JSON.stringify(activeProg.exercises));
              }
              appState.activeWorkout.currentExercise = String(paw.currentExercise || (appState.activeWorkout.exercises[0] ? appState.activeWorkout.exercises[0].name : ''));
              appState.activeWorkout.weightInput = String(paw.weightInput !== undefined ? paw.weightInput : '0');
              appState.activeWorkout.repsInput = Math.max(0, parseInt(paw.repsInput !== undefined ? paw.repsInput : 8, 10) || 0);
              if (['manual', 'sensor', 'voice', 'lockscreen'].indexOf(paw.inputMethod) !== -1) {
                appState.activeWorkout.inputMethod = paw.inputMethod;
              }
              var totalSec = parseInt(paw.restTotalSeconds, 10);
              if (!isNaN(totalSec) && totalSec > 0) {
                appState.activeWorkout.restTotalSeconds = totalSec;
                appState.activeWorkout.restMinutesInput = Math.floor(totalSec / 60);
                appState.activeWorkout.restSecondsInput = totalSec % 60;
              }
              var remSec = parseInt(paw.restSeconds, 10);
              appState.activeWorkout.restSeconds = (!isNaN(remSec) && remSec >= 0) ? remSec : appState.activeWorkout.restTotalSeconds;
              if (Array.isArray(paw.sets)) {
                appState.activeWorkout.sets = paw.sets.filter(function(s) {
                  return s && typeof s === 'object' && s.exerciseName;
                });
              }
            } else {
              syncActiveWorkoutWithProgram(getActiveProgram(), 'full', true);
            }
          }
        } else {
          syncActiveWorkoutWithProgram(getActiveProgram(), 'full', true);
        }
      } catch (err) {

          bell.load();
          bellAudioUnlocked = true;
        }
      } catch (err) {
        // Ignore if audio element initialization is restricted
      }
    }

    function stopBellSound() {
      try {
        var bell = document.getElementById('restBell');

          bell.pause();
          bell.currentTime = 0;

        if (activeBellAudioEl) {
          activeBellAudioEl.pause();
          activeBellAudioEl.currentTime = 0;
          activeBellAudioEl = null;

    function playBellSoundOnce(runId, forceTest) {
      if (!forceTest) {
        if (!appState.settings.bellSound) return false;
        if (runId && appState.activeWorkout.bellPlayedForRunId === runId) return false;
        if (runId) appState.activeWorkout.bellPlayedForRunId = runId;
      }

      var bell = getRestBellElement();
      bellPlayCount += 1;
      window.__lastBellPlayedRunId = runId || 'manual';
      window.__bellPlayCount = bellPlayCount;

      if (bell) {
        try {
          bell.pause();
          bell.currentTime = 0;
          var playPromise = bell.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(function(error) {
              console.warn('Unable to play the rest timer bell:', error);
            });
          }
        } catch (err) {
          console.warn('Unable to play the rest timer bell:', err);
        }
      }

      if (appState.settings.hapticFeedback && navigator.vibrate) {
        try { navigator.vibrate([200, 100, 250]); } catch (e) {}
      }
      return true;

    function refreshNotificationPermissionState() {
      if (typeof Notification === 'undefined') {
        appState.notificationPermission = 'unsupported';
      } else {
        appState.notificationPermission = Notification.permission || 'default';
      }
      return appState.notificationPermission;
    }

    function requestRestNotificationPermission(silentIfAlreadyDecided) {
      if (typeof Notification === 'undefined') {
        appState.notificationPermission = 'unsupported';
        if (!silentIfAlreadyDecided) {
          showToast('System notifications are not supported in this browser view. In-app bell & visual alerts remain active.', 'info');
        }
        renderCurrentScreen();
        return Promise.resolve('unsupported');
      }
      appState.notificationPermission = Notification.permission;
      if (Notification.permission === 'granted') {
        if (!silentIfAlreadyDecided) showToast('Rest-timer notifications are enabled!');
        renderCurrentScreen();
        return Promise.resolve('granted');
      }
      if (Notification.permission === 'denied') {
        if (!silentIfAlreadyDecided) {
          showToast('Notification permission was denied. Enable notifications in browser/site settings to receive background alerts.', 'danger');
        }
        renderCurrentScreen();
        return Promise.resolve('denied');
      }
      try {
        var resultPromise = Notification.requestPermission();
        if (resultPromise && typeof resultPromise.then === 'function') {
          return resultPromise.then(function(perm) {
            appState.notificationPermission = perm;
            renderCurrentScreen();
            if (perm === 'granted' && !silentIfAlreadyDecided) {
              showToast('Notifications enabled! You will be alerted if the rest timer ends in the background.');
            } else if (perm === 'denied' && !silentIfAlreadyDecided) {
              showToast('Notification permission denied. In-app bell alert will still work.', 'info');
            }
            return perm;
          }).catch(function() {
            return appState.notificationPermission;
          });
        }
      } catch (err) {}
      return Promise.resolve(appState.notificationPermission);
    }

    function cancelScheduledRestNotification() {
      if (restNotificationTimeoutId) {
        clearTimeout(restNotificationTimeoutId);
        restNotificationTimeoutId = null;
      }
      if (activeRestNotification) {
        try { activeRestNotification.close(); } catch (e) {}
        activeRestNotification = null;
      }
      if (document.title.indexOf('🔔') !== -1) {
        document.title = 'AtomFit — Adaptive Workout Tracker';
      }
      if (window.AtomFitNotificationBridge && typeof window.AtomFitNotificationBridge.postMessage === 'function') {
        try {
          window.AtomFitNotificationBridge.postMessage(JSON.stringify({ action: 'cancelRestNotification' }));
        } catch (e) {}
      }
    }

    function sendBackgroundRestNotificationOnce(runId) {
      if (!appState.settings.restNotifications) return false;
      if (runId && appState.activeWorkout.notifSentForRunId === runId) return false;
      if (runId) appState.activeWorkout.notifSentForRunId = runId;

      var exLabel = appState.activeWorkout.currentExercise || appState.activeWorkout.sessionName || 'Next Set';
      var title = 'AtomFit — Rest Period Ended';
      var body = 'Your rest timer for ' + exLabel + ' has finished. Ready for your next set!';

      document.title = '🔔 Rest Ended! — AtomFit';

      // Notify native Flutter WebView host if available
      if (window.AtomFitNotificationBridge && typeof window.AtomFitNotificationBridge.postMessage === 'function') {
        try {
          window.AtomFitNotificationBridge.postMessage(JSON.stringify({
            action: 'notifyRestEnded',
            title: title,
            body: body,
            runId: runId
          }));
        } catch (e) {}
      }

      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(function(reg) {
              if (reg && typeof reg.showNotification === 'function') {
                reg.showNotification(title, {
                  body: body,
                  tag: 'atomfit-rest-timer-' + runId,
                  renotify: false
                });
              }
            }).catch(function() {});
          }
          activeRestNotification = new Notification(title, {
            body: body,
            tag: 'atomfit-rest-timer-' + runId
          });
          activeRestNotification.onclick = function() {
            try { window.focus(); } catch (e) {}
            dismissTimerCompletion();
          };
          return true;
        } catch (err) {}
      }
      return false;
    }

    function scheduleRestNotificationForCurrentRun() {
      cancelScheduledRestNotification();
      var aw = appState.activeWorkout;
      if (!aw.restRunning || !aw.restEndTimeMs) return;
      var delayMs = Math.max(0, aw.restEndTimeMs - Date.now());
      var currentRunId = aw.timerRunId;

      if (window.AtomFitNotificationBridge && typeof window.AtomFitNotificationBridge.postMessage === 'function') {
        try {
          window.AtomFitNotificationBridge.postMessage(JSON.stringify({
            action: 'scheduleRestNotification',
            delayMs: delayMs,
            exerciseName: aw.currentExercise || aw.sessionName,
            runId: currentRunId
          }));
        } catch (e) {}
      }

      restNotificationTimeoutId = setTimeout(function() {
        restNotificationTimeoutId = null;
        if (appState.activeWorkout.restRunning && appState.activeWorkout.timerRunId === currentRunId) {
          completeRestTimerNow(currentRunId);
        }
      }, delayMs + 50);
    }

      if (!Array.isArray(appState.accounts)) appState.accounts = [];

      var found = false;
      for (var i = 0; i < appState.accounts.length; i++) {

      if (clearLoggedSets || isSwitchingProgram) {
        aw.sets = [];

      if (aw.exercises.length > 0) {

    function handleLoginSubmit() {
      var emailEl = document.getElementById('login-email');
      var passEl = document.getElementById('login-password');
      var errEl = document.getElementById('login-error-banner');
      var email = emailEl ? emailEl.value.trim() : '';

        if (errEl) {
          errEl.textContent = 'Incorrect email or password';
          errEl.classList.remove('hidden');
        }
        return;

      // Look up matching account in appState.accounts or current appState.user

      var lowerInput = email.toLowerCase();
      if (Array.isArray(appState.accounts)) {
        for (var i = 0; i < appState.accounts.length; i++) {
          var acc = appState.accounts[i];
          if (acc && (String(acc.email || '').toLowerCase() === lowerInput || String(acc.username || '').toLowerCase() === lowerInput)) {
            if (acc.password && acc.password !== pass) {
              if (errEl) {
                errEl.textContent = 'Incorrect email or password';
                errEl.classList.remove('hidden');
              }
              return;
            }
            matchedAccount = acc;
            break;
          }
        }
      }

      if (matchedAccount) {
        appState.user = Object.assign({}, appState.user, matchedAccount);
      } else if (appState.user && String(appState.user.email || '').toLowerCase() === lowerInput) {
        if (appState.user.password && appState.user.password !== pass) {

          return;

    // -------------------------------------------------------------------------
    // 2B. PERSONAL DETAILS SCREEN (/personal-details) — BA-012 Step 2 (AC-2..AC-9)
    // -------------------------------------------------------------------------
    var CALENDAR_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function validatePersonalDetailsInput(username, dobDay, dobMonth, dobYear, gender, weightRaw, heightRaw) {
      var cleanUser = String(username || '').trim();
      if (!cleanUser) {
        return { valid: false, field: 'Username', error: 'Username is required. Please enter a username.' };
      }

      var dayNum = parseInt(String(dobDay || '').trim(), 10);
      var yearNum = parseInt(String(dobYear || '').trim(), 10);
      var monthStr = String(dobMonth || '').trim();
      var monthIdx = CALENDAR_MONTHS.indexOf(monthStr);
      if (monthIdx === -1 && /^\d+$/.test(monthStr)) {
        var mParsed = parseInt(monthStr, 10);
        if (mParsed >= 1 && mParsed <= 12) monthIdx = mParsed - 1;
      }

      if (!dobDay || !dobMonth || !dobYear || isNaN(dayNum) || isNaN(yearNum) || monthIdx === -1) {
        return { valid: false, field: 'Date of birth', error: 'Date of birth is required. Please enter a valid calendar date in the past.' };
      }

      var candidateDate = new Date(yearNum, monthIdx, dayNum);
      var now = new Date();
      var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (
        candidateDate.getFullYear() !== yearNum ||
        candidateDate.getMonth() !== monthIdx ||
        candidateDate.getDate() !== dayNum ||
        yearNum < 1900 ||
        candidateDate >= todayStart
      ) {
        return { valid: false, field: 'Date of birth', error: 'Date of birth must be a valid calendar date in the past.' };
      }

      var wStr = String(weightRaw !== undefined && weightRaw !== null ? weightRaw : '').trim();
      if (!wStr) {
        return { valid: false, field: 'Weight', error: 'Weight is required. Please enter a weight between 0 and 999.9 kg.' };
      }
      if (!/^\d{1,3}(\.\d)?$/.test(wStr)) {
        return { valid: false, field: 'Weight', error: 'Weight must be a decimal between 0 and 999.9 kg (up to one decimal place).' };
      }
      var wNum = parseFloat(wStr);
      if (isNaN(wNum) || wNum < 0 || wNum > 999.9) {
        return { valid: false, field: 'Weight', error: 'Weight must be between 0 and 999.9 kg.' };
      }

      var hStr = String(heightRaw !== undefined && heightRaw !== null ? heightRaw : '').trim();
      if (!hStr) {
        return { valid: false, field: 'Height', error: 'Height is required. Please enter a whole number in cm.' };
      }
      if (!/^\d+$/.test(hStr)) {
        return { valid: false, field: 'Height', error: 'Height must be a whole number in cm.' };
      }
      var hNum = parseInt(hStr, 10);
      if (isNaN(hNum) || hNum <= 0 || hNum > 300) {
        return { valid: false, field: 'Height', error: 'Height must be a valid whole number in cm.' };
      }

      var cleanGender = String(gender || '').trim() || 'Prefer not to say';
      return {
        valid: true,
        username: cleanUser,
        dobDay: String(dayNum),
        dobMonth: CALENDAR_MONTHS[monthIdx],
        dobYear: String(yearNum),
        gender: cleanGender,
        weightKg: String(wStr),
        heightCm: String(hNum)
      };
    }

    function handlePersonalDetailsSubmit() {
      var usernameEl = document.getElementById('pd-username');
      var dayEl = document.getElementById('pd-dob-day');
      var monthEl = document.getElementById('pd-dob-month');
      var yearEl = document.getElementById('pd-dob-year');

      var heightEl = document.getElementById('pd-height');

      var check = validatePersonalDetailsInput(
        usernameEl ? usernameEl.value : '',
        dayEl ? dayEl.value : '',
        monthEl ? monthEl.value : '',
        yearEl ? yearEl.value : '',
        genderEl ? genderEl.value : 'Prefer not to say',
        weightEl ? weightEl.value : '',
        heightEl ? heightEl.value : ''
      );

      // BA-012 Rule 5 (AC-3): If a required field is empty or invalid, store nothing, keep user on screen, and show error naming the invalid field
      if (!check.valid) {
        if (errEl) {
          errEl.textContent = check.error;
          errEl.classList.remove('hidden');
        }
        return false;
      }

      if (errEl) {
        errEl.textContent = '';
        errEl.classList.add('hidden');
      }

      // BA-012 Rule 4 (AC-4): Save details to account record, set personal_details_complete = true, and display Home
      appState.user.username = check.username;

      appState.user.personalDetailsComplete = true;

      upsertAccountRecord(appState.user);
      saveStateToStorage();
      showToast('Personal details saved! Welcome, ' + check.username + '!');
      navigateApp('home');
      return true;
    }

            '<button type="button" onclick="prevQuizStep()" class="af-btn-secondary text-xs flex-1">← Back</button>' +
            '<button type="button" onclick="nextQuizStep()" class="af-btn-primary text-xs flex-1">' +
              (isLast ? 'See what changed →' : 'Next question →') +
            '</button>' +
          '</div>' +
        '</div>';
    }

    function selectQuizOption(qId, value) {
      appState.quizAnswers[qId] = value;
      renderCurrentScreen();
    }

    function toggleQuizLengthMode() {
      appState.quizShortMode = !appState.quizShortMode;
      appState.quizStepIndex = 0;
      renderCurrentScreen();
    }

    function prevQuizStep() {
      if (appState.quizStepIndex > 0) {
        appState.quizStepIndex--;
        renderCurrentScreen();
      } else {
        navigateApp('quiz-prompt');
      }
    }

    function nextQuizStep() {
      var list = getActiveQuizQuestions();
      if (appState.quizStepIndex < list.length - 1) {
        appState.quizStepIndex++;
        renderCurrentScreen();
      } else {
        navigateApp('quiz-explainer');
      }
    }

    // -------------------------------------------------------------------------
    // 6. QUIZ EXPLAINER SCREEN (/quiz/explainer)
    // -------------------------------------------------------------------------
    function getComputedQuizAdjustment() {
      var energy = appState.quizAnswers.q2 || 'Low';
      var pushPref = appState.quizAnswers.q10 || 'No, reduced intensity';
      if (pushPref === 'Yes, progress the weight') {
        return { pctText: '+5%', factor: 1.05, intensityLabel: 'Progressive Overload (+5%)', sessionLength: '40 min (+5 min)', freq: (appState.quizAnswers.q4 || '3-4') + ' days/week' };
      }
      if (energy === 'Low' || pushPref === 'No, reduced intensity') {
        return { pctText: '-15%', factor: 0.85, intensityLabel: 'Reduced (-15% volume & load)', sessionLength: '25 min (-10 min)', freq: '3 days/week' };
      }
      return { pctText: '-10%', factor: 0.90, intensityLabel: 'Moderate Deload (-10% weight)', sessionLength: '25 min (-10 min)', freq: (appState.quizAnswers.q4 || '3-4') + ' days/week' };
    }

    function renderQuizExplainerScreen() {
      var adj = getComputedQuizAdjustment();
      return '' +
        '<div class="py-2 space-y-4">' +
          '<div class="af-card p-5 space-y-4">' +
            '<div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl" style="background-color: var(--accent-tint); color: var(--accent);">📊</div>' +
            '<h1 class="text-xl font-extrabold tracking-tight">Why we changed your program</h1>' +
            '<p class="text-xs af-text-muted leading-relaxed">Based on your answers, we\'re suggesting an adjusted program that fits your current energy, motivation, and time.</p>' +

            '<div class="space-y-2.5 pt-1">' +
              '<div class="af-subtle p-3.5 flex items-center justify-between">' +
                '<span class="text-xs font-semibold af-text-muted">Session length</span>' +
                '<span class="text-xs font-bold" style="color: var(--accent);">' + escapeHtml(adj.sessionLength) + '</span>' +
              '</div>' +
              '<div class="af-subtle p-3.5 flex items-center justify-between">' +
                '<span class="text-xs font-semibold af-text-muted">Intensity</span>' +
                '<span class="text-xs font-bold" style="color: var(--accent);">' + escapeHtml(adj.intensityLabel) + '</span>' +
              '</div>' +
              '<div class="af-subtle p-3.5 flex items-center justify-between">' +
                '<span class="text-xs font-semibold af-text-muted">Frequency</span>' +
                '<span class="text-xs font-bold">' + escapeHtml(adj.freq) + '</span>' +
              '</div>' +
              '<div class="af-subtle p-3.5 flex items-center justify-between">' +
                '<span class="text-xs font-semibold af-text-muted">Weight adjustment</span>' +
                '<span class="af-badge af-badge-green">' + escapeHtml(adj.pctText) + ' across exercises</span>' +
              '</div>' +
            '</div>' +

            '<div class="pt-3 flex flex-col gap-2.5">' +
              '<button type="button" onclick="navigateApp(\'quiz-adjusted\')" class="af-btn-primary w-full text-sm">See Adjusted Plan →</button>' +
              '<button type="button" onclick="navigateApp(\'quiz-question\')" class="af-btn-secondary w-full text-xs">← Back to Quiz</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    // -------------------------------------------------------------------------
    // 7. QUIZ ADJUSTED PROGRAM SCREEN (/quiz/adjusted-program)
    // -------------------------------------------------------------------------
    function renderQuizAdjustedScreen() {
      var adj = getComputedQuizAdjustment();
      var activeProg = getActiveProgram();

      var exerciseRows = activeProg.exercises.map(function(ex) {
        var newWeight = Math.round(ex.weightKg * adj.factor * 2) / 2;
        return '' +
          '<div class="af-subtle p-3.5 flex items-center justify-between gap-2">' +
            '<div>' +
              '<div class="text-sm font-bold">' + escapeHtml(ex.name) + '</div>' +
              '<div class="text-xs af-text-muted">' + ex.sets + ' Sets × ' + ex.reps + ' Reps</div>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="text-xs line-through af-text-muted">' + ex.weightKg + ' kg</div>' +
              '<div class="text-sm font-extrabold" style="color: var(--success);">' + newWeight + ' kg (' + adj.pctText + ')</div>' +
            '</div>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="py-2 space-y-4">' +
          '<div class="af-card p-5 space-y-4">' +
            '<div class="flex items-center justify-between">' +
              '<span class="af-badge af-badge-green">Adaptive Plan Ready</span>' +
              '<span class="text-xs af-text-muted">' + escapeHtml(activeProg.name) + '</span>' +
            '</div>' +
            '<h1 class="text-xl font-extrabold tracking-tight">Adjusted program</h1>' +
            '<p class="text-xs af-text-muted">Review your modified sets and working weights before starting your session.</p>' +

            '<div class="space-y-2.5">' +
              exerciseRows +
            '</div>' +

            '<div class="pt-3 space-y-2.5">' +
              '<button type="button" onclick="acceptAdjustedProgram()" class="af-btn-primary w-full text-sm">Accept program & Start Workout</button>' +
              '<button type="button" onclick="keepOldProgram()" class="af-btn-secondary w-full text-xs">Keep my old program</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function acceptAdjustedProgram() {
      var adj = getComputedQuizAdjustment();
      var activeProg = getActiveProgram();
      activeProg.exercises.forEach(function(ex) {
        ex.weightKg = Math.round(ex.weightKg * adj.factor * 2) / 2;
      });
      appState.isProgramAdjusted = true;
      appState.adjustmentFactor = adj.factor;
      appState.showQuizBannerOnHome = false;
      syncActiveWorkoutWithProgram(activeProg, 'full', true);
      showToast('Adjusted program accepted (' + adj.pctText + ' load applied)!');
      navigateApp('active-workout');
    }

    function keepOldProgram() {
      appState.isProgramAdjusted = false;
      appState.showQuizBannerOnHome = false;
      saveStateToStorage();
      showToast('Kept original program weights.', 'info');
      navigateApp('home');
    }

    // -------------------------------------------------------------------------
    // 8. PROGRAMS SCREEN (/programs) — Reliable Program Selection & Targets (Req 3)
    // -------------------------------------------------------------------------
    function renderProgramsScreen() {
      var filters = ['All', 'Push Pull Leg', 'Upper Lower', 'Micro', 'Custom'];
      var filterTabsHtml = filters.map(function(f) {
        var active = (appState.programsFilter === f);
        return '<button type="button" onclick="setProgramsFilter(\'' + f + '\')" class="' + (active ? 'af-btn-primary !py-1.5 !px-3.5 text-xs' : 'af-btn-secondary !py-1.5 !px-3.5 text-xs') + '">' + f + '</button>';
      }).join('');

      var filtered = appState.programs.filter(function(p) {
        if (appState.programsFilter === 'All') return true;
        if (appState.programsFilter === 'Push Pull Leg' || appState.programsFilter === 'Upper Lower') {
          return (p.splitGroup || '') === appState.programsFilter;
        }
        return (p.type || '').toLowerCase() === appState.programsFilter.toLowerCase();
      });

      var cardsHtml = filtered.map(function(p) {
        var exListHtml = (p.exercises && p.exercises.length)
          ? p.exercises.map(function(e, idx) {
              return '<div class="flex items-center justify-between text-xs py-1 border-b last:border-b-0 af-border">' +
                '<span class="font-medium">' + (idx + 1) + '. ' + escapeHtml(e.name) + '</span>' +
                '<span class="af-text-muted">' + e.sets + ' sets × ' + e.reps + ' reps · ' + e.weightKg + ' kg</span>' +
              '</div>';
            }).join('')
          : '<div class="text-xs af-text-muted py-1">No exercises yet. Add exercises during workout.</div>';

        return '' +
          '<div class="af-card p-4 space-y-3">' +
            '<div class="flex items-start justify-between gap-2">' +
              '<div>' +
                '<div class="flex items-center gap-2">' +
                  '<h3 class="text-base font-bold">' + escapeHtml(p.name) + '</h3>' +
                  '<span class="af-badge af-badge-blue text-[10px]">' + escapeHtml(p.splitGroup || p.type) + '</span>' +
                  (p.active ? '<span class="af-badge af-badge-green text-[10px]">Current</span>' : '') +
                '</div>' +
                '<p class="text-xs af-text-muted mt-0.5">' + escapeHtml(p.duration || '30 min') + ' • ' + escapeHtml(p.frequency || '3 days/wk') + ' • ' + (p.exercises ? p.exercises.length : 0) + ' exercises</p>' +
              '</div>' +
            '</div>' +

            '<div class="af-subtle p-3 space-y-1">' +
              exListHtml +
            '</div>' +

            '<div class="flex flex-wrap items-center gap-2 pt-1">' +
              '<button type="button" onclick="startProgramWorkout(\'' + p.id + '\', \'' + (p.type === 'Micro' ? 'micro' : 'full') + '\')" class="af-btn-primary !py-2 !px-4 text-xs flex-1">Start Workout</button>' +
              (!p.active ? '<button type="button" onclick="setActiveProgram(\'' + p.id + '\')" class="af-btn-secondary !py-2 !px-3.5 text-xs">Set Current</button>' : '') +
              '<button type="button" onclick="confirmDeleteProgram(\'' + p.id + '\')" class="af-btn-danger !py-2 !px-3 text-xs" title="Delete program" aria-label="Delete ' + escapeHtml(p.name) + '">Delete</button>' +
            '</div>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="space-y-4">' +
          '<div class="flex items-center justify-center w-full" style="display: flex; align-items: center; justify-content: center; width: 100%;">' +
            '<button type="button" id="new-program-btn" onclick="openNewProgramModal()" class="af-btn-primary !py-2 !px-5 text-xs font-bold mx-auto" style="margin: 0 auto;">+ New Program</button>' +
          '</div>' +

          '<div class="flex flex-wrap items-center gap-1.5">' +
            filterTabsHtml +
          '</div>' +

          '<div class="space-y-3">' +
            (cardsHtml || '<div class="af-card p-6 text-center text-xs af-text-muted">No programs in this category yet. Click "+ New Program" to build one!</div>') +
          '</div>' +
        '</div>';
    }

    function setProgramsFilter(filter) {
      appState.programsFilter = filter;
      renderCurrentScreen();
    }

    function setActiveProgram(progId) {
      var found = null;
      appState.programs.forEach(function(p) {
        p.active = (p.id === progId);
        if (p.id === progId) found = p;
      });
      if (found) {
        syncActiveWorkoutWithProgram(found, found.type === 'Micro' ? 'micro' : 'full', true);
      }
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Selected "' + (found ? found.name : 'Program') + '" as current program!');
    }

    function startProgramWorkout(progId, mode) {
      var found = null;
      for (var i = 0; i < appState.programs.length; i++) {
        if (appState.programs[i].id === progId) {
          found = appState.programs[i];
          break;
        }
      }
      if (!found) found = getActiveProgram();

      var switchingProgram = (appState.activeWorkout.programId !== found.id);
      appState.programs.forEach(function(p) {
        p.active = (p.id === found.id);
      });

      syncActiveWorkoutWithProgram(found, mode || (found.type === 'Micro' ? 'micro' : 'full'), switchingProgram);
      navigateApp('active-workout');
      showToast('Loaded ' + found.name + ' (' + appState.activeWorkout.exercises.length + ' exercises)');
    }

    function startMicroSession() {
      var microProg = null;
      for (var i = 0; i < appState.programs.length; i++) {
        if (appState.programs[i].type === 'Micro' || appState.programs[i].id === 'p4') {
          microProg = appState.programs[i];
          break;
        }
      }
      if (microProg) {
        startProgramWorkout(microProg.id, 'micro');
      } else {
        appState.activeWorkout.programId = 'p_micro_quick';
        appState.activeWorkout.sessionName = 'Quick 5-Min Micro Session';
        appState.activeWorkout.sessionType = 'micro';
        appState.activeWorkout.exercises = [
          { name: 'Dumbbell curl', sets: 2, reps: 10, weightKg: 12 },
          { name: 'Inverted plank', sets: 2, reps: 15, weightKg: 0 }
        ];
        appState.activeWorkout.currentExercise = 'Dumbbell curl';
        appState.activeWorkout.weightInput = '12';
        appState.activeWorkout.repsInput = 10;
        appState.activeWorkout.sets = [];
        saveStateToStorage();
        navigateApp('active-workout');
        showToast('Launched 5-Min Micro Session!', 'info');
      }
    }

    function startEmptyWorkout() {
      appState.activeWorkout.programId = 'p_empty';
      appState.activeWorkout.sessionName = 'Empty Workout';
      appState.activeWorkout.sessionType = 'micro';
      appState.activeWorkout.exercises = [];
      appState.activeWorkout.currentExercise = '';
      appState.activeWorkout.weightInput = '0';
      appState.activeWorkout.repsInput = 10;
      appState.activeWorkout.sets = [];
      saveStateToStorage();
      navigateApp('active-workout');
      showToast('Started Empty Workout. Add an exercise to begin!');
    }

    function confirmDeleteProgram(progId) {
      var target = null;
      for (var i = 0; i < appState.programs.length; i++) {
        if (appState.programs[i].id === progId) {
          target = appState.programs[i];
          break;
        }
      }
      if (!target) return;
      var isCurrentlyInUse = target.active || (appState.activeWorkout && appState.activeWorkout.programId === progId);
      var warningHtml = isCurrentlyInUse
        ? '<div class="af-subtle p-2.5 text-xs font-medium" style="border-left: 3px solid var(--warning);">This program is currently active. Deleting it will safely switch your active workout to another available program.</div>'
        : '';

      openModal(
        'Delete "' + target.name + '"?',
        '<div class="space-y-2.5">' +
          '<p class="text-xs af-text-muted">Are you sure you want to permanently delete <strong>' + escapeHtml(target.name) + '</strong>? This action will remove it from your programs and saved storage.</p>' +
          warningHtml +
        '</div>',
        '<button type="button" id="cancel-delete-program-btn" onclick="closeModal()" class="af-btn-secondary text-xs">Cancel</button>' +
        '<button type="button" id="confirm-delete-program-btn" onclick="executeDeleteProgram(\'' + target.id + '\')" class="af-btn-danger text-xs">Delete</button>'
      );
    }

    function executeDeleteProgram(progId) {
      var deletedName = 'Program';
      var wasActive = false;
      var wasWorkoutProg = (appState.activeWorkout && appState.activeWorkout.programId === progId);
      appState.programs = appState.programs.filter(function(p) {
        if (p.id === progId) {
          deletedName = p.name;
          if (p.active) wasActive = true;
          return false;
        }
        return true;
      });

      if (appState.programs.length > 0) {
        if (wasActive || !appState.programs.some(function(p) { return p.active; })) {
          appState.programs[0].active = true;
        }
        if (wasWorkoutProg) {
          var nextActive = getActiveProgram();
          syncActiveWorkoutWithProgram(nextActive, nextActive.type === 'Micro' ? 'micro' : 'full', true);
        }
      } else {
        appState.activeWorkout.programId = 'p_empty';
        appState.activeWorkout.sessionName = 'Empty Workout';
        appState.activeWorkout.sessionType = 'micro';
        appState.activeWorkout.exercises = [];
        appState.activeWorkout.currentExercise = '';
        appState.activeWorkout.weightInput = '0';
        appState.activeWorkout.repsInput = 10;
        appState.activeWorkout.sets = [];
      }

      saveStateToStorage();
      closeModal();
      renderCurrentScreen();
      showToast('Deleted program "' + deletedName + '"', 'danger');
    }

    function syncProgramEditorDomInputs() {
      var pe = appState.programEditor;
      var nameInput = document.getElementById('new-prog-name');
      var typeInput = document.getElementById('new-prog-type');
      var setsInput = document.getElementById('new-prog-sets');
      var repsInput = document.getElementById('new-prog-reps');
      var weightInput = document.getElementById('new-prog-weight');
      if (nameInput) pe.name = nameInput.value;
      if (typeInput && typeInput.value) pe.type = typeInput.value;
      if (setsInput) pe.sets = Math.max(1, parseInt(setsInput.value, 10) || 3);
      if (repsInput) pe.reps = Math.max(1, parseInt(repsInput.value, 10) || 10);
      if (weightInput) {
        var w = parseFloat(weightInput.value);
        pe.weightKg = (!isNaN(w) && w >= 0) ? w : 15;
      }
    }

    function updateProgramEditorField(field, value) {
      var pe = appState.programEditor;
      if (field === 'name') pe.name = value;
      else if (field === 'type') pe.type = value;
      else if (field === 'sets') pe.sets = Math.max(1, parseInt(value, 10) || 3);
      else if (field === 'reps') pe.reps = Math.max(1, parseInt(value, 10) || 10);
      else if (field === 'weightKg') {
        var w = parseFloat(value);
        pe.weightKg = (!isNaN(w) && w >= 0) ? w : 0;
      }
    }

            '</div>' +
            '<div>' +
              '<label class="text-[11px] font-semibold" for="new-prog-reps">Reps</label>' +
              '<input id="new-prog-reps" type="number" min="1" max="100" oninput="updateProgramEditorField(\'reps\', this.value)" class="af-input mt-1 text-xs" value="' + pe.reps + '" />' +
            '</div>' +
            '<div>' +
              '<label class="text-[11px] font-semibold" for="new-prog-weight">Weight (kg)</label>' +
              '<input id="new-prog-weight" type="number" min="0" step="0.5" oninput="updateProgramEditorField(\'weightKg\', this.value)" class="af-input mt-1 text-xs" value="' + pe.weightKg + '" />' +
            '</div>' +
          '</div>' +
          '<div class="space-y-2 pt-1">' +
            '<div class="flex items-center justify-between gap-2">' +
              '<label class="text-xs font-semibold">Selected Exercises (' + pe.selectedExercises.length + ')</label>' +
              '<button type="button" id="new-prog-add-exercise-btn" onclick="toggleProgramDiscoverPicker()" class="af-btn-tint !py-1.5 !px-3 text-xs">' +
                (pe.pickerOpen ? 'Done Selecting' : 'Add Exercise') +
              '</button>' +
            '</div>' +
            '<div id="new-prog-selected-list" class="space-y-1.5">' +
              selectedHtml +
            '</div>' +
          '</div>' +
          pickerPanelHtml +
        '</div>';
    }

    function refreshProgramEditorModal(errorMessage) {
      var bodyEl = document.getElementById('app-modal-body');
      if (bodyEl) {
        bodyEl.innerHTML = buildProgramEditorModalBodyHtml(errorMessage);
      }
    }

    function openNewProgramModal() {
      appState.programEditor = {
        editingId: null,
        name: '',
        type: 'Custom',
        sets: 3,
        reps: 10,
        weightKg: 15,
        pickerOpen: false,
        pickerSearch: '',
        pickerCategory: 'All',
        selectedExercises: []
      };
      openModal(
        'Create Custom Program',
        buildProgramEditorModalBodyHtml(''),
        '<button type="button" onclick="closeModal()" class="af-btn-secondary text-xs">Cancel</button>' +
        '<button type="button" id="save-new-program-btn" onclick="saveNewProgram()" class="af-btn-primary text-xs">Create Program</button>'
      );
    }

    function toggleProgramDiscoverPicker() {
      syncProgramEditorDomInputs();
      appState.programEditor.pickerOpen = !appState.programEditor.pickerOpen;
      refreshProgramEditorModal('');
    }

    function setProgramPickerCategory(cat) {
      syncProgramEditorDomInputs();
      appState.programEditor.pickerCategory = cat;
      refreshProgramEditorModal('');
    }

    function updateProgramPickerSearch(val) {
      syncProgramEditorDomInputs();
      appState.programEditor.pickerSearch = val;
      refreshProgramEditorModal('');
      var searchInput = document.getElementById('prog-picker-search');
      if (searchInput) {
        searchInput.focus();
        searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
      }
    }

    function toggleSelectDiscoverExercise(catId) {
      syncProgramEditorDomInputs();
      var pe = appState.programEditor;
      var catItem = null;
      for (var i = 0; i < appState.catalogue.length; i++) {
        if (appState.catalogue[i].id === catId) {
          catItem = appState.catalogue[i];
          break;
        }
      }
      if (!catItem) return;

      var existingIdx = -1;
      for (var j = 0; j < pe.selectedExercises.length; j++) {
        if (pe.selectedExercises[j].exerciseId === catItem.id || pe.selectedExercises[j].name.toLowerCase() === catItem.name.toLowerCase()) {
          existingIdx = j;
          break;
        }
      }

      if (existingIdx !== -1) {
        pe.selectedExercises.splice(existingIdx, 1);
      } else {
        pe.selectedExercises.push({
          exerciseId: catItem.id,
          name: catItem.name,
          sets: pe.sets || 3,
          reps: catItem.defaultReps || pe.reps || 10,
          weightKg: (catItem.defaultKg !== undefined) ? catItem.defaultKg : (pe.weightKg || 0)
        });
      }
      refreshProgramEditorModal('');
    }

    function removeProgramEditorExercise(idx) {
      syncProgramEditorDomInputs();
      var pe = appState.programEditor;
      if (idx >= 0 && idx < pe.selectedExercises.length) {
        pe.selectedExercises.splice(idx, 1);
      }
      refreshProgramEditorModal('');
    }

    function saveNewProgram() {
      syncProgramEditorDomInputs();
      var pe = appState.programEditor;
      var name = String(pe.name || '').trim();
      if (!name) {
        refreshProgramEditorModal('Please enter a program name.');
        return;
      }
      if (!Array.isArray(pe.selectedExercises) || pe.selectedExercises.length === 0) {
        pe.pickerOpen = true;
        refreshProgramEditorModal('Please select at least one exercise from Discover.');
        return;
      }

      var type = pe.type || 'Custom';
      var exercises = pe.selectedExercises.map(function(item) {
        return {
          exerciseId: item.exerciseId,
          name: item.name,
          sets: Math.max(1, parseInt(item.sets, 10) || pe.sets || 3),
          reps: Math.max(1, parseInt(item.reps, 10) || pe.reps || 10),
          weightKg: Math.max(0, parseFloat(item.weightKg !== undefined ? item.weightKg : pe.weightKg) || 0)
        };
      });

      var newProg = {
        id: 'p_custom_' + Date.now(),
        name: name,
        splitGroup: type,
        type: type,
        duration: type === 'Micro' ? '8 min' : '35 min',
        frequency: '3 days/wk',
        difficulty: 'Custom',
        active: true,
        exercises: exercises
      };

      appState.programs.forEach(function(p) { p.active = false; });
      appState.programs.unshift(newProg);
      syncActiveWorkoutWithProgram(newProg, type === 'Micro' ? 'micro' : 'full', true);
      saveStateToStorage();
      closeModal();
      renderCurrentScreen();
      showToast('Created and selected program "' + name + '"!');
    }

    // -------------------------------------------------------------------------
    // 9. ACTIVE WORKOUT SCREEN (/workout/active) — Simplified to 3 Sections (Req 2, 3, 4, 10)
    // -------------------------------------------------------------------------
    function formatMMSS(totalSec) {
      var safeSec = Math.max(0, Math.floor(Number(totalSec) || 0));
      var m = Math.floor(safeSec / 60);
      var s = safeSec % 60;
      return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    function getExerciseTargetInWorkout(exName) {
      var aw = appState.activeWorkout;
      if (Array.isArray(aw.exercises)) {
        for (var i = 0; i < aw.exercises.length; i++) {
          if (aw.exercises[i].name.toLowerCase() === String(exName || '').toLowerCase()) {
            return aw.exercises[i];
          }
        }
      }
      for (var j = 0; j < appState.catalogue.length; j++) {
        if (appState.catalogue[j].name.toLowerCase() === String(exName || '').toLowerCase()) {
          return {
            name: appState.catalogue[j].name,
            sets: appState.catalogue[j].defaultSets || 3,
            reps: appState.catalogue[j].defaultReps || 10,
            weightKg: appState.catalogue[j].defaultKg || 0
          };
        }
      }
      return { name: exName || 'Custom Exercise', sets: 3, reps: 10, weightKg: 0 };
    }

    function renderActiveWorkoutScreen() {
      var aw = appState.activeWorkout;
      var exercisesList = Array.isArray(aw.exercises) ? aw.exercises : [];

      // Count logged sets per exercise
      var setsByExercise = {};
      aw.sets.forEach(function(s) {
        var key = String(s.exerciseName || '').toLowerCase();
        setsByExercise[key] = (setsByExercise[key] || 0) + 1;
      });

      // Build Current Exercise details & controls
      var currentTarget = getExerciseTargetInWorkout(aw.currentExercise);
      var currentExLoggedCount = setsByExercise[String(aw.currentExercise || '').toLowerCase()] || 0;
      var currentIdx = -1;
      for (var k = 0; k < exercisesList.length; k++) {
        if (exercisesList[k].name.toLowerCase() === String(aw.currentExercise || '').toLowerCase()) {
          currentIdx = k;
          break;
        }
      }

      // Compact helper if user chose a non-manual input channel in Settings
      var channelHelperHtml = '';
      if (aw.inputMethod === 'sensor') {
        channelHelperHtml = '' +
          '<div class="af-subtle p-2.5 flex items-center justify-between gap-2 text-xs max-w-sm mx-auto">' +
            '<span>⌚ <strong>Auto-Count Channel:</strong> ' + (aw.sensorSimActive ? 'Counting reps...' : 'Ready') + '</span>' +
            '<button type="button" onclick="toggleSensorSimulation()" class="' + (aw.sensorSimActive ? 'af-btn-danger !py-1 !px-2.5 text-xs' : 'af-btn-tint !py-1 !px-2.5 text-xs') + '">' +
              (aw.sensorSimActive ? 'Stop Sensor' : 'Start Auto-Count') +
            '</button>' +
          '</div>';
      } else if (aw.inputMethod === 'voice') {

          '<div class="af-subtle p-2.5 flex items-center gap-2 text-xs max-w-sm mx-auto">' +
            '<input id="voice-command-input" type="text" class="af-input !py-1 text-xs" value="' + escapeHtml(aw.voiceSimText) + '" placeholder="e.g. 20 kg for 12 reps" />' +
            '<button type="button" onclick="parseVoiceSet()" class="af-btn-tint !py-1.5 !px-3 text-xs shrink-0">🎙️ Parse & Add Set</button>' +
          '</div>';
      } else if (aw.inputMethod === 'lockscreen') {
        channelHelperHtml = '' +
          '<div class="af-subtle p-2.5 flex items-center justify-between gap-2 text-xs max-w-sm mx-auto">' +
            '<span>🔒 <strong>Lockscreen Quick-Log:</strong> ' + escapeHtml(aw.weightInput || '0') + ' kg × ' + aw.repsInput + ' reps</span>' +
            '<button type="button" onclick="logCurrentSet()" class="af-btn-tint !py-1 !px-3 text-xs">Add Set</button>' +
          '</div>';
      }

      // Build Logged Sets rows
      var setsRowsHtml = aw.sets.map(function(s, idx) {
        return '' +
          '<div class="af-subtle p-2.5 px-3 flex items-center justify-between text-xs rounded-xl">' +
            '<div class="flex items-center gap-2 min-w-0">' +
              '<span class="w-5 h-5 rounded-full flex items-center justify-center font-bold text-[11px] shrink-0" style="background-color: var(--accent-tint); color: var(--accent);">' + (idx + 1) + '</span>' +
              '<div class="truncate">' +
                '<span class="font-bold">' + escapeHtml(s.exerciseName) + '</span>' +
                (s.exerciseSetNo ? '<span class="text-[11px] af-text-muted ml-1">(Set ' + s.exerciseSetNo + ')</span>' : '') +
                '<span class="af-text-muted ml-2">' + s.weightKg + ' kg × ' + s.reps + ' reps</span>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-2 shrink-0">' +
              '<span class="af-badge af-badge-blue text-[10px] uppercase">' + escapeHtml(s.inputMethod) + '</span>' +
              '<button type="button" onclick="removeLoggedSet(\'' + s.id + '\')" class="af-text-muted hover:text-red-500 font-bold px-1" title="Remove set" aria-label="Remove set">✕</button>' +
            '</div>' +
          '</div>';
      }).join('');

      return '' +
        '<div class="space-y-4">' +
          '<section id="workout-section-current" class="af-card p-3.5 space-y-2.5">' +
            '<!-- Navigation arrows: "<" in left corner and ">" in right corner, both larger -->' +
            '<div class="flex items-center justify-between w-full" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">' +
              '<button type="button" id="prev-exercise-btn" onclick="stepActiveExercise(-1)" class="af-btn-secondary !w-12 !h-12 !p-0 text-xl font-extrabold flex items-center justify-center rounded-xl" style="width: 3rem; height: 3rem; padding: 0; font-size: 1.25rem; font-weight: 800;' + (exercisesList.length <= 1 || currentIdx <= 0 ? ' opacity:0.45;' : '') + '" ' + (exercisesList.length <= 1 || currentIdx <= 0 ? 'disabled' : '') + ' title="Previous exercise" aria-label="Previous exercise">&lt;</button>' +
              '<button type="button" id="next-exercise-btn" onclick="stepActiveExercise(1)" class="af-btn-secondary !w-12 !h-12 !p-0 text-xl font-extrabold flex items-center justify-center rounded-xl" style="width: 3rem; height: 3rem; padding: 0; font-size: 1.25rem; font-weight: 800;' + (exercisesList.length <= 1 || currentIdx >= exercisesList.length - 1 ? ' opacity:0.45;' : '') + '" ' + (exercisesList.length <= 1 || currentIdx >= exercisesList.length - 1 ? 'disabled' : '') + ' title="Next exercise" aria-label="Next exercise">&gt;</button>' +
            '</div>' +

            '<!-- Centered "Current Exercise" label -->' +
            '<div class="text-center w-full" style="text-align: center; width: 100%;">' +
              '<h2 id="workout-current-exercise-heading" class="text-sm font-extrabold uppercase tracking-wider text-center" style="color: var(--accent); text-align: center; margin: 0 auto;">Current Exercise</h2>' +
            '</div>' +

            '<!-- Centered workout name box directly following "Current Exercise" -->' +
            '<div id="workout-name-box" class="flex justify-center w-full" style="display: flex; justify-content: center; width: 100%;">' +
              (exercisesList.length > 0
                ? '<select id="active-ex-select" aria-label="Current Exercise" onchange="changeActiveExercise(this.value)" class="af-input !py-2.5 !px-4 font-extrabold text-base text-center w-full max-w-xs mx-auto" style="text-align: center; text-align-last: center; max-width: 20rem; margin: 0 auto; font-weight: 800; font-size: 1rem;">' +
                    exercisesList.map(function(ex) {
                      var sel = (ex.name.toLowerCase() === String(aw.currentExercise || '').toLowerCase()) ? 'selected' : '';
                      return '<option value="' + escapeHtml(ex.name) + '" ' + sel + '>' + escapeHtml(ex.name) + '</option>';
                    }).join('') +
                  '</select>'
                : '<div id="active-ex-select" class="af-input !py-2.5 !px-4 font-extrabold text-base text-center w-full max-w-xs mx-auto" style="text-align: center; max-width: 20rem; margin: 0 auto; font-weight: 800; font-size: 1rem;">' + escapeHtml(aw.currentExercise || 'None Selected') + '</div>') +
            '</div>' +

            (aw.currentExercise
              ? '<p class="text-xs af-text-muted text-center" style="text-align: center;">Target: <strong>' + currentTarget.sets + ' sets × ' + currentTarget.reps + ' reps @ ' + currentTarget.weightKg + ' kg</strong> · Logged: ' + currentExLoggedCount + '/' + currentTarget.sets + '</p>'
              : '<p class="text-xs af-text-muted text-center" style="text-align: center;">Select a program or add an exercise from Discover to begin logging.</p>') +

            channelHelperHtml +

            '<!-- Set-Entry Area: Weight & Reps inputs followed by -1 reps, +1 reps, and Add Set buttons -->' +
            '<div id="set-entry-area" class="space-y-2.5 pt-0.5">' +
              '<div id="workout-weight-error" class="hidden p-2.5 rounded-xl text-xs font-semibold text-center" style="background-color: var(--danger-tint); color: var(--danger); text-align: center;"></div>' +

              '<div class="grid grid-cols-2 gap-3">' +
                '<div class="space-y-1 text-center" style="text-align: center;">' +
                  '<label class="text-xs font-semibold af-text-muted block text-center" for="active-weight-input">Weight (kg)</label>' +
                  '<input id="active-weight-input" type="text" inputmode="decimal" oninput="updateWeightInput(this.value)" class="af-input no-spinner text-center font-extrabold text-lg" style="text-align: center;" value="' + escapeHtml(aw.weightInput) + '" placeholder="0" />' +
                '</div>' +
                '<div class="space-y-1 text-center" style="text-align: center;">' +
                  '<label class="text-xs font-semibold af-text-muted block text-center" for="active-reps-input">Reps</label>' +
                  '<input id="active-reps-input" type="number" min="0" oninput="updateRepsInput(this.value)" class="af-input text-center font-extrabold text-lg" style="text-align: center;" value="' + aw.repsInput + '" />' +
                '</div>' +
              '</div>' +

              '<div class="space-y-2 pt-0.5">' +
                '<div class="grid grid-cols-2 gap-3.5">' +
                  '<button type="button" id="rep-minus-btn" onclick="incrementRepCounter(-1)" class="af-workout-rep-set-btn" style="background-color: var(--accent); color: #FFFFFF; border-color: var(--accent-dark);" title="Decrease reps by 1" aria-label="-1 reps">-1 reps</button>' +
                  '<button type="button" id="rep-plus-btn" onclick="incrementRepCounter(1)" class="af-workout-rep-set-btn" style="background-color: var(--accent); color: #FFFFFF; border-color: var(--accent-dark);" title="Increase reps by 1" aria-label="+1 reps">+1 reps</button>' +
                '</div>' +
                '<button type="button" id="workout-add-set-btn" onclick="logCurrentSet()" class="af-workout-rep-set-btn w-full" style="background-color: var(--accent); color: #FFFFFF; border-color: var(--accent-dark);" title="Save set and auto-start timer" aria-label="Add Set">Add Set</button>' +
              '</div>' +
            '</div>' +
          '</section>' +

          '<!-- LOGGED SETS SECTION -->' +
          '<section id="workout-section-logged" class="af-card p-3.5 space-y-2">' +
            '<div class="text-center space-y-1" style="text-align: center;">' +
              '<h2 id="workout-logged-sets-heading" class="text-sm font-extrabold uppercase tracking-wider text-center" style="color: var(--accent); text-align: center; margin: 0 auto;">Logged Sets (<span id="header-draft-sets-count">' + aw.sets.length + '</span>)</h2>' +
              '<div id="workout-total-vol" class="text-xs af-text-muted text-center" style="text-align: center;">Total Vol: <strong style="color: var(--text-primary);">' + computeActiveVolume() + ' kg</strong></div>' +
            '</div>' +

            '<div class="space-y-1.5">' +
              (setsRowsHtml || '<p class="text-xs af-text-muted py-1 text-center" style="text-align: center;">No sets logged yet. Tap "Add Set" above to record your first set.</p>') +
            '</div>' +

            '<div class="pt-3 border-t af-border flex flex-col items-center" style="display: flex; flex-direction: column; align-items: center; text-align: center;">' +
              '<button type="button" id="workout-finish-btn" onclick="finishActiveWorkout()" class="w-full max-w-xs !py-3.5 !px-8 rounded-full text-base font-extrabold text-white shadow-md text-center" style="background-color: #16A34A; width: 100%; max-width: 20rem; padding: 0.9rem 2rem; font-size: 1.05rem; font-weight: 800; border-radius: 9999px; color: #FFFFFF; border: none; cursor: pointer; display: block; margin: 0 auto; text-align: center;">Finish Workout</button>' +
            '</div>' +
          '</section>' +
        '</div>';

    // -------------------------------------------------------------------------
    function padTwoDigits(val) {
      var n = Math.max(0, Math.floor(Number(val) || 0));
      return n < 10 ? '0' + n : String(n);
    }

    function renderTimerScreen() {
      var aw = appState.activeWorkout;
      var total = Math.max(1, aw.restTotalSeconds || 120);
      var pct = Math.max(0, Math.min(100, Math.round((aw.restSeconds / total) * 100)));

      return '' +
        '<div class="space-y-4">' +
          '<!-- Focused Rest Timer Card -->' +
          '<div class="af-card p-5 text-center space-y-4">' +
            '<div class="flex items-center justify-center text-center w-full" style="display: flex; align-items: center; justify-content: center; text-align: center; width: 100%;">' +
              '<span id="rest-countdown-heading" class="text-xs font-extrabold uppercase tracking-wider text-center" style="color: var(--accent); text-align: center; margin: 0 auto;">Rest Countdown</span>' +
            '</div>' +

            '<div id="rest-timer-display" class="text-5xl font-extrabold tracking-tight py-1" style="color: var(--accent); font-variant-numeric: tabular-nums;">' +
