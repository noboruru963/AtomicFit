            '</div>' +

            '<!-- Editable Countdown Duration (Minutes & Seconds) -->' +
            '<div class="af-subtle p-3 space-y-2 text-left">' +
              '<div id="timer-validation-error" role="alert" class="' + (aw.timerValidationError ? '' : 'hidden ') + 'p-2 rounded-xl text-xs font-semibold text-center" style="background-color: var(--danger-tint); color: var(--danger);">' +
                escapeHtml(aw.timerValidationError) +
              '</div>' +
              '<div class="grid grid-cols-2 gap-2.5 items-end">' +
                '<div class="space-y-1">' +
                  '<label id="timer-min-label" class="text-[11px] font-semibold af-text-muted block" for="timer-min-input">Minutes</label>' +
                  '<input id="timer-min-input" type="number" min="0" max="180" inputmode="numeric" oninput="handleTimerDurationLiveInput()" onkeydown="handleTimerDurationKeydown(event)" class="af-input !py-1.5 text-center font-bold text-sm" value="' + padTwoDigits(aw.restMinutesInput) + '" aria-label="Minutes" />' +
                '</div>' +
                '<div class="space-y-1">' +
                  '<label id="timer-sec-label" class="text-[11px] font-semibold af-text-muted block" for="timer-sec-input">Seconds</label>' +
                  '<input id="timer-sec-input" type="number" min="0" max="59" inputmode="numeric" oninput="handleTimerDurationLiveInput()" onkeydown="handleTimerDurationKeydown(event)" class="af-input !py-1.5 text-center font-bold text-sm" value="' + padTwoDigits(aw.restSecondsInput) + '" aria-label="Seconds" />' +
                '</div>' +
              '</div>' +
            '</div>' +

            '<!-- Progress Bar -->' +
            '<div class="w-full h-2.5 rounded-full overflow-hidden af-subtle" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '">' +
              '<div id="rest-timer-progress" class="h-full transition-all duration-300" style="width: ' + pct + '%; background-color: var(--accent);"></div>' +
            '</div>' +

            '<!-- Target Duration and Exercise Labels -->' +
            '<p class="text-xs af-text-muted">Target Duration: <strong id="timer-target-duration">' + formatMMSS(aw.restTotalSeconds) + '</strong> · Exercise: <strong id="timer-exercise-label">' + escapeHtml(aw.currentExercise || 'General Rest') + '</strong></p>' +

            '<!-- Primary Controls: Start, Reset, Pause -->' +
            '<div id="timer-primary-controls-row" class="grid grid-cols-3 gap-2 pt-1">' +
              '<button type="button" id="timer-primary-btn" onclick="startRestTimerCountdown(false)" class="af-btn-primary w-full !py-2.5 text-xs" aria-label="Start countdown">Start</button>' +
              '<button type="button" id="timer-reset-btn" onclick="resetRestTimer()" class="af-btn-secondary w-full !py-2.5 text-xs" aria-label="Reset countdown">Reset</button>' +
              '<button type="button" id="timer-stop-btn" onclick="pauseRestTimer()" class="af-btn-danger w-full !py-2.5 text-xs" aria-label="Pause countdown">Pause</button>' +
            '</div>' +

            '<!-- 15-Second Adjustment Controls: Equal-Sized Side-by-Side Row -->' +
            '<div id="timer-adjust-controls-row" class="grid grid-cols-2 gap-2 pt-1">' +
              '<button type="button" id="timer-minus-15-btn" onclick="adjustRestSeconds(-15)" class="af-btn-secondary w-full !py-2.5 text-xs" aria-label="Subtract 15 seconds">-15s</button>' +
              '<button type="button" id="timer-plus-15-btn" onclick="adjustRestSeconds(15)" class="af-btn-secondary w-full !py-2.5 text-xs" aria-label="Add 15 seconds">+15s</button>' +
            '</div>' +
          '</div>' +

          '<!-- Prominent Full-Width Back to Workout Button at Bottom -->' +
          '<button type="button" id="timer-back-to-workout-btn" onclick="backToWorkoutFromTimer()" class="af-btn-primary w-full !py-4 text-base font-extrabold shadow-md" aria-label="Back to Workout">' +
            'Back to Workout' +
          '</button>' +
        '</div>';
    }

    function computeActiveVolume() {
      var total = 0;
      appState.activeWorkout.sets.forEach(function(s) {
        total += (Number(s.weightKg) || 0) * (Number(s.reps) || 0);
      });
      return Math.round(total * 10) / 10;
    }

    function switchInputMethod(method) {
      stopSensorSimulation();
      appState.activeWorkout.inputMethod = method;
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Input Channel set to ' + method.toUpperCase());
    }

    function changeActiveExercise(exName) {
      var aw = appState.activeWorkout;
      aw.currentExercise = exName;
      var target = getExerciseTargetInWorkout(exName);
      aw.weightInput = String(target.weightKg);
      aw.repsInput = target.reps;
      saveStateToStorage();
      renderCurrentScreen();
    }

    function stepActiveExercise(delta) {
      var aw = appState.activeWorkout;
      var list = Array.isArray(aw.exercises) ? aw.exercises : [];
      if (list.length === 0) return;
      var idx = 0;
      for (var i = 0; i < list.length; i++) {
        if (list[i].name.toLowerCase() === String(aw.currentExercise || '').toLowerCase()) {
          idx = i;
          break;
        }
      }
      var nextIdx = idx + delta;
      if (nextIdx >= 0 && nextIdx < list.length) {
        changeActiveExercise(list[nextIdx].name);
      }
    }

    function validateWeightValue(raw) {
      var str = String(raw !== undefined && raw !== null ? raw : '').trim();
      if (str === '') {
        return { valid: false, error: 'Please enter a valid weight in kg (0 or greater).' };
      }
      if (!/^\d+(\.\d+)?$/.test(str)) {
        return { valid: false, error: 'Weight (kg) must be a valid non-negative number.' };
      }
      var num = parseFloat(str);
      if (isNaN(num) || num < 0 || num > 1000) {
        return { valid: false, error: 'Weight (kg) must be between 0 and 1000.' };
      }
      return { valid: true, value: Math.round(num * 100) / 100, error: '' };
    }

    function updateWeightInput(val) {
      appState.activeWorkout.weightInput = val;
      var errEl = document.getElementById('workout-weight-error');
      var check = validateWeightValue(val);
      if (errEl) {
        if (!check.valid && String(val || '').trim() !== '') {
          errEl.textContent = check.error;
          errEl.classList.remove('hidden');
        } else {
          errEl.textContent = '';
          errEl.classList.add('hidden');
        }
      }
      saveStateToStorage();
    }

    function updateRepsInput(val) {
      var parsed = parseInt(val, 10);
      if (isNaN(parsed) || parsed < 0) parsed = 0;
      appState.activeWorkout.repsInput = parsed;
      var input = document.getElementById('active-reps-input');
      if (input && String(val).trim() !== '' && Number(val) < 0) {
        input.value = parsed;
      }
      saveStateToStorage();
    }

    function incrementRepCounter(delta) {
      var input = document.getElementById('active-reps-input');
      var baseVal = input ? parseInt(input.value, 10) : parseInt(appState.activeWorkout.repsInput, 10);
      if (isNaN(baseVal)) baseVal = Number(appState.activeWorkout.repsInput) || 0;
      appState.activeWorkout.repsInput = Math.max(0, baseVal + delta);
      if (input) input.value = appState.activeWorkout.repsInput;
      saveStateToStorage();
    }

    function toggleSessionType() {
      appState.activeWorkout.sessionType = (appState.activeWorkout.sessionType === 'full') ? 'micro' : 'full';
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Session mode switched to ' + appState.activeWorkout.sessionType.toUpperCase(), 'info');
    }

    function logCurrentSet() {
      var aw = appState.activeWorkout;
      if (!aw.currentExercise || !String(aw.currentExercise).trim()) {
        openAddCustomExerciseModal();
        showToast('Please add or select an exercise first.', 'info');
        return;
      }
      var weightInputEl = document.getElementById('active-weight-input');
      if (weightInputEl) {
        aw.weightInput = weightInputEl.value;
      }
      var repsInputEl = document.getElementById('active-reps-input');
      if (repsInputEl) {
        var parsedReps = parseInt(repsInputEl.value, 10);
        if (!isNaN(parsedReps)) {
          aw.repsInput = Math.max(0, parsedReps);
        }
      }
      var weightCheck = validateWeightValue(aw.weightInput);
      var errEl = document.getElementById('workout-weight-error');
      if (!weightCheck.valid) {
        if (errEl) {
          errEl.textContent = weightCheck.error;
          errEl.classList.remove('hidden');
        }
        showToast(weightCheck.error, 'danger');
        return;
      }
      if (errEl) {
        errEl.textContent = '';
        errEl.classList.add('hidden');
      }

      var w = weightCheck.value;
      aw.weightInput = String(w);
      var r = parseInt(aw.repsInput, 10);
      if (isNaN(r) || r < 0) r = 0;
      aw.repsInput = r;

      var exSetCount = aw.sets.filter(function(s) {
        return String(s.exerciseName || '').toLowerCase() === String(aw.currentExercise).toLowerCase();
      }).length + 1;

      var newSet = {
        id: 'ws_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        programId: aw.programId,
        exerciseName: aw.currentExercise,
        setNo: aw.sets.length + 1,
        exerciseSetNo: exSetCount,
        weightKg: w,
        reps: r,
        restS: aw.restTotalSeconds,
        inputMethod: aw.inputMethod
      };
      aw.sets.push(newSet);

      // Requirement 3.1 & 3.2: Begin workout elapsed timer on first Add Set tap and auto-start rest countdown
      if (!aw.startTime && !aw.workoutStartTimeMs) {
        var nowMs = Date.now();
        aw.startTime = nowMs;
        aw.workoutStartTimeMs = nowMs;
        aw.elapsedSeconds = 0;
      }

      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();
      if (!aw.restTotalSeconds || aw.restTotalSeconds <= 0) {
        aw.restTotalSeconds = 120;
      }
      aw.restMinutesInput = Math.floor(aw.restTotalSeconds / 60);
      aw.restSecondsInput = aw.restTotalSeconds % 60;
      aw.restSeconds = aw.restTotalSeconds;
      aw.restCompleted = false;
      aw.timerValidationError = '';

      saveStateToStorage();
      navigateApp('timer');
      startRestTimerCountdown(true);
      showToast('Logged Set #' + exSetCount + ' for ' + newSet.exerciseName + ' (' + w + ' kg × ' + r + ' reps) · Timer started!');
    }

    function removeLoggedSet(setId) {
      var aw = appState.activeWorkout;
      aw.sets = aw.sets.filter(function(s) {
        return s.id !== setId;
      });
      // Recalculate setNo and exerciseSetNo cleanly
      var counts = {};
      aw.sets.forEach(function(s, idx) {
        s.setNo = idx + 1;
        var key = String(s.exerciseName || '').toLowerCase();
        counts[key] = (counts[key] || 0) + 1;
        s.exerciseSetNo = counts[key];
      });
      saveStateToStorage();
      renderCurrentScreen();
    }

    function toggleSensorSimulation() {
      var aw = appState.activeWorkout;
      if (aw.sensorSimActive) {
        stopSensorSimulation();
        renderCurrentScreen();
        showToast('Accelerometer auto-count stopped.', 'info');
      } else {
        aw.sensorSimActive = true;
        renderCurrentScreen();
        sensorIntervalId = setInterval(function() {
          aw.repsInput = (Number(aw.repsInput) || 0) + 1;
          var repEl = document.getElementById('active-reps-input');
          if (repEl) repEl.value = aw.repsInput;
        }, 1100);
      }
    }

    function stopSensorSimulation() {
      if (sensorIntervalId) {
        clearInterval(sensorIntervalId);
        sensorIntervalId = null;
      }
      if (appState && appState.activeWorkout) {
        appState.activeWorkout.sensorSimActive = false;
      }
    }

    function parseVoiceSet() {
      var inputEl = document.getElementById('voice-command-input');
      var raw = inputEl ? inputEl.value.trim() : appState.activeWorkout.voiceSimText;
      appState.activeWorkout.voiceSimText = raw;
      var numbers = raw.match(/\d+(\.\d+)?/g);
      if (numbers && numbers.length >= 2) {
        appState.activeWorkout.weightInput = String(numbers[0]);
        appState.activeWorkout.repsInput = parseInt(numbers[1], 10);
      }
      logCurrentSet();
    }

    // =========================================================================
    // MANUAL TIMER CONFIGURATION & LIFECYCLE (Requirements 1, 5, 6, 9)
    // =========================================================================
    function clearRestInterval() {
      if (restIntervalId) {
        clearInterval(restIntervalId);
        restIntervalId = null;
      }
    }

    function validateTimerInputs(minRaw, secRaw) {
      var minStr = String(minRaw !== undefined && minRaw !== null ? minRaw : '').trim();
      var secStr = String(secRaw !== undefined && secRaw !== null ? secRaw : '').trim();

      if (minStr === '' && secStr === '') {
        return { valid: false, error: 'Please enter a duration in minutes or seconds.' };
      }
      if ((minStr !== '' && !/^-?\d+$/.test(minStr)) || (secStr !== '' && !/^-?\d+$/.test(secStr))) {
        return { valid: false, error: 'Invalid input: minutes and seconds must be whole numbers.' };
      }
      var m = minStr === '' ? 0 : parseInt(minStr, 10);
      var s = secStr === '' ? 0 : parseInt(secStr, 10);

      if (isNaN(m) || isNaN(s) || m < 0 || s < 0) {
        return { valid: false, error: 'Timer duration cannot be negative.' };
      }
      if (s > 59) {
        return { valid: false, error: 'Seconds must be between 0 and 59.' };
      }
      var total = m * 60 + s;
      if (total <= 0) {
        return { valid: false, error: 'Timer duration must be greater than 0 seconds.' };
      }
      if (total > 10800) {
        return { valid: false, error: 'Timer duration cannot exceed 180 minutes.' };
      }
      return { valid: true, minutes: m, seconds: s, totalSeconds: total, error: '' };
    }

    function handleTimerDurationKeydown(evt) {
      if (evt && evt.key === 'Enter') {
        evt.preventDefault();
        applyCustomTimerFromInputs(false);
      }
    }

    function handleTimerDurationLiveInput() {
      var minEl = document.getElementById('timer-min-input');
      var secEl = document.getElementById('timer-sec-input');
      var errEl = document.getElementById('timer-validation-error');
      if (!minEl || !secEl) return;

      var res = validateTimerInputs(minEl.value, secEl.value);
      var aw = appState.activeWorkout;
      if (!res.valid) {
        aw.timerValidationError = res.error;
        if (errEl) {
          errEl.textContent = res.error;
          errEl.classList.remove('hidden');
        }
        return;
      }

      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();

      aw.timerValidationError = '';
      if (errEl) {
        errEl.textContent = '';
        errEl.classList.add('hidden');
      }

      aw.restMinutesInput = res.minutes;
      aw.restSecondsInput = res.seconds;
      aw.restTotalSeconds = res.totalSeconds;
      aw.restSeconds = res.totalSeconds;
      aw.restRunning = false;
      aw.restCompleted = false;
      aw.restEndTimeMs = null;
      saveStateToStorage();

      var targetEl = document.getElementById('timer-target-duration');
      if (targetEl) targetEl.textContent = formatMMSS(aw.restTotalSeconds);
      updateLiveTimerDom();
    }

    function applyCustomTimerFromInputs(shouldStart) {
      var minEl = document.getElementById('timer-min-input');
      var secEl = document.getElementById('timer-sec-input');
      var minVal = minEl ? minEl.value : appState.activeWorkout.restMinutesInput;
      var secVal = secEl ? secEl.value : appState.activeWorkout.restSecondsInput;
      return setCustomTimerDuration(minVal, secVal, shouldStart);
    }

    function setCustomTimerDuration(minRaw, secRaw, shouldStart) {
      var res = validateTimerInputs(minRaw, secRaw);
      var aw = appState.activeWorkout;
      if (!res.valid) {
        aw.timerValidationError = res.error;
        renderCurrentScreen();
        showToast(res.error, 'danger');
        return false;
      }
      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();

      aw.timerValidationError = '';
      aw.restMinutesInput = res.minutes;
      aw.restSecondsInput = res.seconds;
      aw.restTotalSeconds = res.totalSeconds;
      aw.restSeconds = res.totalSeconds;
      aw.restRunning = false;
      aw.restCompleted = false;
      aw.restEndTimeMs = null;
      saveStateToStorage();

      if (shouldStart) {
        startRestTimerCountdown(true);
      } else {
        renderCurrentScreen();
        showToast('Timer set to ' + formatMMSS(res.totalSeconds));
      }
      return true;
    }

    function setRestPreset(seconds) {
      var safeSec = Math.max(1, parseInt(seconds, 10) || 60);
      var m = Math.floor(safeSec / 60);
      var s = safeSec % 60;
      setCustomTimerDuration(m, s, false);
    }

    function adjustRestSeconds(delta) {
      var aw = appState.activeWorkout;
      var currentRemaining = Number(aw.restSeconds);
      if (isNaN(currentRemaining) || currentRemaining < 0) currentRemaining = 0;
      if (aw.restRunning && aw.restEndTimeMs) {
        currentRemaining = Math.max(0, Math.ceil((aw.restEndTimeMs - Date.now()) / 1000));
      }
      var nextSec = Math.max(0, Math.min(10800, currentRemaining + delta));
      aw.restSeconds = nextSec;
      if (aw.restRunning) {
        if (nextSec <= 0) {
          completeRestTimerNow(aw.timerRunId);
          return;
        }
        aw.restEndTimeMs = Date.now() + nextSec * 1000;
        scheduleRestNotificationForCurrentRun();
      }
      aw.restCompleted = false;
      aw.timerValidationError = '';
      saveStateToStorage();
      updateLiveTimerDom();
    }

    function updateLiveTimerDom(syncInputs) {
      var aw = appState.activeWorkout;
      var disp = document.getElementById('rest-timer-display');
      if (disp) disp.textContent = formatMMSS(aw.restSeconds);
      var targetEl = document.getElementById('timer-target-duration');
      if (targetEl) targetEl.textContent = formatMMSS(aw.restTotalSeconds);
      var errEl = document.getElementById('timer-validation-error');
      if (errEl) {
        if (aw.timerValidationError) {
          errEl.textContent = aw.timerValidationError;
          errEl.classList.remove('hidden');
        } else {
          errEl.textContent = '';
          errEl.classList.add('hidden');
        }
      }
      if (syncInputs) {
        var minEl = document.getElementById('timer-min-input');
        var secEl = document.getElementById('timer-sec-input');
        if (minEl) minEl.value = padTwoDigits(aw.restMinutesInput);
        if (secEl) secEl.value = padTwoDigits(aw.restSecondsInput);
      }
      var prog = document.getElementById('rest-timer-progress');
      if (prog) {
        var total = Math.max(1, aw.restTotalSeconds || 120);
        var pct = Math.max(0, Math.min(100, Math.round((aw.restSeconds / total) * 100)));
        prog.style.width = pct + '%';
        if (prog.parentElement) {
          prog.parentElement.setAttribute('aria-valuenow', String(pct));
        }
      }
      updateChromeBars();
    }

    function completeRestTimerNow(runId) {
      var aw = appState.activeWorkout;
      if (!aw.restRunning && runId && aw.bellPlayedForRunId === runId) {
        return;
      }
      clearRestInterval();
      if (restNotificationTimeoutId) {
        clearTimeout(restNotificationTimeoutId);
        restNotificationTimeoutId = null;
      }
      aw.restRunning = false;
      aw.restSeconds = aw.restTotalSeconds;
      aw.restCompleted = false;
      aw.restEndTimeMs = null;
      saveStateToStorage();

      if (isAppInBackground()) {
        sendBackgroundRestNotificationOnce(runId);
      } else {
        playBellSoundOnce(runId, false);
        showToast('🔔 Rest complete! Ready for your next set.');
      }
      navigateApp('active-workout');
    }

    function dismissTimerCompletion() {
      stopBellSound();
      cancelScheduledRestNotification();
      var aw = appState.activeWorkout;
      aw.restCompleted = false;
      aw.restSeconds = aw.restTotalSeconds;
      saveStateToStorage();
      renderCurrentScreen();
    }

    function startRestTimerCountdown(restartFromFull) {
      var aw = appState.activeWorkout;
      unlockAudioContext();
      stopBellSound();

      // Prevent duplicate intervals when Start is clicked repeatedly while already running
      if (aw.restRunning && !restartFromFull && restIntervalId !== null) {
        return true;
      }

      // Validate current duration inputs on the Timer page before starting
      if (appState.currentScreen === 'timer') {
        var minEl = document.getElementById('timer-min-input');
        var secEl = document.getElementById('timer-sec-input');
        if (minEl && secEl) {
          var check = validateTimerInputs(minEl.value, secEl.value);
          if (!check.valid) {
            aw.timerValidationError = check.error;
            renderCurrentScreen();
            showToast(check.error, 'danger');
            return false;
          }
          aw.timerValidationError = '';
          if (check.totalSeconds !== aw.restTotalSeconds) {
            aw.restMinutesInput = check.minutes;
            aw.restSecondsInput = check.seconds;
            aw.restTotalSeconds = check.totalSeconds;
            aw.restSeconds = check.totalSeconds;
          }
        }
      }

      clearRestInterval();

      if (restartFromFull || aw.restSeconds <= 0 || aw.restCompleted) {
        aw.restSeconds = aw.restTotalSeconds;
      }
      if (aw.restSeconds <= 0) {
        aw.timerValidationError = 'Timer duration must be greater than 0 seconds.';
        renderCurrentScreen();
        return false;
      }

      aw.timerValidationError = '';
      aw.restCompleted = false;
      aw.restRunning = true;
      aw.timerRunId = (aw.timerRunId || 0) + 1;
      var currentRunId = aw.timerRunId;
      aw.restEndTimeMs = Date.now() + aw.restSeconds * 1000;

      if (appState.settings.restNotifications && typeof Notification !== 'undefined' && Notification.permission === 'default') {
        requestRestNotificationPermission(true);
      }

      scheduleRestNotificationForCurrentRun();
      saveStateToStorage();

      restIntervalId = setInterval(function() {
        if (!appState.activeWorkout.restRunning || appState.activeWorkout.timerRunId !== currentRunId) {
          clearRestInterval();
          return;
        }
        var remaining = Math.max(0, Math.ceil((appState.activeWorkout.restEndTimeMs - Date.now()) / 1000));
        appState.activeWorkout.restSeconds = remaining;
        if (remaining > 0) {
          updateLiveTimerDom();
        } else {
          completeRestTimerNow(currentRunId);
        }
      }, 200);

      if (document.getElementById('rest-timer-display')) {
        updateLiveTimerDom(false);
      } else {
        renderCurrentScreen();
      }
      return true;
    }

    function pauseRestTimer() {
      var aw = appState.activeWorkout;
      if (aw.restRunning && aw.restEndTimeMs) {
        aw.restSeconds = Math.max(0, Math.ceil((aw.restEndTimeMs - Date.now()) / 1000));
      }
      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();
      aw.restRunning = false;
      aw.restEndTimeMs = null;
      saveStateToStorage();
      if (document.getElementById('rest-timer-display')) {
        updateLiveTimerDom(false);
      } else {
        renderCurrentScreen();
      }
    }

    function toggleRestTimer() {
      if (appState.activeWorkout.restRunning) {
        pauseRestTimer();
      } else {
        startRestTimerCountdown(false);
      }
    }

    function resetRestTimer() {
      var aw = appState.activeWorkout;
      // Invalidate any active countdown run immediately, even if the timer already started
      aw.timerRunId = (aw.timerRunId || 0) + 1;
      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();

      // If valid minutes/seconds are currently entered on the Rest Timer page, sync target duration
      var minEl = document.getElementById('timer-min-input');
      var secEl = document.getElementById('timer-sec-input');
      if (minEl && secEl) {
        var check = validateTimerInputs(minEl.value, secEl.value);
        if (check.valid) {
          aw.restMinutesInput = check.minutes;
          aw.restSecondsInput = check.seconds;
          aw.restTotalSeconds = check.totalSeconds;
        }
      }
      if (!aw.restTotalSeconds || aw.restTotalSeconds <= 0) {
        aw.restTotalSeconds = 120;
      }

      aw.restRunning = false;
      aw.restCompleted = false;
      aw.restEndTimeMs = null;
      aw.timerValidationError = '';
      aw.restSeconds = aw.restTotalSeconds;
      aw.restMinutesInput = Math.floor(aw.restTotalSeconds / 60);
      aw.restSecondsInput = aw.restTotalSeconds % 60;
      saveStateToStorage();
      if (document.getElementById('rest-timer-display')) {
        updateLiveTimerDom(true);
      } else {
        renderCurrentScreen();
      }
      showToast('Timer reset to ' + formatMMSS(aw.restTotalSeconds), 'info');
    }

    function skipRestTimer() {
      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();
      var aw = appState.activeWorkout;
      aw.restRunning = false;
      aw.restCompleted = false;
      aw.restEndTimeMs = null;
      aw.timerValidationError = '';
      aw.restSeconds = aw.restTotalSeconds;
      saveStateToStorage();
      navigateApp('active-workout');
      showToast('Rest skipped.');
    }

    function cancelRestTimer() {
      pauseRestTimer();
    }

    function backToWorkoutFromTimer() {
      var aw = appState.activeWorkout;
      if (aw.restRunning && aw.restEndTimeMs) {
        aw.restSeconds = Math.max(0, Math.ceil((aw.restEndTimeMs - Date.now()) / 1000));
      }
      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();
      aw.restRunning = false;
      aw.restEndTimeMs = null;
      saveStateToStorage();
      navigateApp('active-workout');
    }

    // Sync timer state when app/tab transitions between background and foreground (Requirement 9)
    document.addEventListener('visibilitychange', function() {
      var aw = appState.activeWorkout;
      if (aw.restRunning && aw.restEndTimeMs) {
        var rem = Math.max(0, Math.ceil((aw.restEndTimeMs - Date.now()) / 1000));
        aw.restSeconds = rem;
        if (rem <= 0) {
          completeRestTimerNow(aw.timerRunId);
        } else {
          updateLiveTimerDom();
        }
      }
    });

    function finishActiveWorkout() {
      stopSensorSimulation();
      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();
      appState.activeWorkout.restRunning = false;
      appState.activeWorkout.restCompleted = false;
      appState.activeWorkout.restEndTimeMs = null;

      var aw = appState.activeWorkout;
      var totalSets = aw.sets.length;
      var totalReps = 0;
      var totalVol = 0;
      var methodsMap = {};

      aw.sets.forEach(function(s) {
        totalReps += Number(s.reps) || 0;
        totalVol += (Number(s.weightKg) || 0) * (Number(s.reps) || 0);
        methodsMap[s.inputMethod] = true;
      });

      var methodsArr = Object.keys(methodsMap);
      if (methodsArr.length === 0) {
        methodsArr = [aw.inputMethod || 'manual'];
      }
      var startRef = aw.startTime || aw.workoutStartTimeMs;
      var wallElapsedSec = startRef ? Math.max(0, Math.round((Date.now() - startRef) / 1000)) : 0;
      var manualElapsedSec = Math.max(0, Math.floor(Number(aw.elapsedSeconds) || 0));
      var elapsedSec = (manualElapsedSec > 0 && Math.abs(manualElapsedSec - wallElapsedSec) > 2)
        ? manualElapsedSec
        : wallElapsedSec;
      var elapsedFormatted = formatMMSS(elapsedSec);
      var durMin = Math.max(1, Math.round(elapsedSec / 60));

      appState.lastCompletedWorkout = {
        name: aw.sessionName,
        type: aw.sessionType,
        durationFormatted: elapsedFormatted,
        durationSec: elapsedSec,
        durationMin: durMin,
        totalSets: totalSets,
        totalReps: totalReps,
        totalVolume: Math.round(totalVol * 10) / 10,
        methods: methodsArr
      };

      appState.history.unshift({
        id: 's_' + Date.now(),
        name: aw.sessionName,
        type: aw.sessionType,
        date: 'Oct 20, 14:30',
        dayOfMonth: 20,
        durationFormatted: elapsedFormatted,
        durationSec: elapsedSec,
        durationMin: durMin,
        reps: totalReps,
        volume: Math.round(totalVol * 10) / 10,
        setsCount: totalSets,
        methods: methodsArr,
        setsDetail: aw.sets.slice()
      });

      aw.sets = [];
      aw.startTime = null;
      aw.workoutStartTimeMs = null;
      aw.elapsedSeconds = 0;
      saveStateToStorage();
      navigateApp('workout-complete');
      showToast('Workout completed and saved to History!');
    }

    // -------------------------------------------------------------------------
    // 10. WORKOUT COMPLETE SCREEN (/workout/complete)
    // -------------------------------------------------------------------------
    function renderWorkoutCompleteScreen() {
      var lw = appState.lastCompletedWorkout;
      return '' +
        '<div class="py-4 space-y-5">' +
          '<div class="af-card p-6 text-center space-y-4">' +
            '<div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl shadow-sm" style="background-color: var(--success-tint); color: var(--success);">✓</div>' +

    function unstitchSession(sessionId) {
      var targetIdx = -1;
      for (var i = 0; i < appState.history.length; i++) {
        if (appState.history[i].id === sessionId) {
          targetIdx = i;
          break;
        }
      }
      if (targetIdx === -1) return;
      var item = appState.history[targetIdx];
      var children = (item.children && item.children.length) ? item.children : [
        { id: item.id + '_1', name: item.name + ' (Part 1)', type: 'micro', date: item.date, dayOfMonth: item.dayOfMonth, durationMin: 12, reps: Math.floor(item.reps / 2), volume: Math.round(item.volume / 2), setsCount: 2, methods: ['manual'] },
        { id: item.id + '_2', name: item.name + ' (Part 2)', type: 'micro', date: item.date, dayOfMonth: item.dayOfMonth, durationMin: 14, reps: item.reps - Math.floor(item.reps / 2), volume: item.volume - Math.round(item.volume / 2), setsCount: 2, methods: ['voice'] }
      ];
      appState.history.splice(targetIdx, 1, children[0], children[1]);
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Unstitched into ' + children.length + ' individual Micro sessions!');
    }

    function stitchMicroSessions() {
      var micros = [];
      var others = [];
      appState.history.forEach(function(h) {
        if (h.type === 'micro' && micros.length < 2) micros.push(h);
        else others.push(h);
      });
      if (micros.length < 2) return;
      var combinedReps = micros[0].reps + micros[1].reps;
      var combinedVol = micros[0].volume + micros[1].volume;
      var stitched = {
        id: 's_stitched_' + Date.now(),
        name: micros[0].name + ' + ' + micros[1].name,
        type: 'stitched',
        date: micros[0].date,
        dayOfMonth: micros[0].dayOfMonth || 18,
        durationMin: (micros[0].durationMin || 8) + (micros[1].durationMin || 8),
        reps: combinedReps,
        volume: combinedVol,
        setsCount: (micros[0].setsCount || 2) + (micros[1].setsCount || 2),
        methods: ['manual', 'lockscreen'],
        children: micros
      };
      others.unshift(stitched);
      appState.history = others;
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Stitched 2 micro-sessions into a unified workout!');
    }

    // 12. DISCOVER & MANUAL EXERCISE ENTRY (/discover) — Requirement 4

    function ensureExerciseInCatalogue(name, category, sets, reps, weightKg) {
      var cleanName = String(name || '').trim();
      if (!cleanName) return null;
      var existing = null;
      for (var i = 0; i < appState.catalogue.length; i++) {
        if (appState.catalogue[i].name.toLowerCase() === cleanName.toLowerCase()) {
          existing = appState.catalogue[i];
          break;
        }
      }
      if (existing) {
        return existing;
      }
      var created = {
        id: 'cat_custom_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        name: cleanName,
        category: category || 'Custom',
        defaultSets: Math.max(1, parseInt(sets, 10) || 3),
        defaultReps: Math.max(1, parseInt(reps, 10) || 10),
        defaultKg: Math.max(0, parseFloat(weightKg) || 0),
        isCustom: true,
        description: 'Custom exercise added manually.'
      };
      appState.catalogue.unshift(created);
      return created;
    }

    function addExerciseToWorkoutAndProgram(exName, sets, reps, weightKg, category) {
      var cleanName = String(exName || '').trim();
      if (!cleanName) {
        return { ok: false, error: 'Please enter an exercise name.' };
      }
      var s = Math.max(1, parseInt(sets, 10) || 3);
      var r = Math.max(1, parseInt(reps, 10) || 10);
      var w = Math.max(0, parseFloat(weightKg));
      if (isNaN(w)) w = 0;

      var catEntry = ensureExerciseInCatalogue(cleanName, category || 'Custom', s, r, w);
      var canonicalName = catEntry ? catEntry.name : cleanName;

      var aw = appState.activeWorkout;
      if (!Array.isArray(aw.exercises)) aw.exercises = [];
      var existingInWorkout = null;
      for (var i = 0; i < aw.exercises.length; i++) {
        if (aw.exercises[i].name.toLowerCase() === canonicalName.toLowerCase()) {
          existingInWorkout = aw.exercises[i];
          break;
        }
      }
      if (!existingInWorkout) {
        aw.exercises.push({
          name: canonicalName,
          sets: s,
          reps: r,
          weightKg: w
        });
      }

      // Also sync to the currently active program if it matches aw.programId
      for (var p = 0; p < appState.programs.length; p++) {
        if (appState.programs[p].id === aw.programId) {
          var progEx = appState.programs[p].exercises;
          var inProg = progEx.some(function(e) { return e.name.toLowerCase() === canonicalName.toLowerCase(); });
          if (!inProg) {
            progEx.push({ name: canonicalName, sets: s, reps: r, weightKg: w });
          }
          break;
        }
      }

      aw.currentExercise = canonicalName;
      aw.weightInput = String(existingInWorkout ? existingInWorkout.weightKg : w);
      aw.repsInput = existingInWorkout ? existingInWorkout.reps : r;
      saveStateToStorage();
      return { ok: true, name: canonicalName, alreadyInWorkout: !!existingInWorkout };
    }

    function submitModalCustomExercise() {
      var nameEl = document.getElementById('modal-custom-ex-name');
      var catEl = document.getElementById('modal-custom-ex-category');
      var setsEl = document.getElementById('modal-custom-ex-sets');
      var repsEl = document.getElementById('modal-custom-ex-reps');
      var weightEl = document.getElementById('modal-custom-ex-weight');
      var errEl = document.getElementById('modal-custom-ex-error');

      var rawName = nameEl ? nameEl.value.trim() : '';
      if (!rawName) {
        if (errEl) {
          errEl.textContent = 'Please enter a valid exercise name.';
          errEl.classList.remove('hidden');
        }
        return;
      }
      var res = addExerciseToWorkoutAndProgram(
        rawName,
        setsEl ? setsEl.value : 3,
        repsEl ? repsEl.value : 10,
        weightEl ? weightEl.value : 15,
        catEl ? catEl.value : 'Custom'
      );

          errEl.classList.remove('hidden');

      }
      closeModal();
      renderCurrentScreen();

      renderCurrentScreen();
      showToast('Added custom exercise "' + res.name + '"!');
      return true;

            '<div class="flex flex-wrap gap-1.5">' +
              catPills +
            '</div>' +
          '</div>' +

          '<div class="space-y-2.5">' +
            (listHtml || '<div class="af-card p-6 text-center text-xs af-text-muted">No matching exercises in catalogue. Use "Add Custom Exercise" above!</div>') +
          '</div>' +
        '</div>';
    }

    function setCatalogueFilter(cat) {
      appState.catalogueFilter = cat;
      renderCurrentScreen();
    }

    function updateCatalogueSearch(val) {
      appState.catalogueSearch = val;
      renderCurrentScreen();
      var el = document.getElementById('discover-search-input');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }

    function addExerciseFromDiscover(exName) {
      var found = null;
      for (var i = 0; i < appState.catalogue.length; i++) {
        if (appState.catalogue[i].name.toLowerCase() === String(exName || '').toLowerCase()) {
          found = appState.catalogue[i];
          break;
        }
      }
      var sets = found && found.defaultSets ? found.defaultSets : 3;
      var reps = found && found.defaultReps ? found.defaultReps : 10;
      var weight = found && found.defaultKg !== undefined ? found.defaultKg : 0;
      var cat = found && found.category ? found.category : 'Custom';

      addExerciseToWorkoutAndProgram(exName, sets, reps, weight, cat);
      showToast('Added "' + exName + '" to Active Workout!');
      navigateApp('active-workout');
    }

    // -------------------------------------------------------------------------
    // 13. PROFILE SCREEN (/profile)
    // -------------------------------------------------------------------------
    function renderProfileScreen() {
      var u = appState.user;
      var totalVolumeAll = 0;
      appState.history.forEach(function(h) { totalVolumeAll += Number(h.volume) || 0; });

      var dayOpts = '';
      for (var d = 1; d <= 31; d++) {
        dayOpts += '<option value="' + d + '" ' + (String(u.dobDay || '') === String(d) ? 'selected' : '') + '>' + d + '</option>';
      }

      var monthOpts = CALENDAR_MONTHS.map(function(m) {
        return '<option value="' + m + '" ' + (u.dobMonth === m ? 'selected' : '') + '>' + m + '</option>';
      }).join('');

      var yearOpts = '';
      for (var y = 2025; y >= 1920; y--) {
        yearOpts += '<option value="' + y + '" ' + (String(u.dobYear || '') === String(y) ? 'selected' : '') + '>' + y + '</option>';
      }

      return '' +
        '<div class="space-y-4">' +
          '<div class="af-card p-5 flex items-center justify-between gap-3">' +
            '<div class="flex items-center gap-3.5">' +
              '<div class="w-14 h-14 rounded-full overflow-hidden border-2 shrink-0 flex items-center justify-center" style="width: 3.5rem; height: 3.5rem; border-color: var(--accent); background-color: #FFFFFF;">' +
              '<img src="' + PANDA_LOGO_SRC + '" data-asset-src="assets/logo.jpg" alt="AtomFit panda logo" class="w-full h-full object-cover" style="width: 100%; height: 100%; object-fit: cover;" />' +
            '</div>' +
            '<div>' +
                '<h1 id="profile-header-username" class="text-lg font-extrabold">' + escapeHtml(u.username) + '</h1>' +
                '<p id="profile-header-email" class="text-xs af-text-muted">' + escapeHtml(u.email) + '</p>' +
                '<span class="af-badge af-badge-blue mt-1 text-[10px]">Member since ' + escapeHtml(u.createdAt) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div id="profile-stats-grid" class="grid grid-cols-2 gap-3 text-center">' +
            '<div class="af-card p-3.5">' +
              '<div class="text-[11px] af-text-muted">Sessions</div>' +
              '<div class="text-base font-extrabold mt-0.5">' + appState.history.length + '</div>' +
            '</div>' +
            '<div class="af-card p-3.5">' +
              '<div class="text-[11px] af-text-muted">Volume</div>' +
              '<div class="text-base font-extrabold mt-0.5" style="color: var(--accent);">' + Math.round(totalVolumeAll) + ' kg</div>' +
            '</div>' +
          '</div>' +

          '<div class="af-card p-5 space-y-3.5">' +
            '<h2 class="text-sm font-bold">Personal Details</h2>' +
            '<div id="profile-error-banner" role="alert" class="hidden p-3 rounded-xl text-xs font-semibold" style="background-color: var(--danger-tint); color: var(--danger);"></div>' +
            '<div class="space-y-1">' +
              '<label class="text-xs font-semibold af-text-muted" for="prof-username">Username</label>' +
              '<input id="prof-username" type="text" class="af-input text-xs" value="' + escapeHtml(u.username) + '" />' +
            '</div>' +
            '<div class="space-y-1">' +
              '<label class="text-xs font-semibold af-text-muted" for="prof-email">Email</label>' +
              '<input id="prof-email" type="email" class="af-input text-xs" value="' + escapeHtml(u.email) + '" />' +
            '</div>' +
            '<div class="space-y-1">' +
              '<label class="text-xs font-semibold af-text-muted">Date of birth</label>' +
              '<div class="grid grid-cols-3 gap-2">' +
                '<select id="prof-day" aria-label="Date of birth Day" class="af-input text-xs">' + dayOpts + '</select>' +
                '<select id="prof-month" aria-label="Date of birth Month" class="af-input text-xs">' + monthOpts + '</select>' +
                '<select id="prof-year" aria-label="Date of birth Year" class="af-input text-xs">' + yearOpts + '</select>' +
              '</div>' +
            '</div>' +
            '<div class="space-y-1">' +
              '<label class="text-xs font-semibold af-text-muted" for="prof-gender">Gender</label>' +
              '<select id="prof-gender" class="af-input text-xs">' +
                '<option value="Male" ' + (u.gender === 'Male' ? 'selected' : '') + '>Male</option>' +
                '<option value="Female" ' + (u.gender === 'Female' ? 'selected' : '') + '>Female</option>' +
                '<option value="Prefer not to say" ' + (u.gender === 'Prefer not to say' ? 'selected' : '') + '>Prefer not to say</option>' +
              '</select>' +
            '</div>' +

            '<div class="grid grid-cols-2 gap-3">' +
              '<div class="space-y-1">' +
                '<label class="text-xs font-semibold af-text-muted" for="prof-weight">Weight (kg)</label>' +
                '<input id="prof-weight" type="text" inputmode="decimal" class="af-input text-xs" value="' + escapeHtml(u.weightKg) + '" />' +
              '</div>' +
              '<div class="space-y-1">' +
                '<label class="text-xs font-semibold af-text-muted" for="prof-height">Height (cm)</label>' +
                '<input id="prof-height" type="text" inputmode="numeric" class="af-input text-xs" value="' + escapeHtml(u.heightCm) + '" />' +
              '</div>' +
            '</div>' +

            '<button type="button" id="profile-update-btn" onclick="saveProfileChanges()" class="af-btn-primary w-full text-xs mt-1">Update profile</button>' +
          '</div>' +
        '</div>';
    }

    function saveProfileChanges() {
      var usernameVal = document.getElementById('prof-username').value;
      var emailVal = document.getElementById('prof-email').value.trim() || appState.user.email;
      var dayVal = document.getElementById('prof-day').value;
      var monthVal = document.getElementById('prof-month').value;
      var yearVal = document.getElementById('prof-year').value;
      var genderVal = document.getElementById('prof-gender').value;
      var weightVal = document.getElementById('prof-weight').value;
      var heightVal = document.getElementById('prof-height').value;
      var errEl = document.getElementById('profile-error-banner');

      var check = validatePersonalDetailsInput(usernameVal, dayVal, monthVal, yearVal, genderVal, weightVal, heightVal);
      if (!check.valid) {
        if (errEl) {
          errEl.textContent = check.error;
          errEl.classList.remove('hidden');
        }
        return false;
      }

      appState.user.username = check.username;
      appState.user.email = emailVal;
      appState.user.dobDay = check.dobDay;
      appState.user.dobMonth = check.dobMonth;
      appState.user.dobYear = check.dobYear;
      appState.user.gender = check.gender;
      appState.user.weightKg = check.weightKg;
      appState.user.heightCm = check.heightCm;
      appState.user.personal_details_complete = true;
      appState.user.personalDetailsComplete = true;

      upsertAccountRecord(appState.user);
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Profile updated!');
      return true;
    }

    // -------------------------------------------------------------------------
    // 14. SETTINGS SCREEN (/settings) — Includes Input Channel (Requirement 7)
    // -------------------------------------------------------------------------
    function renderSettingsScreen() {
      var s = appState.settings;
      var aw = appState.activeWorkout;
      var inputModes = [
        { id: 'manual', label: '⌨️ Manual' },
        { id: 'sensor', label: '⌚ Auto-count' },
        { id: 'voice', label: '🎙️ Voice logging' },
        { id: 'lockscreen', label: '🔒 Lockscreen' }
      ];
      var modeButtonsHtml = inputModes.map(function(m) {
        var active = (aw.inputMethod === m.id);
        return '<button type="button" onclick="switchInputMethod(\'' + m.id + '\')" class="' + (active ? 'af-btn-primary !py-2 !px-3 text-xs' : 'af-btn-secondary !py-2 !px-3 text-xs') + '">' + m.label + '</button>';
      }).join('');

      return '' +
        '<div class="space-y-4">' +
          '<!-- Input Channel Control Moved to Settings (Requirement 7) -->' +
          '<div id="settings-input-channel-card" class="af-card p-4 space-y-3">' +
            '<div class="flex items-center justify-between">' +
              '<div>' +
                '<h2 class="text-sm font-bold">Input Channel (Save-Set Service)</h2>' +
                '<p class="text-[11px] af-text-muted">Select how sets are logged during workouts (Manual, Sensor Auto-count, Voice, or Lockscreen).</p>' +
              '</div>' +
              '<span class="af-badge af-badge-blue text-[10px] uppercase">Active: ' + escapeHtml(aw.inputMethod) + '</span>' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-2">' +
              modeButtonsHtml +
            '</div>' +
          '</div>' +

          '<!-- Appearance Section (Light & Dark Mode) -->' +
          '<div class="af-card p-4 space-y-3">' +
            '<div class="flex items-center justify-between">' +
              '<div>' +
                '<h2 class="text-sm font-bold">Theme & Appearance</h2>' +
                '<p class="text-[11px] af-text-muted">Switch between Light Mode and Dark Mode</p>' +
              '</div>' +
              '<span class="af-badge af-badge-blue text-[10px]">' + (appState.isDarkMode ? 'Dark Active' : 'Light Active') + '</span>' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-2.5">' +
              '<button type="button" onclick="setThemeExplicit(false)" class="' + (!appState.isDarkMode ? 'af-btn-primary text-xs' : 'af-btn-secondary text-xs') + '">☀️ Light Mode</button>' +
              '<button type="button" onclick="setThemeExplicit(true)" class="' + (appState.isDarkMode ? 'af-btn-primary text-xs' : 'af-btn-secondary text-xs') + '">🌙 Dark Mode</button>' +
            '</div>' +
          '</div>' +

          '<!-- Device, Sound & Notification Preferences -->' +
          '<div class="af-card p-4 space-y-3">' +
            '<h2 class="text-sm font-bold">Device, Timer & Sensor Preferences</h2>' +
            renderSettingToggleRow('bellSound', 'Timer Completion Bell Sound', 'Play a bell chime when the rest timer reaches 00:00', s.bellSound) +
            renderSettingToggleRow('restNotifications', 'Background Rest-Timer Notifications', 'Show a local notification if rest ends after leaving the app', s.restNotifications) +
            renderSettingToggleRow('sensorAutoDetect', 'Sensor Auto-Detect (Accelerometer)', 'Automatically count reps during active sets', s.sensorAutoDetect) +
            renderSettingToggleRow('voiceLogging', 'Voice Logging (Speech-to-Set)', 'Log weight and reps hands-free via voice commands', s.voiceLogging) +
            renderSettingToggleRow('lockscreenWidget', 'Lock Screen Quick-Log Widget', 'Enable 1-tap micro-workout set logging from lock screen', s.lockscreenWidget) +
            renderSettingToggleRow('hapticFeedback', 'Haptic Rest Timer Alerts', 'Vibrate when rest timer reaches 00:00', s.hapticFeedback) +
          '</div>' +

          '<!-- Adaptive Quiz & Demo Reset -->' +
          '<div class="af-card p-4 space-y-2.5">' +
            '<h2 class="text-sm font-bold">Adaptive Engine & State</h2>' +
            '<div class="flex flex-wrap gap-2">' +
              '<button type="button" onclick="retriggerQuizBanner()" class="af-btn-tint text-xs flex-1">Trigger Inactivity Quiz</button>' +
              '<button type="button" onclick="resetDemoState()" class="af-btn-secondary text-xs flex-1">Reset Seeded Data</button>' +
            '</div>' +
          '</div>' +

          '<button type="button" onclick="handleLogout()" class="af-btn-danger w-full text-xs">Log out</button>' +
        '</div>';
    }

    function renderSettingToggleRow(key, title, desc, checked) {
      return '' +
        '<div class="flex items-center justify-between gap-3 py-1.5 border-b last:border-b-0 af-border">' +
          '<div>' +
            '<div class="text-xs font-bold">' + escapeHtml(title) + '</div>' +
            '<div class="text-[11px] af-text-muted">' + escapeHtml(desc) + '</div>' +
          '</div>' +
          '<button type="button" onclick="toggleDeviceSetting(\'' + key + '\')" class="w-11 h-6 rounded-full p-0.5 transition-colors flex items-center ' + (checked ? 'justify-end' : 'justify-start') + '" style="background-color: ' + (checked ? 'var(--accent)' : 'var(--border-line)') + ';">' +
            '<span class="w-5 h-5 rounded-full bg-white shadow"></span>' +
          '</button>' +
        '</div>';
    }

    function toggleDeviceSetting(key) {
      appState.settings[key] = !appState.settings[key];
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Updated ' + key + ' preference');
    }

    function retriggerQuizBanner() {
      appState.showQuizBannerOnHome = true;
      navigateApp('quiz-prompt');
      showToast('Inactivity Quiz Prompt triggered!', 'info');
    }

    function resetDemoState() {
      clearRestInterval();
      stopBellSound();
      cancelScheduledRestNotification();
      appState.programs = JSON.parse(JSON.stringify(DEFAULT_PROGRAMS));
      appState.catalogue = JSON.parse(JSON.stringify(DEFAULT_CATALOGUE));
      appState.history = JSON.parse(JSON.stringify(DEFAULT_HISTORY));
      appState.isProgramAdjusted = false;
      appState.showQuizBannerOnHome = true;
      syncActiveWorkoutWithProgram(appState.programs[0], 'full', true);
      saveStateToStorage();
      renderCurrentScreen();
      showToast('Workout data reset to default split programs.');
    }

    function handleLogout() {
      appState.isLoggedIn = false;
      navigateApp('login');
      showToast('Logged out of AtomFit.', 'info');
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Initialize app immediately and on window.onload
    var appInitialized = false;
    function initAtomFitApp() {
      if (appInitialized) return;
      appInitialized = true;
      loadSavedState();
      applyThemeClass();
      renderCurrentScreen();
    }
    initAtomFitApp();
    window.onload = initAtomFitApp;
  </script>
</body>
</html>
